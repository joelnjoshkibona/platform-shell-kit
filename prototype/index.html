<script>
/* ---------------------------------------------------------------- PRODUCT: the only file a product edits for branding.
   Everything else in src/ is the platform shell (locked by the platform decisions in docs/PLATFORM_DECISIONS.md). */
const PRODUCT = {
  name: 'Fomu',                 // shown in the sidebar, sign-in, curtain and page titles
  tagline: 'Forms, results and approvals for every location',
  icon: 'ClipboardList',        // Lucide icon next to the name
  domain: 'fomu.app',           // used in copied links
  city: 'Dar es Salaam',        // footer
  storageKey: 'fomu',           // prefix for localStorage keys (theme, list views, recent searches)
};

const { markRaw, watchEffect, createApp, reactive, ref, computed, watch, nextTick, h, onMounted, onBeforeUnmount } = Vue;

/* ---------------------------------------------------------------- helpers */
const ulid = (p) => p + '_' + (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toUpperCase();
const cn = (...a) => a.flat().filter(Boolean).join(' ');

const TYPES = [
  { value: 'single_choice', label: 'Multiple choice', icon: 'CircleDot', logic: true, choice: true },
  { value: 'multi_choice', label: 'Checkboxes', icon: 'SquareCheck', choice: true },
  { value: 'true_false', label: 'True / False', icon: 'ToggleLeft', logic: true, choice: true },
  { value: 'dropdown', label: 'Dropdown', icon: 'SquareChevronDown', logic: true, choice: true },
  { value: 'linear_scale', label: 'Linear scale', icon: 'SlidersHorizontal' },
  { value: 'rating', label: 'Rating', icon: 'Star' },
  { value: 'choice_grid', label: 'Multiple choice grid', icon: 'Grid3x3', grid: true },
  { value: 'checkbox_grid', label: 'Checkbox grid', icon: 'LayoutGrid', grid: true },
];
const TYPE = Object.fromEntries(TYPES.map(t => [t.value, t]));

const ACCENTS = {
  teal:   { label: 'Teal',   l: '174 72% 26%', d: '170 62% 46%' },
  blue:   { label: 'Blue',   l: '221 83% 45%', d: '217 91% 64%' },
  violet: { label: 'Violet', l: '262 62% 50%', d: '262 80% 72%' },
  rose:   { label: 'Rose',   l: '346 72% 44%', d: '346 80% 66%' },
  amber:  { label: 'Amber',  l: '28 90% 36%',  d: '38 92% 56%' },
  slate:  { label: 'Slate',  l: '215 25% 27%', d: '215 20% 72%' },
};

const opt = (label, go_to = 'next') => ({ key: ulid('opt'), label, go_to });
const row = (label) => ({ key: ulid('row'), label });
function makeQuestion(type = 'single_choice', patch = {}) {
  const q = {
    key: ulid('q'), type, title: '', description: '', showDescription: false, required: false,
    logic: false, shuffle: false,
    options: [opt('Option 1')],
    scale: { min: 1, max: 5, min_label: '', max_label: '' },
    rating: { max: 5 },
    rows: [row('Row 1')], columns: [row('Column 1')],
    validation: { enabled: false, min: 1, max: null },
  };
  if (type === 'true_false') q.options = [opt('True'), opt('False')];
  return Object.assign(q, patch);
}
function makeSection(patch = {}) {
  return Object.assign({ key: ulid('sec'), title: '', description: '', time_limit_minutes: 5, next: 'auto', questions: [] }, patch);
}

/* ---------------------------------------------------------------- mock form (Kilima Retail is example data) */
const sec1 = makeSection({ title: 'About you', description: 'Tell us where you work. This decides which sections you see.', time_limit_minutes: 3 });
const sec2 = makeSection({ title: 'Product knowledge', description: 'Answer from memory. You cannot return to this section after it ends.', time_limit_minutes: 8 });
const sec3 = makeSection({ title: 'Feedback', description: '', time_limit_minutes: 4 });

sec1.questions = [
  makeQuestion('single_choice', { title: 'How long have you worked with Kilima Retail?', required: true, logic: true,
    options: [opt('Less than 2 weeks', sec3.key), opt('2 weeks to 6 months'), opt('More than 6 months')] }),
  makeQuestion('dropdown', { title: 'Which branch do you work at?', required: true,
    options: [opt('Arusha'), opt('Dar es Salaam (Kariakoo)'), opt('Dodoma'), opt('Mwanza')] }),
  makeQuestion('single_choice', { title: 'What is your role?', required: true,
    options: [opt('Cashier'), opt('Sales associate'), opt('Store supervisor'), opt('Stock controller')] }),
];
sec2.questions = [
  makeQuestion('multi_choice', { title: 'Which payment methods do our stores accept?', required: true, description: 'Select all that apply.', showDescription: true,
    options: [opt('Cash'), opt('M-Pesa'), opt('Tigo Pesa (Mixx by Yas)'), opt('Airtel Money'), opt('Bank card'), opt('Cheque')],
    validation: { enabled: true, min: 1, max: null } }),
  makeQuestion('true_false', { title: 'A customer can return opened electronics within 7 days if they have the receipt.', required: true }),
  makeQuestion('choice_grid', { title: 'How confident are you handling these situations?', required: true,
    rows: [row('Price disputes at the till'), row('Damaged goods returns'), row('Mobile money reversals')],
    columns: [row('Not confident'), row('Somewhat'), row('Very confident')] }),
];
sec3.questions = [
  makeQuestion('linear_scale', { title: "How useful was last month's product training?", required: true, scale: { min: 1, max: 5, min_label: 'Not useful', max_label: 'Very useful' } }),
  makeQuestion('rating', { title: "Rate your team's customer service this quarter.", rating: { max: 5 } }),
  makeQuestion('checkbox_grid', { title: 'Which shifts do you usually work?',
    rows: [row('Morning (07:00–15:00)'), row('Evening (13:00–21:00)')],
    columns: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(row) }),
];


/* ================================================================ GLOBAL: router, theme, organisation */
const __SRC = document.documentElement.outerHTML;
const IN_PHONE = !!window.__PHONE;
let storedTheme = 'system'; try { storedTheme = localStorage.getItem(PRODUCT.storageKey + '-theme') || 'system'; } catch (e) {}
const G = reactive({ isShell: () => false, route: window.__INIT_ROUTE || 'login', theme: storedTheme, navCollapsed: false, mobileNav: false, switching: false, newOrg: false, phone: false, view: window.__INIT_ROUTE || 'login', curtain: (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'idle' : 'closed', booting: true, curtainOn: true, search: '', pendingTab: null, responseCount: 0,
  org: { name: 'Kilima Retail', accent: 'teal', require2fa: true, viewDefaults: {} }, toast: () => {} });
function nav(route, sub) { if (G.leaveGuard && G.leaveGuard(route, sub)) return; G.pendingTab = sub || null; G.route = route; G.mobileNav = false; }
/* page transition: two halves close, loader, halves open, then page animations run */
const AREA = (r) => ['login', 'twofa', 'orgpick', 'forgot'].includes(r) ? 'auth' : r; // D13 (revised): every page change outside sign-in plays the curtain, sidebar included
const wait = (ms) => new Promise(r => setTimeout(r, ms));
let curtainBusy = false;
async function runCurtain() {
  if (curtainBusy) return; curtainBusy = true;
  do {
    G.curtain = 'closing'; await wait(440);
    G.curtain = 'closed'; window.scrollTo({ top: 0 }); await wait(window.__SLOW_PAGE === false ? 120 : 620); // prototype simulates a slow page so the loader (shown after 300ms, D13) is visible
    G.view = G.route; await nextTick(); await wait(90);
    G.curtain = 'opening'; await wait(600);

      </div>
      <input v-if="q.showDescription" class="line-input mt-2 text-sm" v-model="q.description" placeholder="Description" aria-label="Question description">

      <!-- choice options -->
      <div v-if="t.choice" class="mt-3 space-y-0">
        <div v-for="(o, i) in q.options" :key="o.key" class="group/opt flex flex-wrap items-center gap-x-3 gap-y-1 rounded-md py-0.5 pl-1 sm:flex-nowrap">
          <Icon name="GripVertical" :size="14" class="hidden text-muted-foreground/50 opacity-0 group-hover/opt:opacity-100 sm:block"/>
          <span v-if="indicator==='number'" class="w-4 shrink-0 text-right text-sm text-muted-foreground tnum">{{ i+1 }}.</span>
          <span v-else :class="['h-4 w-4 shrink-0 border border-muted-foreground/50', indicator==='square' ? 'rounded-sm' : 'rounded-full']"></span>
          <input data-opt class="line-input min-w-0 flex-1 basis-40 text-sm" v-model="o.label" @keydown="optKey($event, i)" :aria-label="'Option ' + (i+1)">
          <Select v-if="q.logic" class="order-last w-full pl-7 sm:order-none sm:w-56 sm:shrink-0 sm:pl-0" size="sm" v-model="o.go_to" :options="sectionTargets" align="end"/>
          <Button v-if="q.type!=='true_false' && q.options.length>1" variant="ghost" size="icon-sm" class="shrink-0 text-muted-foreground" @click="q.options.splice(i,1)" :aria-label="'Remove option ' + (i+1)"><Icon name="X" :size="16"/></Button>
        </div>
        <button v-if="q.type!=='true_false'" type="button" @click="addOption" class="flex items-center gap-3 rounded-md py-2 pl-1 text-sm text-muted-foreground hover:text-foreground">
          <span class="hidden w-[14px] sm:block"></span>
          <span :class="['h-4 w-4 shrink-0 border border-dashed border-muted-foreground/50', indicator==='square' ? 'rounded-sm' : 'rounded-full']"></span>Add option</button>
        <p v-if="q.type==='true_false'" class="pl-1 pt-1 text-xs text-muted-foreground">True / False always has two answers. You can rename them (for example Yes / No).</p>
      </div>

      <!-- multi validation -->
      <div v-if="q.type==='multi_choice' && q.validation.enabled" class="mt-3 flex flex-wrap items-center gap-2 rounded-lg border border-dashed p-3 text-sm">
        <span class="text-muted-foreground">Select at least</span>
        <Input class="!w-16" type="number" min="0" v-model.number="q.validation.min"/>
        <span class="text-muted-foreground">and at most</span>
        <Input class="!w-16" type="number" min="1" v-model.number="q.validation.max" placeholder="Any"/>
      </div>

      <!-- linear scale -->
      <div v-if="q.type==='linear_scale'" class="mt-4 space-y-3">
        <div class="flex items-center gap-3 text-sm"><Select class="w-20" v-model="q.scale.min" :options="scaleMin"/><span class="text-muted-foreground">to</span><Select class="w-20" v-model="q.scale.max" :options="scaleMax"/></div>
        <div class="grid gap-2 sm:grid-cols-2">
          <div class="flex items-center gap-3"><span class="w-6 text-right text-sm text-muted-foreground tnum">{{ q.scale.min }}</span><input class="line-input text-sm" v-model="q.scale.min_label" placeholder="Label (optional)"></div>
          <div class="flex items-center gap-3"><span class="w-6 text-right text-sm text-muted-foreground tnum">{{ q.scale.max }}</span><input class="line-input text-sm" v-model="q.scale.max_label" placeholder="Label (optional)"></div>
        </div>
      </div>

      <!-- rating -->
      <div v-if="q.type==='rating'" class="mt-4 flex flex-wrap items-center gap-4">
        <div class="flex items-center gap-2 text-sm"><span class="text-muted-foreground">Levels</span><Select class="w-20" v-model="q.rating.max" :options="ratingMax"/></div>
        <div class="flex gap-1 text-fa"><Icon v-for="n in q.rating.max" :key="n" name="Star" :size="22"/></div>
      </div>

      <!-- grids -->
      <div v-if="t.grid" class="mt-4 grid gap-6 sm:grid-cols-2">
        <div v-for="part in [{k:'rows',label:'Rows',base:'Row'},{k:'columns',label:'Columns',base:'Column'}]" :key="part.k">
          <p class="mb-1 text-xs font-medium uppercase tracking-wider text-muted-foreground">{{ part.label }}</p>
          <div v-for="(r, i) in q[part.k]" :key="r.key" class="flex items-center gap-2">
            <span class="w-5 shrink-0 text-right text-sm text-muted-foreground tnum">{{ i+1 }}.</span>
            <input class="line-input text-sm" v-model="r.label">
            <Button v-if="q[part.k].length>1" variant="ghost" size="icon-sm" class="shrink-0 text-muted-foreground" @click="q[part.k].splice(i,1)" :aria-label="'Remove ' + part.base"><Icon name="X" :size="16"/></Button>
          </div>
          <button type="button" class="mt-1 pl-7 text-sm text-muted-foreground hover:text-foreground" @click="addRow(q[part.k], part.base)">Add {{ part.base.toLowerCase() }}</button>
        </div>
        <p class="text-xs text-muted-foreground sm:col-span-2">{{ q.type==='choice_grid' ? 'One answer per row.' : 'Any number of answers per row.' }} On phones each row becomes its own block.</p>
      </div>

      <!-- footer -->
      <div class="mt-3 flex items-center justify-end gap-1 border-t py-1.5">
        <Tooltip content="Duplicate"><Button variant="ghost" size="icon" @click="duplicateQuestion(q.key)" aria-label="Duplicate question"><Icon name="Copy"/></Button></Tooltip>
        <Tooltip content="Delete"><Button variant="ghost" size="icon" @click="deleteQuestion(q.key)" aria-label="Delete question"><Icon name="Trash2"/></Button></Tooltip>
        <Separator orientation="vertical" class="mx-2"/>
        <label class="flex cursor-pointer items-center gap-2 px-1 text-sm" :for="'req-'+q.key">Required <Switch :id="'req-'+q.key" v-model="q.required"/></label>
        <DropdownMenu :items="menuItems" @select="onMenu" label="Show">
          <template #trigger><Button variant="ghost" size="icon" aria-label="More options"><Icon name="EllipsisVertical"/></Button></template>
        </DropdownMenu>
      </div>
    </div>
  </div>`
};

/* ---------------------------------------------------------------- SectionHeader */
const SectionHeader = {
  props: { sec: Object, si: Number },
  setup(p) {
    const active = computed(() => S.active === 'sec:' + p.sec.key);
    const menu = computed(() => [
      { id: 'up', label: 'Move section up', icon: 'ArrowUp', disabled: p.si === 0 },
      { id: 'down', label: 'Move section down', icon: 'ArrowDown', disabled: p.si === S.form.sections.length - 1 },
      { separator: true },
      { id: 'del', label: 'Delete section', icon: 'Trash2', destructive: true, disabled: S.form.sections.length === 1 },
    ]);
    function onMenu(it) {
      const arr = S.form.sections, i = p.si;
      if (it.id === 'up' && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
      if (it.id === 'down' && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
      if (it.id === 'del') S.confirmDel = p.sec.key;
    }
    return { S, active, menu, onMenu };
  },
  template: `
  <div :data-card="'sec:' + sec.key" class="relative" @click="S.active = 'sec:' + sec.key">
    <div v-if="S.form.sections.length > 1" class="inline-flex items-center gap-2 rounded-t-lg bg-primary px-3 py-1.5 text-xs font-medium text-primary-foreground">
      Section {{ si+1 }} of {{ S.form.sections.length }}
    </div>
    <div :class="['relative border bg-card text-card-foreground shadow-sm', S.form.sections.length > 1 ? 'rounded-b-xl rounded-tr-xl border-t-2 border-t-primary' : 'rounded-xl', active ? 'shadow-md ring-1 ring-primary/30' : '']">
      <span v-if="active" class="absolute inset-y-0 left-0 w-1 rounded-bl-xl bg-primary" aria-hidden="true"></span>
      <div class="flex items-start gap-2 px-4 py-3 sm:px-5">
        <div class="min-w-0 flex-1">
          <textarea rows="1" style="field-sizing:content" class="line-input resize-none text-lg font-semibold tracking-tight" v-model="sec.title" @keydown.enter.prevent placeholder="Untitled section" aria-label="Section title" :data-autofocus="active || null"></textarea>
          <textarea rows="1" style="field-sizing:content" class="line-input mt-1 resize-none text-sm text-muted-foreground" v-model="sec.description" placeholder="Description (optional)" aria-label="Section description"></textarea>
          <div class="mt-2 flex flex-wrap items-center gap-2 text-xs text-muted-foreground">
            <span class="tnum">{{ sec.questions.length }} {{ sec.questions.length===1 ? 'question' : 'questions' }}</span>
            <template v-if="S.settings.timer_mode==='per_section'">
              <span aria-hidden="true">·</span>
              <label class="inline-flex items-center gap-1.5 rounded-md border bg-background px-2 py-1 text-foreground" @click.stop>
                <Icon name="Timer" :size="13" class="text-warning"/>
                <input type="number" min="1" max="240" v-model.number="sec.time_limit_minutes" class="w-9 bg-transparent text-right outline-none tnum" aria-label="Section time limit in minutes"> min
              </label>
            </template>
          </div>
        </div>
        <DropdownMenu v-if="S.form.sections.length>1" :items="menu" @select="onMenu"><template #trigger><Button variant="ghost" size="icon" aria-label="Section options"><Icon name="EllipsisVertical"/></Button></template></DropdownMenu>
      </div>
    </div>
  </div>`
};

/* ---------------------------------------------------------------- FormRenderer (shared with live form) */
const FormRenderer = {
  props: { device: String },
  setup(p) {
    const st = reactive({ stage: 'start', si: 0, path: [], answers: {}, errors: {}, secLeft: 0, violations: 0 });
    let tick = null;
    const sections = computed(() => S.form.sections);
    const sec = computed(() => sections.value[st.si]);
    const totalQ = computed(() => allQuestions().length);
    const accent = computed(() => ACCENTS[S.settings.accent]);
    function startTimer() {
      clearInterval(tick);
      if (S.settings.timer_mode === 'off') return;
      st.secLeft = S.settings.timer_mode === 'per_section' ? sec.value.time_limit_minutes * 60 : (st.secLeft || S.settings.time_limit_minutes * 60);
      tick = setInterval(() => { st.secLeft = Math.max(0, st.secLeft - 1); }, 1000);
    }
    onBeforeUnmount(() => clearInterval(tick));
    const clock = computed(() => { const m = Math.floor(st.secLeft / 60), s = st.secLeft % 60; return `${m}:${String(s).padStart(2, '0')}`; });
    function nextTarget() {
      for (const q of sec.value.questions) {
        if (q.logic && st.answers[q.key]) { const o = q.options.find(o => o.key === st.answers[q.key]); if (o && o.go_to !== 'next') return o.go_to; }
      }
      if (sec.value.next && sec.value.next !== 'auto') return sec.value.next;
      return st.si + 1 >= sections.value.length ? 'submit' : sections.value[st.si + 1].key;
    }
    const isLast = computed(() => nextTarget() === 'submit');
    function answered(q) {
      const a = st.answers[q.key];
      if (TYPE[q.type].grid) return a && q.rows.every(r => q.type === 'choice_grid' ? a[r.key] : (a[r.key] || []).length);
      if (q.type === 'multi_choice') return a && a.length >= Math.max(1, q.validation.enabled ? (q.validation.min || 1) : 1);
      return a != null && a !== '';
    }
    function validate() {
      st.errors = {};
      sec.value.questions.forEach(q => { if (q.required && !answered(q)) st.errors[q.key] = TYPE[q.type].grid ? 'Answer every row.' : 'This question is required.'; });
      return !Object.keys(st.errors).length;
    }
    function next() {
      if (!validate()) { nextTick(() => document.querySelector('.frame [data-err]')?.scrollIntoView({ behavior: 'smooth', block: 'center' })); return; }
      const t = nextTarget();
      if (t === 'submit') { st.stage = 'done'; clearInterval(tick); return; }
      st.path.push(st.si); st.si = sections.value.findIndex(s => s.key === t); startTimer();
      document.querySelector('.frame-scroll')?.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function back() { if (S.settings.timer_mode === 'per_section') return; st.si = st.path.pop() ?? 0; }
    function start() { st.stage = 'section'; st.si = 0; st.path = []; st.answers = {}; st.errors = {}; st.secLeft = 0; startTimer(); }
    function setGrid(q, r, c, multi) {
      const a = st.answers[q.key] || (st.answers[q.key] = {});
      if (multi) { const arr = a[r] || (a[r] = []); const i = arr.indexOf(c); i > -1 ? arr.splice(i, 1) : arr.push(c); }
      else a[r] = c;
    }
    function toggleMulti(q, k) { const a = st.answers[q.key] || (st.answers[q.key] = []); const i = a.indexOf(k); i > -1 ? a.splice(i, 1) : a.push(k); }
    const progress = computed(() => st.stage === 'done' ? 100 : Math.round(((st.si) / sections.value.length) * 100));
    return { S, st, sec, sections, totalQ, accent, clock, isLast, next, back, start, setGrid, toggleMulti, progress, TYPE, range: (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i) };
  },
  template: `
  <div class="form-theme frame min-h-full" :style="{ '--fa-l': accent.l, '--fa-d': accent.d }">
    <div class="mx-auto max-w-[680px] px-3 py-4 sm:py-8">
      <!-- START -->
      <div v-if="st.stage==='start'" class="overflow-hidden rounded-xl border bg-card shadow-sm">
        <div class="h-2 bg-fa"></div>
        <div class="r-pad p-6 sm:p-8">
          <p class="text-xs font-medium uppercase tracking-wider text-muted-foreground">{{ S.org.name }}</p>
          <h1 class="mt-2 text-2xl font-semibold tracking-tight" style="text-wrap:balance">{{ S.form.title || 'Untitled form' }}</h1>
          <p class="mt-2 text-sm text-muted-foreground">{{ S.form.description }}</p>
          <ul class="mt-6 grid gap-3 text-sm">
            <li class="flex gap-3"><Icon name="Rows3" class="mt-0.5 text-fa"/><span>{{ sections.length }} sections, {{ totalQ }} questions</span></li>
            <li v-if="S.settings.timer_mode==='per_section'" class="flex gap-3"><Icon name="Timer" class="mt-0.5 text-fa"/><span>Each section is timed. You cannot go back to a section once you leave it.</span></li>
            <li v-if="S.settings.timer_mode==='whole_form'" class="flex gap-3"><Icon name="Timer" class="mt-0.5 text-fa"/><span>You have {{ S.settings.time_limit_minutes }} minutes once you start.</span></li>
            <li v-if="S.settings.require_fullscreen" class="flex gap-3"><Icon name="Maximize" class="mt-0.5 text-fa"/><span>The form opens in full screen. Leaving full screen counts as a violation.</span></li>
            <li v-if="S.settings.single_tab || S.settings.block_copy_paste" class="flex gap-3"><Icon name="ShieldCheck" class="mt-0.5 text-fa"/><span>Stay on this tab. {{ S.settings.block_copy_paste ? 'Copy and paste are turned off.' : '' }}</span></li>
            <li v-if="S.settings.one_response" class="flex gap-3"><Icon name="Mail" class="mt-0.5 text-fa"/><span>One response per email address.</span></li>
          </ul>
          <div class="mt-8 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between">
            <p class="text-xs text-muted-foreground">Preview skips email verification and integrity checks.</p>
            <button type="button" @click="start" class="inline-flex h-10 items-center justify-center gap-2 rounded-md bg-fa px-6 text-sm font-medium text-fa-fg shadow-sm hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fa focus-visible:ring-offset-2 focus-visible:ring-offset-background">Start <Icon name="ArrowRight"/></button>
          </div>
        </div>
      </div>

      <!-- SECTION -->
      <template v-else-if="st.stage==='section'">
        <div class="sticky top-0 z-10 -mx-3 mb-3 bg-canvas/90 px-3 pb-2 pt-1 backdrop-blur">
          <div class="flex items-center justify-between gap-3 text-xs text-muted-foreground">
            <span class="tnum">Section {{ st.si+1 }} of {{ sections.length }}</span>
            <span v-if="S.settings.timer_mode!=='off'" :class="['inline-flex items-center gap-1.5 rounded-full border bg-card px-2.5 py-1 font-medium tnum', st.secLeft < 60 ? 'border-destructive/40 text-destructive' : 'text-foreground']"><Icon name="Timer" :size="13"/>{{ clock }}</span>
          </div>
          <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-muted"><div class="h-full rounded-full bg-fa transition-all duration-300" :style="{ width: progress + '%' }"></div></div>
        </div>
        <div class="overflow-hidden rounded-xl border bg-card shadow-sm">
          <div class="h-1.5 bg-fa"></div>
          <div class="r-pad px-6 py-5"><h2 class="text-lg font-semibold">{{ sec.title || 'Untitled section' }}</h2><p v-if="sec.description" class="mt-1 text-sm text-muted-foreground">{{ sec.description }}</p></div>
        </div>
        <div class="mt-3 space-y-3">
          <div v-for="q in sec.questions" :key="q.key" :data-err="st.errors[q.key] ? '' : null" :class="['r-pad rounded-xl border bg-card p-6 shadow-sm', st.errors[q.key] ? 'border-destructive/60' : '']">
            <p class="text-[15px] font-medium leading-snug">{{ q.title || 'Untitled question' }}<span v-if="q.required" class="ml-0.5 text-destructive">*</span></p>
            <p v-if="q.showDescription && q.description" class="mt-1 text-sm text-muted-foreground">{{ q.description }}</p>
            <div class="mt-4">
              <div v-if="q.type==='single_choice' || q.type==='true_false'" class="grid gap-1" role="radiogroup">
                <label v-for="o in q.options" :key="o.key" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-lg px-2 text-sm hover:bg-muted/60">
                  <input type="radio" class="peer sr-only" :name="q.key" :value="o.key" v-model="st.answers[q.key]">
                  <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full border-2 border-muted-foreground/50 peer-checked:border-fa peer-focus-visible:ring-2 peer-focus-visible:ring-fa/40"><span v-if="st.answers[q.key]===o.key" class="h-2.5 w-2.5 rounded-full bg-fa"></span></span>{{ o.label }}</label>
              </div>
              <div v-else-if="q.type==='multi_choice'" class="grid gap-1">
                <label v-for="o in q.options" :key="o.key" class="flex min-h-11 cursor-pointer items-center gap-3 rounded-lg px-2 text-sm hover:bg-muted/60">
                  <input type="checkbox" class="peer sr-only" :checked="(st.answers[q.key]||[]).includes(o.key)" @change="toggleMulti(q, o.key)">
                  <span :class="['grid h-5 w-5 shrink-0 place-items-center rounded border-2 peer-focus-visible:ring-2 peer-focus-visible:ring-fa/40', (st.answers[q.key]||[]).includes(o.key) ? 'border-fa bg-fa text-fa-fg' : 'border-muted-foreground/50']"><Icon v-if="(st.answers[q.key]||[]).includes(o.key)" name="Check" :size="13" stroke-width="3"/></span>{{ o.label }}</label>
              </div>
              <Select v-else-if="q.type==='dropdown'" class="max-w-sm" v-model="st.answers[q.key]" :options="q.options.map(o=>({value:o.key,label:o.label}))" placeholder="Choose"/>
              <div v-else-if="q.type==='linear_scale'">
                <div class="scale-row flex items-end justify-between gap-1">
                  <button v-for="n in range(q.scale.min, q.scale.max)" :key="n" type="button" @click="st.answers[q.key]=n" :aria-pressed="st.answers[q.key]===n"
                    :class="['grid h-11 min-w-11 flex-1 place-items-center rounded-lg border text-sm font-medium transition-colors tnum', st.answers[q.key]===n ? 'border-fa bg-fa text-fa-fg' : 'hover:bg-muted']">{{ n }}</button>
                </div>
                <div class="mt-2 flex justify-between text-xs text-muted-foreground"><span>{{ q.scale.min_label }}</span><span>{{ q.scale.max_label }}</span></div>
              </div>
              <div v-else-if="q.type==='rating'" class="flex flex-wrap gap-1">
                <button v-for="n in q.rating.max" :key="n" type="button" @click="st.answers[q.key]=n" :aria-label="n + ' of ' + q.rating.max" class="grid h-11 w-11 place-items-center rounded-lg hover:bg-muted">
                  <Icon name="Star" :size="26" :class="(st.answers[q.key]||0) >= n ? 'text-fa' : 'text-muted-foreground/50'" :fill="(st.answers[q.key]||0) >= n ? 'currentColor' : 'none'"/></button>
              </div>
              <template v-else>
                <div class="grid-table overflow-x-auto"><table class="w-full text-sm">
                  <thead><tr><th></th><th v-for="c in q.columns" :key="c.key" class="px-2 pb-2 text-center text-xs font-medium text-muted-foreground">{{ c.label }}</th></tr></thead>
                  <tbody><tr v-for="r in q.rows" :key="r.key" class="border-t"><td class="py-3 pr-3">{{ r.label }}</td>
                    <td v-for="c in q.columns" :key="c.key" class="text-center"><button type="button" @click="setGrid(q, r.key, c.key, q.type==='checkbox_grid')" :aria-label="r.label + ': ' + c.label"
                      :class="['inline-grid h-5 w-5 place-items-center border-2', q.type==='checkbox_grid' ? 'rounded' : 'rounded-full', (q.type==='checkbox_grid' ? ((st.answers[q.key]||{})[r.key]||[]).includes(c.key) : (st.answers[q.key]||{})[r.key]===c.key) ? 'border-fa bg-fa' : 'border-muted-foreground/50']"></button></td></tr></tbody>
                </table></div>
                <div class="grid-stack flex-col gap-4">
                  <div v-for="r in q.rows" :key="r.key" class="rounded-lg border p-3"><p class="text-sm font-medium">{{ r.label }}</p>
                    <div class="mt-2 flex flex-wrap gap-2"><button v-for="c in q.columns" :key="c.key" type="button" @click="setGrid(q, r.key, c.key, q.type==='checkbox_grid')"
                      :class="['min-h-9 rounded-full border px-3 text-sm', (q.type==='checkbox_grid' ? ((st.answers[q.key]||{})[r.key]||[]).includes(c.key) : (st.answers[q.key]||{})[r.key]===c.key) ? 'border-fa bg-fa text-fa-fg' : 'hover:bg-muted']">{{ c.label }}</button></div></div>
                </div>
              </template>
            </div>
            <p v-if="st.errors[q.key]" class="mt-3 flex items-center gap-1.5 text-sm text-destructive"><Icon name="CircleAlert" :size="14"/>{{ st.errors[q.key] }}</p>
          </div>
        </div>
        <div class="mt-5 flex items-center justify-between gap-3">
          <button v-if="st.path.length && S.settings.timer_mode!=='per_section'" type="button" @click="back" class="inline-flex h-10 items-center gap-2 rounded-md border bg-card px-4 text-sm font-medium hover:bg-muted"><Icon name="ArrowLeft"/>Back</button>
          <span v-else class="text-xs text-muted-foreground">{{ S.settings.timer_mode==='per_section' ? 'Timed sections: going back is off.' : '' }}</span>
          <button type="button" @click="next" class="inline-flex h-10 items-center gap-2 rounded-md bg-fa px-6 text-sm font-medium text-fa-fg shadow-sm hover:opacity-90">{{ isLast ? 'Submit' : 'Next' }}<Icon :name="isLast ? 'Send' : 'ArrowRight'"/></button>
        </div>
      </template>

      <!-- DONE -->
      <div v-else class="overflow-hidden rounded-xl border bg-card text-center shadow-sm">
        <div class="h-2 bg-fa"></div>
        <div class="r-pad p-8">

    const newInvite = ref('');

    function addInvites() {
      const list = newInvite.value.split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean);

      let added = 0;

/* ---------------------------------------------------------------- App */
const BuilderView = {
  setup() {
    if (G.pendingTab) { S.tab = G.pendingTab; G.pendingTab = null; }
    const savedAgo = ref('just now');
    let iv = setInterval(() => { const s = Math.round((Date.now() - S.lastSaved) / 1000); savedAgo.value = s < 5 ? 'just now' : s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; }, 1000);
    onBeforeUnmount(() => clearInterval(iv));
    const tabs = computed(() => [{ value: 'questions', label: 'Questions' }, { value: 'responses', label: 'Responses', count: G.responseCount }, { value: 'settings', label: 'Settings' }]);
    const themeItems = computed(() => [
      { id: 'light', label: 'Light', icon: 'Sun', checked: S.theme === 'light' },
      { id: 'dark', label: 'Dark', icon: 'Moon', checked: S.theme === 'dark' },
      { id: 'system', label: 'System', icon: 'Laptop', checked: S.theme === 'system' },
    ]);
    const moreItems = computed(() => [
      { id: 'link', label: 'Copy responder link', icon: 'Link' },
      { id: 'spec', label: 'Design spec', icon: 'Ruler' },
      { separator: true },
      ...themeItems.value.map(t => ({ ...t, label: 'Theme: ' + t.label })),
    ]);
    const device = ref('desktop');
    const devices = [{ value: 'desktop', icon: 'Monitor', label: 'Desktop', w: '100%' }, { value: 'tablet', icon: 'Tablet', label: 'Tablet', w: '768px' }, { value: 'mobile', icon: 'Smartphone', label: 'Phone', w: '390px' }];
    const frameW = computed(() => devices.find(d => d.value === device.value).w);
    const previewKey = ref(0);
    function openPreview() { previewKey.value++; S.preview = true; }
    function copyLink() { const t = `https://forms.app/f/${S.settings.slug}`; try { navigator.clipboard.writeText(t).then(() => toast('Link copied', t, 'Link'), () => toast('Copy this link', t, 'Link')); } catch (e) { toast('Copy this link', t, 'Link'); } }
    function onMore(it) { if (it.id === 'link') copyLink(); else if (it.id === 'spec') S.spec = true; else S.theme = it.id; }
    const dirty = computed(() => S.edits > 0);
    const issues = computed(() => {
      const out = [];
      allQuestions().forEach((q, i) => { if (!q.title.trim()) out.push(`Question ${i + 1} has no title.`); });
      S.form.sections.forEach((s, i) => { if (S.form.sections.length > 1 && !s.title.trim()) out.push(`Section ${i + 1} has no title.`); if (!s.questions.length) out.push(`Section ${i + 1} has no questions.`); });
      return out;
    });
    function publish() {
      S.published = { version: S.published.version + 1, at: 'Just now' }; S.edits = 0; S.publishDlg = false;
      const pending = S.settings.invites.filter(i => i.status === 'pending'); pending.forEach(i => i.status = 'sent');
      toast(`Version ${S.published.version} is live`, pending.length ? `${pending.length} invitation${pending.length > 1 ? 's' : ''} sent.` : 'New respondents see this version. Open attempts finish on the old one.', 'Send');
    }
    function confirmDelete() { deleteSection(S.confirmDel); S.confirmDel = null; }
    const counts = computed(() => ({ s: S.form.sections.length, q: allQuestions().length }));
    function canvasClick(e) { if (e.target === e.currentTarget) S.active = null; }
    const setTab = (v) => v === 'responses' ? nav('responses') : (S.tab = v);
    return { S, setTab, savedAgo, tabs, themeItems, moreItems, onMore, device, devices, frameW, previewKey, openPreview, copyLink, dirty, issues, publish, addQuestion, addSection, confirmDelete, counts, canvasClick, onDragOverSection, ACCENTS };
  },

const OtpInput = {
  setup() {
    const refs = ref([]);
    function focus(i) { nextTick(() => refs.value[i]?.focus()); }
    function onInput(e, i) {
      const v = e.target.value.replace(/\D/g, '');
      if (v.length > 1) { fill(v); return; }
      R.code[i] = v; R.codeErr = '';
      if (v && i < 5) focus(i + 1);
      if (R.code.every(Boolean)) verify();
    }
    function fill(v) { v.slice(0, 6).split('').forEach((d, k) => R.code[k] = d); focus(Math.min(5, v.length)); if (R.code.every(Boolean)) verify(); }
    function onKey(e, i) {
      if (e.key === 'Backspace' && !R.code[i] && i > 0) { R.code[i - 1] = ''; focus(i - 1); }
      if (e.key === 'ArrowLeft' && i > 0) focus(i - 1);
      if (e.key === 'ArrowRight' && i < 5) focus(i + 1);
    }
    function onPaste(e) { e.preventDefault(); fill((e.clipboardData.getData('text') || '').replace(/\D/g, '')); }
    function verify() {
      R.verifying = true;
      setTimeout(() => {
        R.verifying = false;
        if (R.code.join('') === CODE) { R.stage = 'rules'; return; }
        R.codeTries++; R.code = ['', '', '', '', '', ''];
        R.codeErr = R.codeTries >= 5 ? 'Too many wrong codes. Request a new code.' : `That code is not right. ${5 - R.codeTries} ${5 - R.codeTries === 1 ? 'try' : 'tries'} left.`;
        focus(0);
      }, 700);
    }
    onMounted(() => focus(0));
    return { R, refs, onInput, onKey, onPaste };
  },
  template: `<div class="flex justify-between gap-1.5 sm:justify-start sm:gap-2" @paste="onPaste">
    <template v-for="(d, i) in R.code" :key="i">
      <input :ref="el => refs[i] = el" :value="d" @input="onInput($event, i)" @keydown="onKey($event, i)" inputmode="numeric" :autocomplete="i===0 ? 'one-time-code' : 'off'" maxlength="6" :aria-label="'Digit ' + (i+1)"
        :disabled="R.verifying || R.codeTries >= 5"
        :class="['h-12 w-11 rounded-md border bg-background text-center text-lg font-semibold tnum shadow-sm outline-none transition-all focus:border-fa focus:ring-2 focus:ring-fa/30 disabled:opacity-50 sm:w-12', R.codeErr ? 'border-destructive' : 'border-input']">

    </template></div>`
};

  const grid = q.rows.map(rw => ({ key: rw.key, label: rw.label, cells: q.columns.map(c => { const n = ans.filter(r => { const v = (r.answers[q.key] || {})[rw.key]; return Array.isArray(v) ? v.includes(c.key) : v === c.key; }).length; return { key: c.key, label: c.label, count: n, pct: pct(n, ans.length) }; }) }));
  return { ...base, grid, columns: q.columns };
}

function untip() { S.tip = null; }

const DonutView = {
  props: { rows: Array, denom: Number },
  setup(p) {
    const ready = useGrow();
    const R = 40, C = 2 * Math.PI * R;
    const segs = computed(() => {
      let rows = [...p.rows];
      if (rows.length > 5) { const rest = rows.slice(4); rows = rows.slice(0, 4).concat([{ key: 'other', label: 'Other', count: rest.reduce((a, r) => a + r.count, 0), pct: Math.round(rest.reduce((a, r) => a + r.pct, 0) * 10) / 10, other: true }]); }
      const total = rows.reduce((a, r) => a + r.count, 0) || 1; let acc = 0;
      return rows.map((r, i) => { const len = (r.count / total) * C; const s = { ...r, color: r.other ? 'var(--c-other)' : `var(--c${i + 1})`, len: Math.max(0, len - 2), off: -acc }; acc += len; return s; });
    });
    return { ready, R, C, segs, tip, untip };
  },
  template: `<div class="flex flex-col items-center gap-5 sm:flex-row">
    <svg viewBox="0 0 100 100" class="h-36 w-36 shrink-0 -rotate-90" role="img" :aria-label="'Donut chart, ' + denom + ' answers'">

      <circle v-for="(s, i) in segs" :key="s.key" cx="50" cy="50" :r="R" fill="none" :stroke="s.color" stroke-width="14"

    <ul class="grid w-full gap-1.5 text-sm">

/* ---------------------------------------------------------------- cards */
const KpiCard = {
  props: { label: String, value: Number, decimals: { default: 0 }, suffix: { default: '' }, format: Function, sub: String, icon: String, tone: { default: 'default' }, spark: Array, meter: Number, delay: { default: 0 } },
  setup(p) {
    const shown = ref(0); let raf = null;
    function animate(to) { cancelAnimationFrame(raf); const from = shown.value, t0 = performance.now(), d = 700;
      const step = (t) => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); shown.value = from + (to - from) * e; if (k < 1) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); }
    onMounted(() => setTimeout(() => animate(p.value), p.delay)); watch(() => p.value, animate);
    const text = computed(() => p.format ? p.format(shown.value) : shown.value.toFixed(p.decimals) + p.suffix);
    const path = computed(() => { if (!p.spark) return null; const m = Math.max(1, ...p.spark), n = p.spark.length; const pts = p.spark.map((v, i) => [(i / (n - 1)) * 100, 28 - (v / m) * 24]); return { line: 'M' + pts.map(x => x.join(',')).join(' L'), area: 'M0,30 L' + pts.map(x => x.join(',')).join(' L') + ' L100,30 Z', end: pts[n - 1] }; });
    return { text, path, ready: useGrow() };
  },
  template: `<div class="kpi rounded-xl border bg-card p-3.5 shadow-sm transition-shadow hover:shadow-md" :style="{ animationDelay: delay + 'ms' }">
    <div class="flex items-center justify-between gap-2"><p class="truncate text-xs font-medium text-muted-foreground">{{ label }}</p>
      <span :class="['grid h-6 w-6 shrink-0 place-items-center rounded-md', tone==='warn' ? 'bg-warning/15 text-warning' : tone==='danger' ? 'bg-destructive/10 text-destructive' : 'bg-primary/10 text-primary']"><Icon :name="icon" :size="13"/></span></div>
    <p class="mt-1.5 text-2xl font-semibold tracking-tight tnum">{{ text }}</p>
    <div class="mt-1 flex min-h-[28px] items-end justify-between gap-2">
      <p class="text-[11px] leading-tight text-muted-foreground">{{ sub }}</p>
      <svg v-if="path" viewBox="0 0 100 30" class="h-7 w-20 shrink-0 overflow-visible" preserveAspectRatio="none" aria-hidden="true">
        <path :d="path.area" fill="var(--c1)" opacity=".12"/><path :d="path.line" fill="none" stroke="var(--c1)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round" class="spark"/>
      </svg>
      <span v-else-if="meter != null" class="mb-1 h-1.5 w-20 shrink-0 overflow-hidden rounded-full" style="background:color-mix(in oklab,var(--c1) 18%,hsl(var(--card)))"><span class="block h-full rounded-full bg-c1 transition-[width] duration-700 ease-out" :style="{ width: (ready ? meter : 0) + '%' }"></span></span>
    </div></div>`
};

const ChartCard = {
  props: { q: Object, idx: Number },
  setup(p) {
    const st = computed(() => statsFor(p.q));
    const views = TYPE_VIEWS[p.q.type];
    const def = computed(() => G.org.viewDefaults[p.q.type] || views[0]);
    const view = computed(() => S.views[p.q.key] || def.value);
    const isDefault = computed(() => !S.views[p.q.key]);
    function setView(v) {
      if (v === def.value) delete S.views[p.q.key]; else S.views[p.q.key] = v;
      if (!S.savedHint) { S.savedHint = true; toast('View saved for this form', 'Everyone who opens these results sees the same view.', 'ChartBarBig'); }
    }
    const denom = computed(() => st.value.answered);
    const t = TYPE[p.q.type];
    const secIndex = SECS.findIndex(s => s.key === p.q._sec) + 1;
    const wide = ['choice_grid', 'checkbox_grid'].includes(p.q.type);
    return { S, st, views, view, def, isDefault, setView, denom, t, VIEWS, secIndex, wide };
  },
  template: `<article :class="['kpi min-w-0 rounded-xl border bg-card shadow-sm', wide ? 'xl:col-span-2' : '']" :style="{ animationDelay: (120 + idx * 50) + 'ms' }">
    <header class="flex items-start gap-3 border-b px-4 py-3">

        <h3 class="text-sm font-medium leading-snug">{{ q.title }}</h3>

          <span>{{ denom }} answered</span>
          <template v-if="st.seen < st.total"><span aria-hidden="true">·</span><span class="inline-flex items-center gap-1"><Icon name="Split" :size="11"/>Section {{ secIndex }} skipped by {{ st.total - st.seen }}</span></template>
          <template v-else-if="st.answered < st.seen"><span aria-hidden="true">·</span><span>{{ st.seen - st.answered }} left blank</span></template>
        </p>
      </div>
      <div class="flex shrink-0 items-center rounded-md border bg-muted/40 p-0.5" role="radiogroup" :aria-label="'Chart view for ' + q.title">
        <Tooltip v-for="v in views" :key="v" :content="VIEWS[v].label + (v===def ? ' (default)' : '')" side="bottom">
          <button type="button" role="radio" :aria-checked="view===v" @click="setView(v)" :aria-label="VIEWS[v].label"
            :class="['grid h-6 w-7 place-items-center rounded transition-colors', view===v ? 'bg-background text-foreground shadow-sm' : 'text-muted-foreground hover:text-foreground']"><Icon :name="VIEWS[v].icon" :size="14"/></button>
        </Tooltip>
      </div>
    </header>
    <div class="px-4 py-4">
      <div v-if="!denom" class="grid place-items-center py-8 text-center text-sm text-muted-foreground"><Icon name="ListFilter" :size="20"/><p class="mt-2">No answers match the current filters.</p></div>
      <Transition v-else name="fade" mode="out-in">
        <div :key="view + S.filters.length + S.range">
          <BarsView v-if="view==='bars'" :rows="st.rows" :denom="denom"/>
          <DonutView v-else-if="view==='donut'" :rows="st.rows" :denom="denom"/>
          <ColumnsView v-else-if="view==='columns'" :rows="st.rows" :denom="denom" :mean="st.mean" :lo="st.lo" :hi="st.hi" :min-label="q.scale && q.scale.min_label" :max-label="q.scale && q.scale.max_label"/>
          <RatingSummary v-else-if="view==='summary'" :rows="st.rows" :denom="denom" :mean="st.mean" :hi="st.hi"/>

/* ---------------------------------------------------------------- response sheet */
const EVT = { tab_hidden: { icon: 'AppWindow', label: 'Left the tab' }, fullscreen_exit: { icon: 'Minimize', label: 'Exited full screen' }, copy_attempt: { icon: 'ClipboardX', label: 'Tried to copy or paste' } };
const STATUS = {
  submitted: { label: 'Submitted', variant: 'secondary', icon: 'CircleCheck' },
  auto: { label: 'Auto-submitted', variant: 'warning', icon: 'Timer' },
  voided: { label: 'Voided', variant: 'destructive', icon: 'Ban' },
};
const ResponseSheet = {
  setup() {
    const r = computed(() => S.open);
    const tab = ref('answers');
    watch(() => S.open, () => tab.value = 'answers');
    function answerText(q, v) {
      if (v == null || (Array.isArray(v) && !v.length)) return null;
      if (TYPE[q.type].grid) return q.rows.map(rw => ({ row: rw.label, val: [].concat(v[rw.key] || []).map(k => (q.columns.find(c => c.key === k) || {}).label).join(', ') || '—' }));
      if (Array.isArray(v)) return v.map(k => optLabel(q, k)).join(', ');
      if (typeof v === 'number') return q.type === 'rating' ? '★'.repeat(v) + ' (' + v + ' of ' + q.rating.max + ')' : v + ' of ' + q.scale.max;
      return optLabel(q, v);
    }
    const timeline = computed(() => {
      if (!r.value) return [];
      const x = r.value, out = [{ icon: 'Play', label: 'Started in full screen', at: 0 }];
      x.events.forEach(e => out.push({ ...EVT[e.type], at: e.at, warn: true }));
      if (!x.visited.includes(sec2.key)) out.push({ icon: 'Split', label: 'Skipped section 2 by answer', at: Math.round(x.duration * 0.15) });
      out.push(x.status === 'voided' ? { icon: 'Ban', label: 'Attempt voided after a violation', at: x.duration, danger: true }
        : x.reason === 'timer_expired' ? { icon: 'Timer', label: 'Submitted automatically: time ran out', at: x.duration, warn: true }
        : x.reason === 'violation_limit' ? { icon: 'TriangleAlert', label: 'Submitted automatically after 3 violations', at: x.duration, danger: true }
        : { icon: 'Send', label: 'Submitted', at: x.duration });
      return out.sort((a, b) => a.at - b.at);
    });
    const subjectOf = (x) => ({ kind: 'respondent', id: x.id, form: 'f1', label: x.email + ' on Customer Service Assessment Q4' });
    function reset() { const x = r.value; G.approvalGate('Responses.void', subjectOf(x), () => { x.reset = true; toast('Respondent can try again', x.email + ' may start a new attempt.', 'RotateCcw'); }); }
    const pending = computed(() => r.value && G.openRequestFor ? G.openRequestFor('Responses.void', subjectOf(r.value)) : null);
    const needsOk = computed(() => G.approvalNeeded && G.approvalNeeded('Responses.void', 'f1'));
    function openPending() { S.open = null; G.openReq(pending.value.id); }
    return { S, r, tab, answerText, timeline, SECS, STATUS, fmtDur, fmtDate, reset, pending, needsOk, openPending };
  },
  template: `<Sheet :open="!!S.open" @update:open="v => { if(!v) S.open = null }">
    <template v-if="r">
      <div class="border-b p-5 pr-12">
        <div class="flex items-center gap-3"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-primary/10 text-sm font-semibold uppercase text-primary">{{ r.name.split(' ').map(x=>x[0]).join('') }}</span>
          <div class="min-w-0"><p class="truncate font-semibold">{{ r.name }}</p><p class="truncate text-sm text-muted-foreground">{{ r.email }}</p></div></div>
        <div class="mt-4 grid grid-cols-3 gap-2 text-xs">

"dont": ["router.back()", "Raw ids for related records"]}, "Top-bar search": {"file": "app HeaderSearch + SEARCH_SCOPE map + GET /search", "props": [["phone", "boolean", "false", "Full-width bar variant"]], "emits": [], "slots": [], "do": ["Register each list route in SEARCH_SCOPE (mode list | parent | global)", "List pages read the search from the route and report the match count"], "dont": ["A second search box inside a list page", "Global search outside the Dashboard (offer 'Search everywhere' instead)"]}, "Organisation switcher": {"file": "app OrgSwitcher", "props": [["collapsed", "boolean", "false", "Rail: opens to the right"]], "emits": [], "slots": [], "do": ["Portalled popover (D9)", "Alt+1\u20269 shortcuts", "Switch plays the curtain and resets search"], "dont": ["Absolute positioning inside the sidebar"]}, "View as banner": {"file": "app ViewAsBanner, ViewAsDialog (person | role)", "props": [["G.viewAs", "{ kind: 'person' | 'role', email, name, role, loc }", "", "Global state; 'role' uses a synthetic member that is never listed"]], "emits": [], "slots": [], "do": ["Two modes: a real person, or a role built from main role + custom role at a location", "Roles page offers 'Preview this role'", "Banner above the header + Exit view in the header", "canEdit()/canManage() return false while active", "Audit every session: who, what was viewed, location, duration"], "dont": ["Any write, email or OTP while viewing", "Show the synthetic preview member in lists, counts, pickers or approvers", "'Act as' (signing in as someone with write access); not part of Fomu (D37)"]}, "Approval steps": {"file": "app ApprovalSteps, ApprovalActions", "props": [["request", "Request", "", "With steps, approvals and the resolved approvers"], ["compact", "boolean", "false", "List-row variant: dots only"]], "emits": [["approve", "comment", ""], ["reject", "reason (required)", ""]], "slots": [], "do": ["Show who can act on the current step and why (role at which location)", "Rejection need
