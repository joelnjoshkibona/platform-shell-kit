const RULES = [{"id": "how-to-use-these-rules", "title": "How to use these rules", "html": "<ul><li><strong>Locked<\/strong>: every module matches exactly. These are correctness fixes or consistency a user would notice. No exceptions without a new decision (D#).<\/li><li><strong>Constrained-creative<\/strong>: pick from an established shape; never invent a new one.<\/li><li><strong>Free<\/strong>: per-module judgement, no standard imposed.<\/li><li>When unsure which tier applies, choose Locked for anything a user would see as inconsistent between modules, and Free for anything about a module's own data.<\/li><li>The prototype's Design system page is the visual source of truth (D17). These rules are the behaviour source of truth.<\/li><\/ul>", "text": " - Locked: every module matches exactly. These are correctness fixes or consistency a user would notice. No exceptions without a new decision (D#). - Constrained-creative: pick from an established shape; never invent a new one. - Free: per-module judgement, no standard imposed. - When unsure which tier applies, choose Locked for anything a user would see as inconsistent between modules, and Free for anything about a module's own data. - The prototype's Design system page is the visual source of truth (D17). These rules are the behaviour source of truth. "}, {"id": "locked-component-library", "title": "Locked: component library", "html": "<ul><li><code>COMPONENTS.md<\/code> (generated) lists every component with its specs, props, emits, slots and do/don't. Build screens only from it.<\/li><li>A control that is not in the library is added to it first: spec and demo on the prototype's Design system page, API in <code>components_api.json<\/code>, then rebuild. Never hand-roll a one-off version inside a page.<\/li><li>A component's props/emits contract is frozen once another module uses it; extend it, don't change it.<\/li><\/ul>", "text": " - COMPONENTS.md (generated) lists every component with its specs, props, emits, slots and do/don't. Build screens only from it. - A control that is not in the library is added to it first: spec and demo on the prototype's Design system page, API in components_api.json, then rebuild. Never hand-roll a one-off version inside a page. - A component's props/emits contract is frozen once another module uses it; extend it, don't change it. "}, {"id": "locked-app-shell", "title": "Locked: app shell", "html": "<p><strong>Navigation<\/strong><\/p><ul><li>Sidebar opened by a hamburger with the word \"Menu\" under it. On phones it opens as a sheet from the left.<\/li><li>Menus come from the database (<code>menus<\/code> table). Display modes: dropdown (always accordion), panel, section. Animation follows the mode unless the menu overrides it (D14, D16).<\/li><li>One permission per child menu. A parent shows if any child shows; an empty parent is hidden (D8).<\/li><li>Organisation switcher and location context sit at the top of the sidebar. Switching plays the curtain and reloads every list.<\/li><\/ul><p><strong>Permissions<\/strong><\/p><ul><li>Names are <code>Module.action<\/code>: <code>list<\/code>, <code>view<\/code>, <code>create<\/code>, <code>edit<\/code>, <code>delete<\/code>, plus module verbs such as <code>Forms.publish<\/code>, <code>Responses.export<\/code>, <code>Users.impersonate<\/code> (D28).<\/li><li>Menus are gated by <code>Module.list<\/code>. Every route and endpoint behind a menu checks the same permission; a hidden menu reached by URL shows the No access page with a Request access button (D12).<\/li><li>Buttons the user cannot use are hidden, not disabled, unless the reason helps them (then a tooltip says why).<\/li><li>Effective permission at a location = main role + custom roles here and above + granted \u2212 denied; deny wins (D21).<\/li><\/ul><p><strong>Search (D29, D30)<\/strong><\/p><ul><li>The top-bar box follows the page. In a module it searches that module only and filters the list in place through the module's <code>search<\/code> filter, kept in the URL.<\/li><li>Its last line is always \"Search everywhere for ...\".<\/li><li>On a details page it searches the parent module and shows a small dropdown; Enter opens the filtered list.<\/li><li>On pages with nothing to search the box is hidden.<\/li><li>On the Dashboard it is global: results grouped by module, top 5 each, each group ending in \"See all in X\".<\/li><li>Phones: a search icon expands into a full-width bar with Cancel. Dashboard results open full screen with recent searches.<\/li><\/ul><p><strong>Refresh (D32)<\/strong><\/p><ul><li>Every viewable page has Refresh: lists, details, results, dashboard. Tooltip: \"Updated 2 min ago\".<\/li><li>Refresh keeps current content on screen, dimmed (<code>opacity-60<\/code>, <code>pointer-events-none<\/code>), until new data arrives. Only a first load with nothing on screen shows a spinner.<\/li><\/ul><p><strong>Modals and overlays<\/strong><\/p><ul><li>Every dialog opens through the shared modal host (<code>useModal().openModal(...)<\/code>), never a local <code>ref(false)<\/code>.<\/li><li>Menus, selects, popovers and tooltips are portalled to <code>&lt;body&gt;<\/code>, fixed-positioned, 8px from screen edges, and flip to stay on screen. Never <code>absolute<\/code> inside a scrolling or overflow-hidden container (D9).<\/li><li>Every dialog and sheet has a title and a screen-reader description.<\/li><li>Footer order: Cancel on the left (<code>outline<\/code>), primary on the right. Destructive actions use the <code>destructive<\/code> variant.<\/li><li>On phones dialogs rise from the bottom; sheets fill the width.<\/li><\/ul><p><strong>Page transitions (D13)<\/strong><\/p><ul><li>The curtain plays on first load and on every page change, sidebar included; not between sign-in steps or between tabs inside a page.<\/li><li>Loader text appears only after 300ms. Skipped under <code>prefers-reduced-motion<\/code>.<\/li><li>Curtain colours: bright teal in light mode, deep green in dark mode.<\/li><\/ul><p><strong>View as (D24, D37)<\/strong><\/p><ul><li>Two read-only modes from the top-bar eye: <strong>a person<\/strong> (their exact main role, location roles and overrides) or <strong>a role<\/strong> (main role + optional custom role at a location, no real person). The Roles page also offers \"Preview this role\".<\/li><li>A banner shows who or what is being viewed. Everything is read-only, nothing is sent, and every session is written to the audit log.<\/li><li>The synthetic role-preview member never appears in lists, counts, pickers or approver lists.<\/li><li>There is no \"Act as\" (signing in as someone with write access).<\/li><\/ul>", "text": " Navigation  - Sidebar opened by a hamburger with the word \"Menu\" under it. On phones it opens as a sheet from the left. - Menus come from the database (menus table). Display modes: dropdown (always accordion), panel, section. Animation follows the mode unless the menu overrides it (D14, D16). - One permission per child menu. A parent shows if any child shows; an empty parent is hidden (D8). - Organisation switcher and location context sit at the top of the sidebar. Switching plays the curtain and reloads every list.  Permissions  - Names are Module.action: list, view, create, edit, delete, plus module verbs such as Forms.publish, Responses.export, Users.impersonate (D28). - Menus are gated by Module.list. Every route and endpoint behind a menu checks the same permission; a hidden menu reached by URL shows the No access page with a Request access button (D12). - Buttons the user cannot use are hidden, not disabled, unless the reason helps them (then a tooltip says why). - Effective permission at a location = main role + custom roles here and above + granted \u2212 denied; deny wins (D21).  Search (D29, D30)  - The top-bar box follows the page. In a module it searches that module only and filters the list in place through the module's search filter, kept in the URL. - Its last line is always \"Search everywhere for ...\". - On a details page it searches the parent module and shows a small dropdown; Enter opens the filtered list. - On pages with nothing to search the box is hidden. - On the Dashboard it is global: results grouped by module, top 5 each, each group ending in \"See all in X\". - Phones: a search icon expands into a full-width bar with Cancel. Dashboard results open full screen with recent searches.  Refresh (D32)  - Every viewable page has Refresh: lists, details, results, dashboard. Tooltip: \"Updated 2 min ago\". - Refresh keeps current content on screen, dimmed (opacity-60, pointer-events-none), until new data arrives. Only a first load with nothing on screen shows a spinner.  Modals and overlays  - Every dialog opens through the shared modal host (useModal().openModal(...)), never a local ref(false). - Menus, selects, popovers and tooltips are portalled to <body>, fixed-positioned, 8px from screen edges, and flip to stay on screen. Never absolute inside a scrolling or overflow-hidden container (D9). - Every dialog and sheet has a title and a screen-reader description. - Footer order: Cancel on the left (outline), primary on the right. Destructive actions use the destructive variant. - On phones dialogs rise from the bottom; sheets fill the width.  Page transitions (D13)  - The curtain plays on first load and on every page change, sidebar included; not between sign-in steps or between tabs inside a page. - Loader text appears only after 300ms. Skipped under prefers-reduced-motion. - Curtain colours: bright teal in light mode, deep green in dark mode.  View as (D24, D37)  - Two read-only modes from the top-bar eye: a person (their exact main role, location roles and overrides) or a role (main role + optional custom role at a location, no real person). The Roles page also offers \"Preview this role\". - A banner shows who or what is being viewed. Everything is read-only, nothing is sent, and every session is written to the audit log. - The synthetic role-preview member never appears in lists, counts, pickers or approver lists. - There is no \"Act as\" (signing in as someone with write access). "}, {"id": "locked-lists", "title": "Locked: lists", "html": "<p><strong>Toolbar (D31)<\/strong>, left to right:<\/p><ol><li>Refresh (spinner while loading)<\/li><li>Filters, with the active count: <code>Filters (2)<\/code><\/li><li>Clear 2 (only when filters are active)<\/li><li>Sort: <code>Name \u2191<\/code><\/li><li>Right side: cards/table toggle, Export / Import only when the backend has those routes, then the primary New button<\/li><\/ol><ul><li>Every primary action has an icon and visible text on desktop. On phones the toolbar shows icons with counts, and the New button keeps its text.<\/li><li>Quick-filter tabs (status) sit above the toolbar and stay in sync with the Filters dialog.<\/li><\/ul><p><strong>Filters dialog<\/strong><\/p><ul><li>Fields come from the list endpoint's <code>filterFields<\/code>; the page declares none of its own.<\/li><li>Simple mode (default): each field uses its natural operator \u2014 text contains, select is any of, number/date/boolean equals.<\/li><li>Advanced switch: an operator picker per field (between, greater/less than, begins/ends with, is empty, is not empty).<\/li><li>Select filters are multi-select by default. A between with one side empty blocks Apply.<\/li><li>Field type decides the control (D38): <code>select<\/code> (pills) only for short fixed sets of 10 or fewer, such as status; anything that grows (locations, people, forms, wards) is <code>select_paginated<\/code> and renders a multi API select for its module. Location filters include the locations under the chosen ones by default, with a switch to turn it off; the chip says \"and below\".<\/li><li>Apply sends one request and returns to page 1. On phones the dialog is a bottom sheet.<\/li><\/ul><p><strong>State and loading<\/strong><\/p><ul><li>Page, per-page, sort and filters live in the URL (<code>?page=2&amp;sort=name&amp;f[status][operator]=in...<\/code>), so any view can be bookmarked or shared and survives a reload. Other query params such as <code>?tab=<\/code> are kept.<\/li><li>First load with no rows: a centred spinner. Every later fetch keeps rows visible and dimmed.<\/li><li>Footer: <code>1\u201310 of 84<\/code>, per-page picker, Previous / Next.<\/li><\/ul><p><strong>Shape (prototype wins, D27)<\/strong><\/p><ul><li>Desktop offers cards or a table, remembered per user. Phones always show cards (D11).<\/li><li>A row or card opens on click with a stretched link; its actions menu sits above it (<code>relative z-10<\/code>) (D10).<\/li><li>Empty list: centred icon (<code>size-6<\/code>, muted 60%), one specific line (\"No forms match.\"), and Clear filters when filters are active. Never a second New button.<\/li><li>No horizontal page scroll at 360px. Tables wider than the screen scroll inside their own card.<\/li><\/ul>", "text": " Toolbar (D31), left to right:  1. Refresh (spinner while loading) 2. Filters, with the active count: Filters (2) 3. Clear 2 (only when filters are active) 4. Sort: Name \u2191 5. Right side: cards/table toggle, Export / Import only when the backend has those routes, then the primary New button  - Every primary action has an icon and visible text on desktop. On phones the toolbar shows icons with counts, and the New button keeps its text. - Quick-filter tabs (status) sit above the toolbar and stay in sync with the Filters dialog.  Filters dialog  - Fields come from the list endpoint's filterFields; the page declares none of its own. - Simple mode (default): each field uses its natural operator \u2014 text contains, select is any of, number/date/boolean equals. - Advanced switch: an operator picker per field (between, greater/less than, begins/ends with, is empty, is not empty). - Select filters are multi-select by default. A between with one side empty blocks Apply. - Field type decides the control (D38): select (pills) only for short fixed sets of 10 or fewer, such as status; anything that grows (locations, people, forms, wards) is select_paginated and renders a multi API select for its module. Location filters include the locations under the chosen ones by default, with a switch to turn it off; the chip says \"and below\". - Apply sends one request and returns to page 1. On phones the dialog is a bottom sheet.  State and loading  - Page, per-page, sort and filters live in the URL (?page=2&sort=name&f[status][operator]=in...), so any view can be bookmarked or shared and survives a reload. Other query params such as ?tab= are kept. - First load with no rows: a centred spinner. Every later fetch keeps rows visible and dimmed. - Footer: 1\u201310 of 84, per-page picker, Previous / Next.  Shape (prototype wins, D27)  - Desktop offers cards or a table, remembered per user. Phones always show cards (D11). - A row or card opens on click with a stretched link; its actions menu sits above it (relative z-10) (D10). - Empty list: centred icon (size-6, muted 60%), one specific line (\"No forms match.\"), and Clear filters when filters are active. Never a second New button. - No horizontal page scroll at 360px. Tables wider than the screen scroll inside their own card. "}, {"id": "locked-details-pages", "title": "Locked: details pages", "html": "<p><strong>Header<\/strong><\/p><ul><li>Breadcrumb, then icon tile (or avatar for a person), title, code and status badge on one line, meta under it.<\/li><li>Header buttons, row 1: Refresh, and View full page when shown as a preview. Row 2: the record's actions. Only Edit is promoted to a visible button; delete and rare actions live in the More menu, which hides itself when empty.<\/li><li>One exception: a module may promote its single defining action beside Edit (Add child on a location, Preview this role on a role). Everything else stays in More (D39).<\/li><li>Back returns to <code>?back=<\/code> if present, else to the module list. Never browser history.<\/li><li>Terminal states (closed, cancelled, voided, archived) show a banner explaining why actions are gone and that the record is read-only.<\/li><\/ul><p><strong>Tabs<\/strong><\/p><ul><li>Tabs live in <code>?tab=<\/code>, never nested routes, so a tab switch does not refetch the header.<\/li><li>Tabs switch without the page curtain (D13). On phones the tab strip scrolls sideways.<\/li><li>Every module has Overview first and History (activity) last. Which tabs sit between is Free.<\/li><\/ul><p><strong>Overview<\/strong><\/p><ul><li>Cards of icon + label + value fields. Same field shape gets the same icon everywhere: <code>Hash<\/code> for codes and references, <code>AlignLeft<\/code> for notes, <code>FileText<\/code> for descriptions, <code>CalendarRange<\/code> for a validity window shown as <code>from \u2192 to<\/code>.<\/li><li>A Timeline card (Created, Created by, Updated, Updated by) and both halves of the audit pair are always shown when the API returns them.<\/li><li>A field that points at another record is a related-record link, never plain text or a raw id.<\/li><\/ul><p><strong>Related-record preview<\/strong><\/p><ul><li>A related-record link opens the target module's own details panel in a side sheet (not a summary), with a View full page button that carries the active tab and stamps <code>?back=<\/code>.<\/li><\/ul><p><strong>Activity<\/strong><\/p><ul><li>History tab = the shared activity card fed by <code>/{module}/{uuid}/activity<\/code>, paginated, with its own loading state.<\/li><\/ul><p><strong>Delete<\/strong><\/p><ul><li>Delete first calls the backend's delete check, which lists what depends on the record.<\/li><li>A real delete needs the user to type YES before the button enables. Soft-deleted records show a restore banner.<\/li><\/ul><p><strong>Roles (D39)<\/strong><\/p><ul><li>Roles is a list + details module like every other. Never a master-detail split view.<\/li><li>List rows: icon tile (Crown locked, Shield main, ShieldPlus custom), name + description, Main/Custom badge, permission coverage bar with <code>n/total<\/code>, visible menus, holder avatars.<\/li><li>Details tabs: Overview, Permissions, Menus, People, History. Permission and menu ticks save on change; read-only users see the same screen with disabled controls and a one-line reason.<\/li><li>Main roles: name fixed, never deleted. Custom roles: created from the list (optionally copying another role once), renamed in Edit, deleted only when nobody holds them.<\/li><\/ul><p><strong>Staged edits and leaving (D42)<\/strong><\/p><ul><li>Editors that change many switches at once (role permissions, menus) stage changes. A sticky bar at the bottom shows the diff (+n / \u2212n), who it affects, Discard and Save.<\/li><li>Leaving a page with staged changes asks Stay / Discard and leave / Save and leave. The guard covers every in-app navigation and the browser's close/reload prompt.<\/li><\/ul>", "text": " Header  - Breadcrumb, then icon tile (or avatar for a person), title, code and status badge on one line, meta under it. - Header buttons, row 1: Refresh, and View full page when shown as a preview. Row 2: the record's actions. Only Edit is promoted to a visible button; delete and rare actions live in the More menu, which hides itself when empty. - One exception: a module may promote its single defining action beside Edit (Add child on a location, Preview this role on a role). Everything else stays in More (D39). - Back returns to ?back= if present, else to the module list. Never browser history. - Terminal states (closed, cancelled, voided, archived) show a banner explaining why actions are gone and that the record is read-only.  Tabs  - Tabs live in ?tab=, never nested routes, so a tab switch does not refetch the header. - Tabs switch without the page curtain (D13). On phones the tab strip scrolls sideways. - Every module has Overview first and History (activity) last. Which tabs sit between is Free.  Overview  - Cards of icon + label + value fields. Same field shape gets the same icon everywhere: Hash for codes and references, AlignLeft for notes, FileText for descriptions, CalendarRange for a validity window shown as from \u2192 to. - A Timeline card (Created, Created by, Updated, Updated by) and both halves of the audit pair are always shown when the API returns them. - A field that points at another record is a related-record link, never plain text or a raw id.  Related-record preview  - A related-record link opens the target module's own details panel in a side sheet (not a summary), with a View full page button that carries the active tab and stamps ?back=.  Activity  - History tab = the shared activity card fed by /{module}/{uuid}/activity, paginated, with its own loading state.  Delete  - Delete first calls the backend's delete check, which lists what depends on the record. - A real delete needs the user to type YES before the button enables. Soft-deleted records show a restore banner.  Roles (D39)  - Roles is a list + details module like every other. Never a master-detail split view. - List rows: icon tile (Crown locked, Shield main, ShieldPlus custom), name + description, Main/Custom badge, permission coverage bar with n/total, visible menus, holder avatars. - Details tabs: Overview, Permissions, Menus, People, History. Permission and menu ticks save on change; read-only users see the same screen with disabled controls and a one-line reason. - Main roles: name fixed, never deleted. Custom roles: created from the list (optionally copying another role once), renamed in Edit, deleted only when nobody holds them.  Staged edits and leaving (D42)  - Editors that change many switches at once (role permissions, menus) stage changes. A sticky bar at the bottom shows the diff (+n / \u2212n), who it affects, Discard and Save. - Leaving a page with staged changes asks Stay / Discard and leave / Save and leave. The guard covers every in-app navigation and the browser's close/reload prompt. "}, {"id": "locked-forms-and-fields", "title": "Locked: forms and fields", "html": "<p><strong>Fields<\/strong><\/p><ul><li>Label above, help text under, error under that in <code>text-xs text-destructive<\/code>. No error summary box at the top.<\/li><li>Required: a CSS asterisk on the label (<code>after:content-['*']<\/code>), never a literal <code>*<\/code> in the text.<\/li><li>One field per row; pair two only when short and related (code + unit).<\/li><li>No native pickers, anywhere: no <code>&lt;select&gt;<\/code>, <code>&lt;input type=file&gt;<\/code>, <code>type=date|time<\/code>. Use Select, API select, Date picker, Time, File picker.<\/li><li>Create and edit share one form modal. Edit seeds itself from the record before it is shown.<\/li><\/ul><p><strong>Drafts (D33)<\/strong><\/p><ul><li>Every create and edit form autosaves to the server every 4 seconds of idle time, so work survives a closed tab and resumes on another device.<\/li><li>The dialog footer shows the state next to Cancel: <code>Saving\u2026<\/code>, <code>Draft saved 12:41<\/code>, or <code>Couldn't save draft<\/code> (announced once).<\/li><li>Create: several drafts per form; a banner \"You have 2 drafts\" opens a picker to resume or delete one.<\/li><li>Edit: one draft per record; a banner \"You have unsaved changes from 2 hours ago\" with Discard and Restore. Autosave pauses until the banner is answered.<\/li><li>Closing saves the draft; a successful save deletes it; a failed save keeps it.<\/li><li>A form changed back to how it started drops its draft.<\/li><li>Never stored: passwords, tokens, OTPs. Files are stored as media ids (see File picker).<\/li><li>Never in action wizards or one-shot dialogs.<\/li><li>\"My drafts\" in the user menu lists every draft across modules, newest first, with Resume and Delete.<\/li><\/ul><p><strong>File picker<\/strong><\/p><ul><li>One component for single and multiple files. Two sources: Upload (drag and drop, browse, paste an image) and Media library (search and pick existing files).<\/li><li>Limits are shown before choosing: allowed types, max size, max files.<\/li><li>Each file shows a thumbnail or type icon, name, size, a progress bar, Cancel while uploading, Retry and the reason on failure.<\/li><li>Uploads go to the Media module immediately and the field holds <code>media_id<\/code>s. Unattached media older than 24 hours is cleaned by a scheduled job.<\/li><li>Existing files show with View, Download and Remove. Images open in a preview.<\/li><li>Phones: Upload offers Camera and Files; the library opens full screen.<\/li><\/ul><p><strong>API select (D36)<\/strong><\/p><ul><li>Backed by <code>GET /select/{module}?search=&amp;page=|after=&amp;per_page=20&amp;filter[k]=v&amp;exclude[]=&amp;ids[]=<\/code> \u2192 <code>{ data, selected, meta: { has_more, next_cursor? } }<\/code>.<\/li><li>Paging is mixed: <code>page=<\/code> for small tables, an opaque <code>after=<\/code> cursor for big or busy ones (wards, items, respondents). The module declares which. The client trusts <code>has_more<\/code>; no totals.<\/li><li>The next page loads when an end marker scrolls into view (120px early), with a \"Loading more\u2026\" row and Retry if it fails.<\/li><li>Search from 2 letters, 300ms after typing stops. A new search cancels the previous request. Results rank exact, then starts-with, then contains.<\/li><li>Selected labels come from three layers: (a) view endpoints return every foreign key as <code>{ id, label, sub }<\/code> and the form passes it as <code>selected-options<\/code>; (b) anything still missing goes into one batched <code>ids[]<\/code> lookup per module per tick, across every picker on the page; (c) every label lands in a shared label store.<\/li><li>Current choices are pinned under \"Selected\" on page 1 and excluded from later pages.<\/li><li>A chosen value that is archived shows greyed with \"(archived)\"; one the user cannot see shows a lock and \"Restricted record\"; a deleted one shows \"Deleted record\". A warning sits under the field. Values are never cleared silently.<\/li><li>Results for the same module, filters and search are cached for 60 seconds: reopening shows them at once and refreshes in the background.<\/li><li>Desktop opens a popover with the search focused; phones open a bottom sheet. Footer \"Create new \u2026\" when the user has <code>Module.create<\/code>.<\/li><\/ul><p><strong>Rich text (WYSIWYG)<\/strong><\/p><ul><li>Tiptap (Vue 3, headless) styled with our tokens.<\/li><li>Toolbar: paragraph/H2/H3, bold, italic, underline, link, bulleted and numbered list, quote, clear formatting; image only through the File picker.<\/li><li>Markdown shortcuts work (<code>**<\/code>, <code>-<\/code>, <code>1.<\/code>, <code>&gt;<\/code>). Paste is cleaned to the same allowlist.<\/li><li>Output is HTML, sanitised again on the server with the same allowlist (<code>HtmlSanitizerService<\/code>).<\/li><li>Character count when the field has a limit. On phones the toolbar scrolls sideways and sticks above the keyboard.<\/li><\/ul><p><strong>Action wizards<\/strong><\/p><ul><li><code>Stepper<\/code> inside a dialog. Footer: Cancel, Back, Next, then the real action on the last step.<\/li><li>The last step is a read-only review with a confirmation checkbox that gates the action.<\/li><li>A validation error jumps back to the step that owns the field. No drafts.<\/li><\/ul>", "text": " Fields  - Label above, help text under, error under that in text-xs text-destructive. No error summary box at the top. - Required: a CSS asterisk on the label (after:content-['']), never a literal  in the text. - One field per row; pair two only when short and related (code + unit). - No native pickers, anywhere: no <select>, <input type=file>, type=datetime. Use Select, API select, Date picker, Time, File picker. - Create and edit share one form modal. Edit seeds itself from the record before it is shown.  Drafts (D33)  - Every create and edit form autosaves to the server every 4 seconds of idle time, so work survives a closed tab and resumes on another device. - The dialog footer shows the state next to Cancel: Saving\u2026, Draft saved 12:41, or Couldn't save draft (announced once). - Create: several drafts per form; a banner \"You have 2 drafts\" opens a picker to resume or delete one. - Edit: one draft per record; a banner \"You have unsaved changes from 2 hours ago\" with Discard and Restore. Autosave pauses until the banner is answered. - Closing saves the draft; a successful save deletes it; a failed save keeps it. - A form changed back to how it started drops its draft. - Never stored: passwords, tokens, OTPs. Files are stored as media ids (see File picker). - Never in action wizards or one-shot dialogs. - \"My drafts\" in the user menu lists every draft across modules, newest first, with Resume and Delete.  File picker  - One component for single and multiple files. Two sources: Upload (drag and drop, browse, paste an image) and Media library (search and pick existing files). - Limits are shown before choosing: allowed types, max size, max files. - Each file shows a thumbnail or type icon, name, size, a progress bar, Cancel while uploading, Retry and the reason on failure. - Uploads go to the Media module immediately and the field holds media_ids. Unattached media older than 24 hours is cleaned by a scheduled job. - Existing files show with View, Download and Remove. Images open in a preview. - Phones: Upload offers Camera and Files; the library opens full screen.  API select (D36)  - Backed by GET /select/{module}?search=&page=after=&per_page=20&filter[k]=v&exclude[]=&ids[]= \u2192 { data, selected, meta: { has_more, next_cursor? } }. - Paging is mixed: page= for small tables, an opaque after= cursor for big or busy ones (wards, items, respondents). The module declares which. The client trusts has_more; no totals. - The next page loads when an end marker scrolls into view (120px early), with a \"Loading more\u2026\" row and Retry if it fails. - Search from 2 letters, 300ms after typing stops. A new search cancels the previous request. Results rank exact, then starts-with, then contains. - Selected labels come from three layers: (a) view endpoints return every foreign key as { id, label, sub } and the form passes it as selected-options; (b) anything still missing goes into one batched ids[] lookup per module per tick, across every picker on the page; (c) every label lands in a shared label store. - Current choices are pinned under \"Selected\" on page 1 and excluded from later pages. - A chosen value that is archived shows greyed with \"(archived)\"; one the user cannot see shows a lock and \"Restricted record\"; a deleted one shows \"Deleted record\". A warning sits under the field. Values are never cleared silently. - Results for the same module, filters and search are cached for 60 seconds: reopening shows them at once and refreshes in the background. - Desktop opens a popover with the search focused; phones open a bottom sheet. Footer \"Create new \u2026\" when the user has Module.create.  Rich text (WYSIWYG)  - Tiptap (Vue 3, headless) styled with our tokens. - Toolbar: paragraph/H2/H3, bold, italic, underline, link, bulleted and numbered list, quote, clear formatting; image only through the File picker. - Markdown shortcuts work (, -, 1., >). Paste is cleaned to the same allowlist. - Output is HTML, sanitised again on the server with the same allowlist (HtmlSanitizerService). - Character count when the field has a limit. On phones the toolbar scrolls sideways and sticks above the keyboard.  Action wizards  - Stepper inside a dialog. Footer: Cancel, Back, Next, then the real action on the last step. - The last step is a read-only review with a confirmation checkbox that gates the action. - A validation error jumps back to the step that owns the field. No drafts. "}, {"id": "locked-approvals-d25-d34", "title": "Locked: approvals (D25, D34)", "html": "<ul><li>Any action can be put behind an approval workflow. The UI checks for an active workflow before doing the action and offers \"Request to \u2026\" instead.<\/li><li>Steps run in order; each step lists who may approve (custom role at the request's location or above, main role, permission or person), Any or All, and how many approvals it needs.<\/li><li>Approvers are resolved at the request's location chain. If nobody qualifies, the step escalates to owners and admins and says so.<\/li><li>The request page always shows, for the current step, who can act and why (\"Branch supervisor at Arusha Branch\").<\/li><li>A requester never approves their own request. A rejection needs a reason; an approval comment is optional.<\/li><li>Acting under a delegation is labelled on the decision (\"by Hamisi, delegated\") and on the request page.<\/li><li>Approved, rejected and cancelled requests show a banner explaining the outcome and that the request is read-only.<\/li><li>The editor previews who each step would go to at a chosen location and warns when fewer people qualify than the step needs.<\/li><li>Capacity rule (D40): a step needing 2+ approvals needs required + 1 people who can approve; the editor shows an inline error, Save stays disabled and the workflow can't be switched on. Existing failing workflows show a \"Can't be met\" badge; a short step adds the Owner, and an Owner completes a step that already has every approval it can get.<\/li><li>Gated actions (D41): when a workflow applies, the action button opens \"This needs approval\" (subject, route preview, note) instead of running. Labels change to say so (\"Request another attempt\"), menus show a disabled \"Needs approval first\" row, and an open request for the same subject shows its number instead of a second request.<\/li><li>Notifications (D43): the workflow editor has a Notifications block (channel chips, in-app locked on; event switches; reminder every N hours up to M). Each step can override channels and mark them required. The request page has a Notifications tab: one row per person and event with a chip per channel, crossed out with the reason when skipped. People manage their own email/SMS/push in Notification settings (user menu); in-app can't be turned off.<\/li><li>Email and quiet hours (D44): approval emails link to the request; nobody decides from an email. SMS and push inside the org's quiet hours (Settings, default 20:00\u201307:00 EAT) show as held (amber chip with the release time); required steps ignore quiet hours.<\/li><\/ul>", "text": " - Any action can be put behind an approval workflow. The UI checks for an active workflow before doing the action and offers \"Request to \u2026\" instead. - Steps run in order; each step lists who may approve (custom role at the request's location or above, main role, permission or person), Any or All, and how many approvals it needs. - Approvers are resolved at the request's location chain. If nobody qualifies, the step escalates to owners and admins and says so. - The request page always shows, for the current step, who can act and why (\"Branch supervisor at Arusha Branch\"). - A requester never approves their own request. A rejection needs a reason; an approval comment is optional. - Acting under a delegation is labelled on the decision (\"by Hamisi, delegated\") and on the request page. - Approved, rejected and cancelled requests show a banner explaining the outcome and that the request is read-only. - The editor previews who each step would go to at a chosen location and warns when fewer people qualify than the step needs. - Capacity rule (D40): a step needing 2+ approvals needs required + 1 people who can approve; the editor shows an inline error, Save stays disabled and the workflow can't be switched on. Existing failing workflows show a \"Can't be met\" badge; a short step adds the Owner, and an Owner completes a step that already has every approval it can get. - Gated actions (D41): when a workflow applies, the action button opens \"This needs approval\" (subject, route preview, note) instead of running. Labels change to say so (\"Request another attempt\"), menus show a disabled \"Needs approval first\" row, and an open request for the same subject shows its number instead of a second request. - Notifications (D43): the workflow editor has a Notifications block (channel chips, in-app locked on; event switches; reminder every N hours up to M). Each step can override channels and mark them required. The request page has a Notifications tab: one row per person and event with a chip per channel, crossed out with the reason when skipped. People manage their own email/SMS/push in Notification settings (user menu); in-app can't be turned off. - Email and quiet hours (D44): approval emails link to the request; nobody decides from an email. SMS and push inside the org's quiet hours (Settings, default 20:00\u201307:00 EAT) show as held (amber chip with the release time); required steps ignore quiet hours. "}, {"id": "locked-visual", "title": "Locked: visual", "html": "<p>shadcn-vue components and Tailwind with semantic tokens only; never a raw hex or grey class in a component. Values come from the prototype's Design system page (D17).<\/p><div class=\"rules-table\"><table><thead><tr><th>Token<\/th><th>Light<\/th><th>Dark<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td><code>--primary<\/code><\/td><td>teal <code>174 72% 26%<\/code><\/td><td>teal <code>170 62% 46%<\/code><\/td><td>Primary buttons, focus, active nav<\/td><\/tr><tr><td>Neutrals<\/td><td>zinc scale<\/td><td>zinc scale<\/td><td>Background, cards, borders, muted text<\/td><\/tr><tr><td><code>--warning<\/code> / <code>--destructive<\/code><\/td><td>semantic<\/td><td>semantic<\/td><td>Approaching a limit / errors and danger<\/td><\/tr><tr><td>Chart c1\u2013c5<\/td><td>#14937f #d06d0a #2f6fe0 #d6456a #7c5ad8<\/td><td>#1f9e89 #c97514 #4c82e8 #dc5577 #8f73e3<\/td><td>Charts only, max 5 series then Other (#94a3b8 / #64748b)<\/td><\/tr><tr><td><code>--curtain<\/code><\/td><td><code>170 62% 46%<\/code>, dark text<\/td><td><code>166 58% 13%<\/code>, light text<\/td><td>Page transition only<\/td><\/tr><tr><td>Form accent<\/td><td>per form<\/td><td>per form<\/td><td>A form's own brand colour, tenant-overridable<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>Type<\/strong>: Geist. Page title <code>text-xl font-semibold<\/code> (<code>text-2xl<\/code> from <code>sm<\/code>), body <code>text-sm<\/code>, meta <code>text-xs<\/code>, group labels <code>text-[11px]<\/code> uppercase semibold, KPI numbers <code>text-2xl<\/code> with tabular figures, codes and permission names in mono <code>text-xs<\/code>.<\/li><li><strong>Spacing<\/strong>: <code>gap-4<\/code> between sections and fields, <code>p-4<\/code> card padding (<code>p-3.5<\/code> for KPI tiles), <code>gap-1.5<\/code> inside a label/input/error stack, <code>gap-2<\/code> between inline items.<\/li><li><strong>Radius<\/strong>: <code>rounded-md<\/code> controls, <code>rounded-lg<\/code> dialogs and popovers, <code>rounded-xl<\/code> cards, <code>rounded-full<\/code> pills and avatars.<\/li><li><strong>Icons<\/strong>: Lucide, <code>size-4<\/code> next to text, <code>size-6<\/code> for empty states. Same field shape, same icon everywhere.<\/li><li><strong>Status<\/strong>: short badges or pills with a dot; colour never carries meaning alone (always a word).<\/li><li><strong>Motion<\/strong>: cards rise in with a 40\u201360ms stagger, sparklines draw in, bars grow from the left; 150\u2013250ms for UI transitions. Everything decorative stops under <code>prefers-reduced-motion<\/code>.<\/li><li><strong>Dark mode<\/strong>: every screen is checked in light and dark before merging. Theme choice: Light, Dark, System.<\/li><li><strong>Responsive<\/strong>: built and checked at 360, 390, 768, 1280px. Grid children get <code>min-w-0<\/code>; no horizontal page scroll; tap targets at least 40px on phones; safe-area insets respected.<\/li><li><strong>i18n<\/strong>: every user-facing string goes through <code>t()<\/code>, with English and Swahili keys added together.<\/li><\/ul>", "text": " shadcn-vue components and Tailwind with semantic tokens only; never a raw hex or grey class in a component. Values come from the prototype's Design system page (D17).   Token  Light  Dark  Use   ---  ---  ---  ---   --primary  teal 174 72% 26%  teal 170 62% 46%  Primary buttons, focus, active nav   Neutrals  zinc scale  zinc scale  Background, cards, borders, muted text   --warning / --destructive  semantic  semantic  Approaching a limit / errors and danger   Chart c1\u2013c5  #14937f #d06d0a #2f6fe0 #d6456a #7c5ad8  #1f9e89 #c97514 #4c82e8 #dc5577 #8f73e3  Charts only, max 5 series then Other (#94a3b8 / #64748b)   --curtain  170 62% 46%, dark text  166 58% 13%, light text  Page transition only   Form accent  per form  per form  A form's own brand colour, tenant-overridable   - Type: Geist. Page title text-xl font-semibold (text-2xl from sm), body text-sm, meta text-xs, group labels text-[11px] uppercase semibold, KPI numbers text-2xl with tabular figures, codes and permission names in mono text-xs. - Spacing: gap-4 between sections and fields, p-4 card padding (p-3.5 for KPI tiles), gap-1.5 inside a label/input/error stack, gap-2 between inline items. - Radius: rounded-md controls, rounded-lg dialogs and popovers, rounded-xl cards, rounded-full pills and avatars. - Icons: Lucide, size-4 next to text, size-6 for empty states. Same field shape, same icon everywhere. - Status: short badges or pills with a dot; colour never carries meaning alone (always a word). - Motion: cards rise in with a 40\u201360ms stagger, sparklines draw in, bars grow from the left; 150\u2013250ms for UI transitions. Everything decorative stops under prefers-reduced-motion. - Dark mode: every screen is checked in light and dark before merging. Theme choice: Light, Dark, System. - Responsive: built and checked at 360, 390, 768, 1280px. Grid children get min-w-0; no horizontal page scroll; tap targets at least 40px on phones; safe-area insets respected. - i18n: every user-facing string goes through t(), with English and Swahili keys added together. "}, {"id": "constrained-creative-and-free", "title": "Constrained-creative and Free", "html": "<p><strong>Constrained-creative<\/strong> (pick an existing shape):<\/p><ul><li>List card content: accent bar or icon tile, title, status pill, one meta line, a key number with a sparkline, footer with owner and date. Which fields fill each slot is per module.<\/li><li>List table columns: which columns earn a place is per module; the column look is fixed.<\/li><li>Details header title: a name, a code or a document number, whichever identifies the record; a person always gets an avatar with initials.<\/li><li>Overview cards: field grid inside a card; grouping and card names per module (Information, Amounts, Rule, Timeline).<\/li><li>KPI strip: 2 columns on phones, 4 on desktop; each tile = label, icon chip, number, one line of context or a sparkline/progress bar.<\/li><li>Charts: the views in the chart catalogue (bars, donut, columns, rating, stacked, heatmap) with the shared palette.<\/li><\/ul><p><strong>Free<\/strong>:<\/p><ul><li>Which tabs a details page has between Overview and History.<\/li><li>Domain visualisations a module's data calls for (the location tree, a permission editor, a timer pill).<\/li><li>Empty-state wording and illustrations within the empty-state shape.<\/li><\/ul>", "text": " Constrained-creative (pick an existing shape):  - List card content: accent bar or icon tile, title, status pill, one meta line, a key number with a sparkline, footer with owner and date. Which fields fill each slot is per module. - List table columns: which columns earn a place is per module; the column look is fixed. - Details header title: a name, a code or a document number, whichever identifies the record; a person always gets an avatar with initials. - Overview cards: field grid inside a card; grouping and card names per module (Information, Amounts, Rule, Timeline). - KPI strip: 2 columns on phones, 4 on desktop; each tile = label, icon chip, number, one line of context or a sparkline/progress bar. - Charts: the views in the chart catalogue (bars, donut, columns, rating, stacked, heatmap) with the shared palette.  Free:  - Which tabs a details page has between Overview and History. - Domain visualisations a module's data calls for (the location tree, a permission editor, a timer pill). - Empty-state wording and illustrations within the empty-state shape. "}, {"id": "backend-contract-the-frontend-relies-on", "title": "Backend contract the frontend relies on", "html": "<div class=\"rules-table\"><table><thead><tr><th>Need<\/th><th>Endpoint / shape<\/th><th>Note<\/th><\/tr><\/thead><tbody><tr><td>Lists<\/td><td><code>GET /{module}/list<\/code> with <code>filters<\/code>, <code>params{page,per_page,sort,order}<\/code> \u2192 <code>data, meta, filterFields<\/code><\/td><td>Every module declares a <code>search<\/code> filter field (D29)<\/td><\/tr><tr><td>Pickers<\/td><td>`GET /select/{module}?search=&amp;page=\\<\/td><td>after=&amp;per_page=&amp;filter[k]=&amp;exclude[]=&amp;ids[]=<code> \u2192 <\/code>data, selected, meta{has_more,next_cursor}`<\/td><td>min 2 characters; <code>ids[]<\/code> resolves labels incl. archived/restricted/deleted (D36)<\/td><\/tr><tr><td>Global search<\/td><td><code>GET /search?q=<\/code> \u2192 groups of top 5 per searchable module<\/td><td>New; permission- and location-scoped (D30)<\/td><\/tr><tr><td>Details<\/td><td><code>GET /{module}/{uuid}/view<\/code>, <code>/activity<\/code><\/td><td>Every foreign key comes back as <code>{ id, label, sub }<\/code> for pickers (D36)<\/td><\/tr><tr><td>Delete<\/td><td><code>GET /{module}/{uuid}/delete/check<\/code>, then <code>DELETE /{module}/{uuid}/delete<\/code><\/td><td>Check lists dependants<\/td><\/tr><tr><td>Drafts<\/td><td><code>POST /drafts/save<\/code>, <code>GET /drafts/find<\/code>, <code>/drafts/for-context<\/code>, <code>/drafts<\/code>, <code>DELETE /drafts/{uuid}<\/code><\/td><td>Keyed by module, form type, record key<\/td><\/tr><tr><td>Media<\/td><td><code>POST /media/create<\/code>, <code>GET /media/list<\/code>, <code>/media/{uuid}/info<\/code>, <code>/download<\/code><\/td><td>Download needs the bearer token, so fetch as a blob<\/td><\/tr><tr><td>Location context<\/td><td><code>X-Location-Id<\/code> header + <code>location_filter<\/code> param<\/td><td>Header checks permission; param narrows data<\/td><\/tr><tr><td>Booleans in FormData<\/td><td><code>1<\/code> / <code>0<\/code><\/td><td>Never <code>true<\/code> / <code>false<\/code> strings<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Services validate before touching a model; only validated keys reach <code>create<\/code>/<code>update<\/code>.<\/li><li>Permissions are checked by middleware with the same name the menu uses.<\/li><\/ul>", "text": "  Need  Endpoint / shape  Note   ---  ---  ---   Lists  GET /{module}/list with filters, params{page,per_page,sort,order} \u2192 data, meta, filterFields  Every module declares a search filter field (D29)   Pickers  GET /select/{module}?search=&page=\\after=&per_page=&filter[k]=&exclude[]=&ids[]= \u2192 data, selected, meta{has_more,next_cursor}  min 2 characters; ids[] resolves labels incl. archived/restricted/deleted (D36)   Global search  GET /search?q= \u2192 groups of top 5 per searchable module  New; permission- and location-scoped (D30)   Details  GET /{module}/{uuid}/view, /activity  Every foreign key comes back as { id, label, sub } for pickers (D36)   Delete  GET /{module}/{uuid}/delete/check, then DELETE /{module}/{uuid}/delete  Check lists dependants   Drafts  POST /drafts/save, GET /drafts/find, /drafts/for-context, /drafts, DELETE /drafts/{uuid}  Keyed by module, form type, record key   Media  POST /media/create, GET /media/list, /media/{uuid}/info, /download  Download needs the bearer token, so fetch as a blob   Location context  X-Location-Id header + location_filter param  Header checks permission; param narrows data   Booleans in FormData  1 / 0  Never true / false strings   - Services validate before touching a model; only validated keys reach create/update. - Permissions are checked by middleware with the same name the menu uses. "}, {"id": "review-checklist-before-merging-a-screen", "title": "Review checklist before merging a screen", "html": "<ul><li class=\"chk\">Checked at 360px and 1280px, light and dark; no horizontal page scroll<\/li><li class=\"chk\">Zero console errors and zero console warnings (e2e asserts it)<\/li><li class=\"chk\">Every menu, select, popover and tooltip is portalled and stays on screen<\/li><li class=\"chk\">Toolbar order is Refresh, Filters, Clear, Sort, then toggle and New; Refresh keeps content visible<\/li><li class=\"chk\">Filters, sort, page and tab are in the URL and survive a reload<\/li><li class=\"chk\">Top-bar search filters this module; \"Search everywhere\" works<\/li><li class=\"chk\">Create/edit form has drafts (or is listed as an exception with a reason)<\/li><li class=\"chk\">No native pickers; required asterisks are CSS; errors sit under fields<\/li><li class=\"chk\">Buttons and menus respect permissions; a direct URL without permission shows No access<\/li><li class=\"chk\">Delete uses the delete check and the YES gate<\/li><li class=\"chk\">Strings in English and Swahili<\/li><li class=\"chk\">Built only from components in <code>COMPONENTS.md<\/code>; new ones added to the library first<\/li><li class=\"chk\">Rule changes copied to the doc, <code>FRONTEND_RULES.md<\/code> and the Rules tab<\/li><\/ul>", "text": " - [ ] Checked at 360px and 1280px, light and dark; no horizontal page scroll - [ ] Zero console errors and zero console warnings (e2e asserts it) - [ ] Every menu, select, popover and tooltip is portalled and stays on screen - [ ] Toolbar order is Refresh, Filters, Clear, Sort, then toggle and New; Refresh keeps content visible - [ ] Filters, sort, page and tab are in the URL and survive a reload - [ ] Top-bar search filters this module; \"Search everywhere\" works - [ ] Create/edit form has drafts (or is listed as an exception with a reason) - [ ] No native pickers; required asterisks are CSS; errors sit under fields - [ ] Buttons and menus respect permissions; a direct URL without permission shows No access - [ ] Delete uses the delete check and the YES gate - [ ] Strings in English and Swahili - [ ] Built only from components in COMPONENTS.md; new ones added to the library first - [ ] Rule changes copied to the doc, FRONTEND_RULES.md and the Rules tab "}];

                <Icon :name="(C.draft.isParent ? visibleTo(editItem.item) : sp.includes(C.draft.perm)) ? 'Eye' : 'Lock'" :size="15" :class="(C.draft.isParent ? visibleTo(editItem.item) : sp.includes(C.draft.perm)) ? 'text-c1' : 'text-muted-foreground'"/>
                <span class="min-w-0 flex-1">{{ subject.name }} {{ (C.draft.isParent ? visibleTo(editItem.item) : sp.includes(C.draft.perm)) ? 'can see this.' : "can't see this." }}</span>

  };

  /* ---------- Grant popup: role first, user as exception */
  const GrantDialog = {
    setup() {
      const member = computed(() => GRANT.subject && GRANT.subject.kind === 'user' ? MEMBERS.find(m => m.email + m.phone === GRANT.subject.id) : null);
      const role = computed(() => GRANT.subject ? (GRANT.subject.kind === 'role' ? roleById(GRANT.subject.id) : roleById(member.value && member.value.role)) : null);
      const roleCount = computed(() => role.value ? MEMBERS.filter(m => m.role === role.value.id).length : 0);
      function toggle(pn) { const i = GRANT.picked.indexOf(pn); i > -1 ? GRANT.picked.splice(i, 1) : GRANT.picked.push(pn); }
      function confirm() {
        if (!GRANT.picked.length) return;
        if (GRANT.target === 'role' && role.value && !role.value.locked) { GRANT.picked.forEach(pn => { if (!role.value.perms.includes(pn)) role.value.perms.push(pn); }); G.toast(`Added to ${role.value.name}`, `${GRANT.picked.length} permission${GRANT.picked.length > 1 ? 's' : ''}. ${roleCount.value} ${roleCount.value === 1 ? 'person' : 'people'} with this role now see it.`, 'Shield'); }
        else if (member.value) { const k = member.value.email + member.value.phone; DIRECT[k] = [...new Set([...(DIRECT[k] || []), ...GRANT.picked])]; G.toast(`Given to ${member.value.name} only`, 'Shown as a direct permission on their profile.', 'UserRound'); }
        GRANT.open = false;
      }
      const ownerLocked = computed(() => role.value && role.value.locked);
      return { GRANT, member, role, roleCount, toggle, confirm, permLabel, holdersOf, ownerLocked };
    },
    template: `<Dialog :open="GRANT.open" @update:open="v => GRANT.open = v">
      <div v-if="GRANT.subject" class="grid gap-1.5 pr-6"><h2 class="text-lg font-semibold leading-none">Give access to {{ GRANT.title }}</h2>
        <p class="text-sm text-muted-foreground">{{ GRANT.subject.name }} is missing {{ GRANT.perms.length===1 ? 'this permission' : 'these permissions' }}. A parent menu appears as soon as any child is allowed.</p></div>
      <ul class="grid gap-1.5">
        <li v-for="pn in GRANT.perms" :key="pn"><label class="flex cursor-pointer items-start gap-3 rounded-lg border p-2.5 hover:bg-muted/50">
          <Checkbox :model-value="GRANT.picked.includes(pn)" @update:model-value="toggle(pn)" class="mt-0.5"/>
          <span class="min-w-0 flex-1"><span class="block text-sm font-medium">{{ permLabel(pn) }}</span><span class="block font-mono text-xs text-muted-foreground">{{ pn }}</span>
            <span class="mt-1 block text-[11px] text-muted-foreground">Already in: {{ holdersOf(pn).map(r=>r.name).join(', ') || 'no role' }}</span></span></label></li>
      </ul>
      <div class="grid gap-2" role="radiogroup" aria-label="Where to add it">
        <p class="text-sm font-medium">Where to add {{ GRANT.picked.length===1 ? 'it' : 'them' }}</p>
        <label :class="['flex cursor-pointer items-start gap-3 rounded-lg border p-3', GRANT.target==='role' ? 'border-primary bg-primary/5 ring-1 ring-primary' : '', ownerLocked && 'opacity-50']">
          <RadioGroupItem :checked="GRANT.target==='role'" :disabled="ownerLocked" @select="GRANT.target='role'" class="mt-0.5"/>
          <span class="min-w-0"><span class="flex items-center gap-2 text-sm font-medium">Add to the {{ role && role.name }} role<Badge variant="secondary">Recommended</Badge></span>
            <span class="mt-0.5 block text-xs text-muted-foreground">Everyone with this role gets it ({{ roleCount }} {{ roleCount===1 ? 'person' : 'people' }}). Easier to audit.</span></span></label>
        <label v-if="member" :class="['flex cursor-pointer items-start gap-3 rounded-lg border p-3', GRANT.target==='user' ? 'border-warning bg-warning/5 ring-1 ring-warning' : '']">
          <RadioGroupItem :checked="GRANT.target==='user'" @select="GRANT.target='user'" class="mt-0.5"/>
          <span class="min-w-0 flex-1"><span class="block text-sm font-medium">Give only {{ member.name }}</span>
            <span class="mt-0.5 block text-xs text-muted-foreground">An exception. It stays with them even if their role changes.</span>
            <Input v-if="GRANT.target==='user'" v-model="GRANT.reason" class="mt-2" placeholder="Reason, e.g. covering for Neema until 31 Oct"/></span></label>
      </div>
      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><Button variant="outline" @click="GRANT.open=false">Cancel</Button>
        <Button :disabled="!GRANT.picked.length || (GRANT.target==='role' && ownerLocked)" @click="confirm"><Icon name="KeyRound" :size="14"/>Grant {{ GRANT.picked.length }} permission{{ GRANT.picked.length===1 ? '' : 's' }}</Button></div>
    </Dialog>`
  };

  /* ---------- Roles: list page + details page (D39). Main roles = one per person org-wide; custom roles are given at a location and add to the main role (D21). */
  function openRole(id, tab) { G.roleId = id; nav('role', tab); }
  G.roleId = 'editor';
  /* who holds a role: main roles from users, custom roles from location assignments (one row per person, with their locations) */
  function roleHolders(id) {
    const r = roleById(id); if (!r) return [];
    if (r.system) return MEMBERS.filter(m => m.role === id && m.email !== PREVIEW_EMAIL).map(m => ({ key: m.email + m.phone, m, locs: [] }));
    const by = new Map();
    assignsOf().filter(a => a.email !== PREVIEW_EMAIL && a.roles.includes(id)).forEach(a => { const m = memberByEmail(a.email); if (!m) return; const k = m.email + m.phone; if (!by.has(k)) by.set(k, { key: k, m, locs: [] }); by.get(k).locs.push(a.loc); });
    return [...by.values()];
  }
  const roleIcon = (r) => r.locked ? 'Crown' : r.system ? 'Shield' : 'ShieldPlus';
  const menusFor = (r) => MENU.filter(m => menuVisibleFor(m, r.perms)).length;
  const canEditRole = () => canManage() && myPerms.value.includes('Roles.manage');
  const NEWROLE = reactive({ open: false, name: '', desc: '', from: '' });

  const NewRoleDialog = {
    setup() {
      const fromOpts = computed(() => [{ value: '', label: 'Start empty (only "See forms")' }, ...ROLES.filter(r => !r.locked).map(r => ({ value: r.id, label: r.name + ' · ' + r.perms.length + ' permissions', icon: roleIcon(r) }))]);
      const taken = computed(() => ROLES.some(r => r.name.toLowerCase() === NEWROLE.name.trim().toLowerCase()));
      function create() {
        const id = ulid('r'); const src = roleById(NEWROLE.from);
        ROLES.push({ id, name: NEWROLE.name.trim(), desc: NEWROLE.desc.trim() || 'Custom role.', system: false, perms: src ? [...src.perms] : ['Forms.list'], createdAt: 'Today', createdBy: ME.name, updatedAt: 'Today', updatedBy: ME.name });
        NEWROLE.open = false; G.toast('Role created', src ? 'Copied ' + src.perms.length + ' permissions from ' + src.name + '.' : 'Starts with "See forms". Add what it needs.', 'ShieldPlus');

      return { NEWROLE, fromOpts, taken, create };
    },
    template: `<Dialog :open="NEWROLE.open" @update:open="v => NEWROLE.open = v">

      <div class="grid gap-3">

        <div class="grid gap-1.5"><span class="text-sm font-medium">Start from</span><Select v-model="NEWROLE.from" :options="fromOpts" aria-label="Start from"/><p class="text-xs text-muted-foreground">Copies the permissions once. Later changes to that role don't flow here.</p></div>
      </div>
      <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><Button variant="outline" @click="NEWROLE.open=false">Cancel</Button><Button :disabled="NEWROLE.name.trim().length < 2 || taken" @click="create"><Icon name="ShieldPlus" :size="14"/>Create role</Button></div>

  };
  function newRole() { if (G.viewAs) return readOnly(); Object.assign(NEWROLE, { open: true, name: '', desc: '', from: '' }); }

  const RolesPage = {
    setup() {
      const LS = useList({ noun: 'roles', rows: () => ROLES, search: (r, q) => (r.name + ' ' + r.desc).toLowerCase().includes(q), sort: 'rank',

        fields: () => [
          { key: 'type', label: 'Type', type: 'select', options: [{ value: 'main', label: 'Main role' }, { value: 'custom', label: 'Custom (location) role' }], get: r => r.system ? 'main' : 'custom' },
          { key: 'people', label: 'People', type: 'number', get: r => roleHolders(r.id).length },

      const typeTabs = computed(() => [{ value: 'all', label: 'All', count: ROLES.length }, { value: 'main', label: 'Main', count: ROLES.filter(r => r.system).length }, { value: 'custom', label: 'Custom', count: ROLES.filter(r => !r.system).length }]);
      const quick = computed({ get: () => { const f = LS.S.filters.type; return !f ? 'all' : (f.op === 'in' && f.value.length === 1) ? f.value[0] : ''; }, set: v => LS.setFilter('type', v === 'all' ? null : { op: 'in', value: [v] }) });
      watchEffect(() => { if (G.view === 'roles') listCount.value = (G.search || '').trim().length >= 2 ? LS.rows.value.length : null; });
      const kpi = computed(() => { const custom = ROLES.filter(r => !r.system); const holders = new Set(); custom.forEach(r => roleHolders(r.id).forEach(h => holders.add(h.key))); return { total: ROLES.length, custom: custom.length, people: MEMBERS.filter(m => m.email !== PREVIEW_EMAIL).length, located: holders.size, direct: Object.values(DIRECT).filter(a => a.length).length, perms: PERMS.length }; });
      const menu = (r) => [{ id: 'open', label: 'Open', icon: 'ArrowUpRight' }, { id: 'perms', label: 'Permissions', icon: 'KeyRound' }, { id: 'people', label: 'People', icon: 'Users' },
        ...(canViewAs() && !r.locked ? [{ id: 'preview', label: 'Preview this role', icon: 'ScanEye' }] : []),
        ...(canEditRole() ? [{ separator: true }, { id: 'dup', label: 'Duplicate', icon: 'Copy' }] : [])];
      function onMenu(r, it) {

      return { G, LS, typeTabs, quick, kpi, menu, onMenu, openRole, roleHolders, roleIcon, menusFor, PERMS, MENU, canEditRole, newRole, initials };
    },
    template: `<div class="mx-auto grid max-w-[1200px] grid-cols-[minmax(0,1fr)] gap-4">

        <div class="kpi rounded-xl border bg-card p-3.5 shadow-sm" style="animation-delay:60ms"><div class="flex items-center justify-between"><p class="text-xs font-medium text-muted-foreground">People</p><span class="grid h-6 w-6 place-items-center rounded-md bg-primary/10 text-primary"><Icon name="Users" :size="13"/></span></div><p class="mt-1.5 text-2xl font-semibold tnum">{{ kpi.people }}</p><p class="mt-1 text-[11px] text-muted-foreground">Each holds one main role</p></div>
        <div class="kpi rounded-xl border bg-card p-3.5 shadow-sm" style="animation-delay:120ms"><div class="flex items-center justify-between"><p class="text-xs font-medium text-muted-foreground">With a custom role</p><span class="grid h-6 w-6 place-items-center rounded-md bg-primary/10 text-primary"><Icon name="MapPin" :size="13"/></span></div><p class="mt-1.5 text-2xl font-semibold tnum">{{ kpi.located }}</p><p class="mt-1 text-[11px] text-muted-foreground">Given at one or more locations</p></div>
        <div class="kpi rounded-xl border bg-card p-3.5 shadow-sm" style="animation-delay:180ms"><div class="flex items-center justify-between"><p class="text-xs font-medium text-muted-foreground">Direct grants</p><span class="grid h-6 w-6 place-items-center rounded-md bg-warning/15 text-warning"><Icon name="UserRound" :size="13"/></span></div><p class="mt-1.5 text-2xl font-semibold tnum">{{ kpi.direct }}</p><p class="mt-1 text-[11px] text-muted-foreground">People with exceptions outside a role</p></div>

        <div class="hidden overflow-x-auto sm:block"><table class="w-full min-w-[760px] text-sm">
          <thead><tr class="border-b text-left text-xs text-muted-foreground"><th class="px-4 py-2.5 font-medium">Role</th><th class="px-3 py-2.5 font-medium">Type</th><th class="w-56 px-3 py-2.5 font-medium">Permissions</th><th class="px-3 py-2.5 text-right font-medium">Menus</th><th class="px-3 py-2.5 font-medium">People</th><th class="w-10"></th></tr></thead>

              <div class="min-w-0"><p class="flex items-center gap-1.5 truncate font-medium">{{ r.name }}<Icon v-if="r.locked" name="Lock" :size="11" class="text-muted-foreground" aria-label="Locked"/></p><p class="max-w-[22rem] truncate text-xs text-muted-foreground">{{ r.desc }}</p></div></div></td>

            <td class="px-2" @click.stop><DropdownMenu :items="menu(r)" @select="it => onMenu(r, it)"><template #trigger><Button variant="ghost" size="icon-sm" :aria-label="'Actions for ' + r.name"><Icon name="EllipsisVertical" :size="15"/></Button></template></DropdownMenu></td>
          </tr></tbody></table></div>

  };

  function duplicateRole(r) {
    if (G.viewAs) return readOnly();
    let name = r.name + ' (copy)', n = 2; while (ROLES.some(x => x.name === name)) name = r.name + ' (copy ' + n++ + ')';
    const id = ulid('r'); ROLES.push({ id, name, desc: r.desc, system: false, perms: [...r.perms], createdAt: 'Today', createdBy: ME.name, updatedAt: 'Today', updatedBy: ME.name });

  }

          <div class="kpi rounded-xl border bg-card p-3.5 shadow-sm" style="animation-delay:120ms"><div class="flex items-center justify-between"><p class="text-xs font-medium text-muted-foreground">People</p><span class="grid h-6 w-6 place-items-center rounded-md bg-primary/10 text-primary"><Icon name="Users" :size="13"/></span></div><p class="mt-1.5 text-2xl font-semibold tnum">{{ kpi.people }}</p><p class="mt-1 text-[11px] text-muted-foreground">{{ direct.length }} assigned here</p></div>
          <div class="kpi rounded-xl border bg-card p-3.5 shadow-sm" style="animation-delay:180ms"><div class="flex items-center justify-between"><p class="text-xs font-medium text-muted-foreground">Completed normally</p><span class="grid h-6 w-6 place-items-center rounded-md bg-primary/10 text-primary"><Icon name="CircleCheck" :size="13"/></span></div><p class="mt-1.5 text-2xl font-semibold tnum">{{ kpi.completion ? kpi.completion + '%' : '–' }}</p><div class="mt-2 h-1.5 overflow-hidden rounded-full" style="background:color-mix(in oklab,var(--c1) 18%,hsl(var(--card)))"><div class="h-full rounded-full bg-c1 transition-[width] duration-700" :style="{ width: (kpi.completion || 0) + '%' }"></div></div></div>
        </div>
        <div class="grid grid-cols-1 gap-3 lg:grid-cols-3 [&>*]:min-w-0">
          <Card class="kpi lg:col-span-2" style="animation-delay:200ms"><div class="p-4">
            <div class="flex items-center justify-between gap-2"><h3 class="text-sm font-semibold">{{ kids.length ? 'Responses by location' : 'Responses by form' }}</h3><span class="text-xs text-muted-foreground">Last 30 days</span></div>
            <div v-if="bars.length" class="mt-3 grid gap-2.5">
              <div v-for="(b, i) in bars" :key="b.label" :role="b.id ? 'link' : null" :tabindex="b.id ? 0 : null" @click="b.id && openLoc(b.id)" @keydown.enter="b.id && openLoc(b.id)" :class="['grid gap-1 rounded-md text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring', b.id ? 'group cursor-pointer' : '']">
                <div class="flex items-center justify-between gap-3 text-xs"><span class="truncate font-medium group-hover:underline">{{ b.label }}</span><span class="tnum text-muted-foreground">{{ b.v }}</span></div>
                <div class="h-2 overflow-hidden rounded-full bg-muted"><div class="bar-grow h-full rounded-full" :style="{ width: b.pct + '%', background: b.color, animationDelay: (i*70)+'ms' }"></div></div></div></div>
            <p v-else class="mt-6 pb-4 text-center text-sm text-muted-foreground">No responses here yet.</p></div></Card>
          <Card class="kpi" style="animation-delay:260ms"><div class="p-4">
            <div class="flex items-center justify-between"><h3 class="text-sm font-semibold">Team here</h3><Button variant="ghost" size="sm" class="-mr-2 h-7" @click="T.tab='users'">All<Icon name="ChevronRight" :size="13"/></Button></div>
            <ul v-if="direct.length" class="mt-2 grid gap-2"><li v-for="a in direct.slice(0,5)" :key="a.id" class="flex items-center gap-2.5"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-primary/10 text-[11px] font-semibold uppercase text-primary">{{ initials((memberByEmail(a.email)||{name:'?'}).name) }}</span><div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">{{ (memberByEmail(a.email)||{}).name }}<Icon v-if="a.primary" name="Star" :size="11" class="ml-1 inline text-warning" fill="currentColor" aria-label="Primary"/></p><p class="truncate text-xs text-muted-foreground">{{ a.roles.length ? a.roles.map(r => (roleById(r)||{}).name).join(', ') : ROLE[(memberByEmail(a.email)||{}).role] + ' (main role)' }}</p></div></li></ul>
            <p v-else class="mt-4 text-sm text-muted-foreground">Nobody assigned directly. People above inherit access here.</p></div></Card>
        </div>
        <div class="grid grid-cols-1 gap-3 lg:grid-cols-2 [&>*]:min-w-0">
          <Card v-if="kids.length" class="kpi" style="animation-delay:300ms"><div class="p-4"><h3 class="text-sm font-semibold">Under {{ loc.name }}</h3>
            <ul class="mt-2 divide-y"><li v-for="k in kids" :key="k.id"><button type="button" class="flex w-full items-center gap-2.5 py-2 text-left hover:bg-muted/40" @click="openLoc(k.id)"><span class="grid h-7 w-7 place-items-center rounded-md bg-primary/10 text-primary"><Icon :name="LTYPES[k.type].icon" :size="13"/></span><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ k.name }}</span><span class="block text-xs text-muted-foreground tnum">{{ usersAt(k.id).length }} people · {{ respOf(k.id) }} responses</span></span><span :class="['h-2 w-2 rounded-full', LSTAT[k.status].dot]"></span><Icon name="ChevronRight" :size="14" class="text-muted-foreground"/></button></li></ul></div></Card>
          <Card class="kpi" style="animation-delay:340ms"><div class="p-4"><h3 class="text-sm font-semibold">Recent activity</h3>
            <ol class="mt-2 grid gap-3"><li v-for="(e, i) in ACTIVITY" :key="i" class="flex gap-3"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-muted text-muted-foreground"><Icon :name="e.icon" :size="13"/></span><div class="min-w-0 text-sm"><p><span class="font-medium">{{ e.text }}</span><span v-if="e.what" class="text-muted-foreground"> · {{ e.what }}</span></p><p class="text-xs text-muted-foreground">{{ e.who }} · {{ e.when }}</p></div></li></ol></div></Card>
        </div>
      </template>

      <!-- DETAILS -->
      <template v-if="T.tab==='details'">
        <div v-if="!T.edit" class="grid grid-cols-1 gap-3 lg:grid-cols-2 [&>*]:min-w-0">
          <Card class="kpi"><div class="p-4"><div class="flex items-center justify-between"><h3 class="text-sm font-semibold">Identity</h3><Button v-if="canEditLoc()" variant="ghost" size="sm" class="-mr-2 h-7" @click="startEdit"><Icon name="Pencil" :size="13"/>Edit</Button></div>
            <dl class="mt-2 grid grid-cols-[8rem_minmax(0,1fr)] gap-x-3 gap-y-2.5 text-sm">
              <dt class="text-muted-foreground">Name</dt><dd class="font-medium">{{ loc.name }}</dd>
              <dt class="text-muted-foreground">Code</dt><dd class="font-mono text-xs leading-5">{{ loc.code }}</dd>
              <dt class="text-muted-foreground">Type</dt><dd>{{ LTYPES[loc.type].label }}</dd>
              <dt class="text-muted-foreground">Parent</dt><dd><RelatedLink v-if="loc.parent" :loc-id="loc.parent"/><span v-else class="text-muted-foreground">Top level</span></dd>
              <dt class="text-muted-foreground">Status</dt><dd>{{ LSTAT[loc.status].label }}</dd>
              <dt class="text-muted-foreground">Sells to public</dt><dd>{{ loc.sales ? 'Yes' : 'No' }}</dd></dl></div></Card>
          <Card class="kpi" style="animation-delay:60ms"><div class="p-4"><h3 class="text-sm font-semibold">Contact</h3>
            <dl class="mt-2 grid grid-cols-[8rem_minmax(0,1fr)] gap-x-3 gap-y-2.5 text-sm">
              <dt class="text-muted-foreground">Phone</dt><dd class="tnum">{{ loc.phone || '–' }}</dd>
              <dt class="text-muted-foreground">Email</dt><dd class="truncate">{{ loc.email || '–' }}</dd>
              <dt class="text-muted-foreground">Opening hours</dt><dd>{{ loc.hours }}</dd></dl></div></Card>
          <Card class="kpi lg:col-span-2" style="animation-delay:120ms"><div class="p-4"><h3 class="text-sm font-semibold">Address</h3>
            <div class="mt-2 grid gap-4 md:grid-cols-[minmax(0,1fr)_16rem]">
              <dl class="grid grid-cols-[8rem_minmax(0,1fr)] gap-x-3 gap-y-2.5 text-sm">
                <dt class="text-muted-foreground">Street</dt><dd>{{ loc.address || '–' }}</dd>
                <dt class="text-muted-foreground">Ward</dt><dd>{{ loc.ward || '–' }}</dd>
                <dt class="text-muted-foreground">District</dt><dd>{{ loc.district || '–' }}</dd>
                <dt class="text-muted-foreground">Region</dt><dd>{{ loc.region || '–' }}</dd>
                <dt class="text-muted-foreground">Country</dt><dd>{{ loc.country }}</dd></dl>
              <div class="relative grid min-h-[8rem] place-items-center overflow-hidden rounded-lg border bg-muted/40" style="background-image:radial-gradient(hsl(var(--border)) 1px,transparent 1px);background-size:14px 14px">
                <div v-if="loc.lat" class="grid place-items-center text-center"><span class="grid h-9 w-9 place-items-center rounded-full bg-primary text-primary-foreground shadow-lg"><Icon name="MapPin" :size="16"/></span><p class="mt-2 font-mono text-[11px] text-muted-foreground">{{ loc.lat.toFixed(4) }}, {{ loc.lng.toFixed(4) }}</p></div>
                <p v-else class="text-xs text-muted-foreground">No coordinates yet</p></div>
            </div></div></Card>
          <Card class="kpi" style="animation-delay:160ms"><div class="p-4"><h3 class="text-sm font-semibold">Photo and directions</h3>
            <div class="mt-2 grid gap-4 sm:grid-cols-[10rem_minmax(0,1fr)]">
              <MediaThumb v-if="loc.photo && mediaById(loc.photo)" :m="mediaById(loc.photo)"/><div v-else class="grid aspect-[4/3] place-items-center rounded-lg border border-dashed text-xs text-muted-foreground">No photo</div>
              <div v-if="loc.notes" class="rt-body text-sm" v-html="loc.notes"></div><p v-else class="text-sm text-muted-foreground">No directions yet.</p></div></div></Card>
          <Card class="kpi" style="animation-delay:200ms"><div class="p-4"><h3 class="text-sm font-semibold">Timeline</h3>
            <dl class="mt-2 grid grid-cols-[8rem_minmax(0,1fr)] gap-x-3 gap-y-2.5 text-sm">
              <dt class="flex items-center gap-1.5 text-muted-foreground"><Icon name="CalendarPlus" :size="13"/>Created</dt><dd>{{ loc.createdAt }}</dd>
              <dt class="flex items-center gap-1.5 text-muted-foreground"><Icon name="UserPlus" :size="13"/>Created by</dt><dd>{{ (memberByEmail(loc.createdBy) || { name: '–' }).name }}</dd>
              <dt class="flex items-center gap-1.5 text-muted-foreground"><Icon name="Clock" :size="13"/>Updated</dt><dd>{{ loc.updatedAt }}</dd>
              <dt class="flex items-center gap-1.5 text-muted-foreground"><Icon name="UserPen" :size="13"/>Updated by</dt><dd>{{ (memberByEmail(loc.updatedBy) || { name: '–' }).name }}</dd>
              <dt class="flex items-center gap-1.5 text-muted-foreground"><Icon name="Hash" :size="13"/>UUID</dt><dd class="truncate font-mono text-xs leading-5" :title="loc.uuid">{{ loc.uuid }}</dd></dl></div></Card>
        </div>
        <Card v-else class="kpi"><form class="grid grid-cols-[minmax(0,1fr)] gap-4 p-4 sm:p-5" @submit.prevent="saveEdit">
          <DraftBanner :draft="draft"/>
          <div class="flex items-center justify-between"><h3 class="font-semibold">Edit location</h3><Badge variant="outline">{{ D.code }}</Badge></div>
          <div class="grid gap-3 sm:grid-cols-2 [&>*]:min-w-0">
            <div class="grid gap-1.5"><label for="ld-n" class="text-sm font-medium">Name</label><Input id="ld-n" v-model="D.name"/></div>
            <div class="grid gap-1.5"><label for="ld-c" class="text-sm font-medium">Code</label><Input id="ld-c" v-model="D.code" class="font-mono"/></div>
            <div v-if="loc.type!=='org'" class="grid gap-1.5"><span class="text-sm font-medium">Type</span><Select v-model="D.type" :options="typeOpts"/></div>
            <ApiSelect v-if="loc.parent" v-model="D.parent" module="locations" :exclude="subtreeIds(loc.id)" :selected-options="loc.parent ? [{ value: loc.parent, label: (locById(loc.parent) || {}).name, sub: 'Current parent' }] : []" label="Parent" required help="It and everything under it move together."/>
            <div v-if="loc.parent" class="grid gap-1.5"><span class="text-sm font-medium">Status</span><Select v-model="D.status" :options="statusOpts"/></div>
            <div class="flex items-center justify-between gap-4 rounded-lg border px-3 py-2"><span class="text-sm font-medium">Sells to public</span><Switch v-model="D.sales"/></div>
