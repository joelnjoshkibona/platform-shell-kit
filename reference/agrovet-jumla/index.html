<title>Agrovet and Jumla UI</title>
<meta name="description" content="A clickable prototype of the Agrovet and Jumla phone apps: how they list, navigate, filter and show a profile.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* Layout concept: a 390 x 844 phone beside a screen picker (desktop), the app alone on a phone.
   Colours are the apps' own tokens (resources/js/src/style.css, shared by Agrovet and Jumla), stored as oklch channels. */
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] },
    colors: ['background','foreground','card','card-foreground','primary','primary-foreground','muted','muted-foreground','accent','accent-foreground','destructive','destructive-foreground','border','input','ring','sidebar','sidebar-foreground','sidebar-accent','sidebar-accent-foreground','sidebar-border','canvas']
      .reduce((o, k) => (o[k] = 'oklch(var(--' + k + ') / <alpha-value>)', o), {}),
    borderRadius: { xl: 'calc(var(--radius) + 4px)', lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)' }
  } }
};
</script>
<style>
:root { --canvas: 0.965 0.004 264; --radius: 0.625rem; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --canvas: 0.16 0.012 264; color-scheme: dark; } }
:root[data-theme="dark"] { --canvas: 0.16 0.012 264; color-scheme: dark; }
body { background: oklch(var(--canvas)); margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; }
.app { --sa-top: 30px; --sa-bottom: 14px; --sa-left: 0px; --sa-right: 0px;
  --background: 1 0 0; --foreground: 0.129 0.042 264.695; --card: 1 0 0; --card-foreground: 0.129 0.042 264.695;
  --primary: 0.208 0.042 265.755; --primary-foreground: 0.984 0.003 247.858; --muted: 0.94 0.010 264; --muted-foreground: 0.554 0.046 257.417;
  --accent: 0.95 0.008 264; --accent-foreground: 0.208 0.042 265.755; --destructive: 0.577 0.245 27.325; --destructive-foreground: 0.984 0.003 247.858;
  --border: 0.88 0.015 264; --input: 0.88 0.015 264; --ring: 0.704 0.04 256.788;
  --sidebar: 0.98 0.005 264; --sidebar-foreground: 0.129 0.042 264.695; --sidebar-accent: 0.95 0.008 264; --sidebar-accent-foreground: 0.208 0.042 265.755; --sidebar-border: 0.88 0.015 264;
  background: oklch(var(--background)); color: oklch(var(--foreground)); }
.app.dark { --background: 0.20 0.015 264; --foreground: 0.90 0.005 264; --card: 0.26 0.018 264; --card-foreground: 0.90 0.005 264;
  --primary: 0.984 0.003 247.858; --primary-foreground: 0.208 0.042 265.755; --muted: 0.24 0.016 264; --muted-foreground: 0.65 0.015 264;
  --accent: 0.28 0.020 264; --accent-foreground: 0.984 0.003 247.858; --destructive: 0.50 0.18 25; --destructive-foreground: 0.984 0.003 247.858;
  --border: 0.35 0.020 264; --input: 0.38 0.025 264; --ring: 0.50 0.10 264;
  --sidebar: 0.18 0.018 265; --sidebar-foreground: 0.90 0.005 264; --sidebar-accent: 0.24 0.020 265; --sidebar-accent-foreground: 0.984 0.003 247.858; --sidebar-border: 0.35 0.020 264; }
.app *, .app *::before, .app *::after { border-color: oklch(var(--border)); }
.scroll { scrollbar-width: none; } .scroll::-webkit-scrollbar { display: none; }
.slide-up-enter-active, .slide-up-leave-active { transition: transform .3s ease; } .slide-up-enter-from, .slide-up-leave-to { transform: translateY(100%); }
.fade-enter-active, .fade-leave-active { transition: opacity .2s ease; } .fade-enter-from, .fade-leave-to { opacity: 0; }
.drawer-enter-active, .drawer-leave-active { transition: transform .25s ease; } .drawer-enter-from, .drawer-leave-to { transform: translateX(-100%); }
@keyframes pulse2 { 50% { opacity: .5; } } .skel { animation: pulse2 1.6s ease-in-out infinite; background: oklch(var(--muted)); }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } .slide-up-enter-active, .slide-up-leave-active, .drawer-enter-active, .drawer-leave-active { transition: none; } }
.tnum { font-variant-numeric: tabular-nums; }
</style>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<div id="root"></div>
<script>
const { createApp, reactive, ref, computed, h, watch, onMounted, onBeforeUnmount, nextTick } = Vue;

const Icon = { name: 'Icon', props: { name: String, size: { type: [Number, String], default: 16 } },
  setup(p) { return () => { const n = window.lucide && window.lucide.icons && window.lucide.icons[p.name]; const kids = n ? (n[0] === 'svg' ? n[2] : n) : [];
    return h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: p.size, height: p.size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', class: 'shrink-0' }, kids.map(([t, a]) => h(t, a))); }; } };

const fmt = (n) => Math.round(n).toLocaleString('en-US');
const TZS = (n) => 'TZS ' + fmt(n);

/* ------------------------------------------------------------ the two apps, as they differ */
const APPS = {
  jumla: {
    name: 'Jumla Super App', short: 'Jumla', bell: true, salesLabel: 'Orders', salesRoute: 'orders', period: false, fab: 'New order',
    user: { name: 'Neema Kileo', username: 'JM-0231', first: 'Neema', initials: 'NK', role: 'Sales agent', ward: 'Mbeya Urban', cluster: 'Cluster B', supervisor: 'Ally Mushi', district: 'Mbeya' },
    menu: [
      { label: 'Main', items: [['dashboard', 'Dashboard', 'LayoutDashboard'], ['customers', 'Customers', 'Users']] },
      { label: 'Sales', items: [['orders', 'Orders', 'ShoppingBasket'], ['collections', 'Collections', 'PackageCheck'], ['payments', 'Payments', 'CreditCard'], ['reports', 'Reports', 'FileText']] },
      { label: 'Inventory', items: [['stocks', 'Stocks', 'Package'], ['requests', 'Stock Requests', 'ClipboardList'], ['dispatch', 'Stock Dispatch', 'Package2'], ['machines', 'Agrimachines', 'Tractor']] },
      { label: 'Management', items: [['lpo', 'LPO Orders', 'Handshake']] },
      { label: 'Account', items: [['profile', 'Profile', 'User']] }
    ]
  },
  agrovet: {
    name: 'Agrovet Super App', short: 'Agrovet', bell: false, salesLabel: 'Sales', salesRoute: 'orders', period: true, fab: 'New sale',
    user: { name: 'Baraka Mollel', username: 'AG-1187', first: 'Baraka', initials: 'BM', role: 'Agrovet dealer', ward: 'Karatu', district: 'Karatu', outstanding: 'TZS 412,500' },
    menu: [
      { label: 'Main', items: [['dashboard', 'Dashboard', 'LayoutDashboard'], ['customers', 'Customers', 'Users'], ['orders', 'Sales', 'ShoppingCart'], ['create', 'Create Sale', 'ShoppingBasket']] },
      { label: 'Inventory', items: [['stocks', 'Stocks', 'Package'], ['pending', 'Pending Stocks', 'PackageCheck'], ['requests', 'Stock Requests', 'ClipboardList'], ['dispatch', 'Stock Dispatch', 'Package2'], ['machines', 'Agrimachines', 'Tractor'], ['groups', 'Farmer Group Orders', 'Handshake']] },
      { label: 'PAYG Devices', items: [['paygstock', 'PAYG Stocks', 'Package'], ['paygpending', 'Pending PAYG Stocks', 'PackageCheck'], ['paygsales', 'PAYG Sales', 'Receipt'], ['issue', 'Issue PAYG', 'FileText']] },
      { label: 'Reports', items: [['payments', 'Payments', 'CreditCard'], ['reports', 'Sales Reports', 'FileText']] },
      { label: 'Settings', items: [['profile', 'Profile', 'User'], ['printer', 'Printer', 'Printer'], ['theme', 'Theme', 'Sun'], ['device', 'Device Info', 'Smartphone']] }
    ]
  }
};
const DRAWN = ['dashboard', 'customers', 'orders', 'order', 'notifications', 'profile', 'theme', 'device'];

/* ------------------------------------------------------------ mock data (Tanzanian shop, agro inputs) */
const ORDERS = [
  { n: 'ORD-2610-0187', c: 'Juma Mwakyusa', p: '0754 112 908', total: 184000, paid: 100000, status: 'pending', type: 2, approved: false, date: '16 Oct 2026' },
  { n: 'ORD-2610-0186', c: 'Halima Said', p: '0712 440 361', total: 62500, paid: 62500, status: 'paid', type: 1, approved: true, date: '16 Oct 2026' },
  { n: 'ORD-2610-0181', c: 'Emmanuel Lyimo', p: '0765 902 114', total: 318000, paid: 318000, status: 'collected', type: 1, approved: true, date: '15 Oct 2026' },
  { n: 'ORD-2610-0177', c: 'Rehema Chuwa', p: '0688 201 745', total: 47000, paid: 52000, status: 'paid', type: 1, approved: true, date: '14 Oct 2026' },
  { n: 'ORD-2610-0170', c: 'Peter Ngowi', p: '0754 330 019', total: 96000, paid: 0, status: 'cancelled', type: 1, approved: true, date: '13 Oct 2026' },
  { n: 'ORD-2610-0166', c: 'Zainabu Mtei', p: '0713 887 520', total: 225000, paid: 75000, status: 'pending', type: 2, approved: true, date: '12 Oct 2026' }
];
const CUSTOMERS = [
  ['Juma Mwakyusa', '0754 112 908', 'Mwakaleli', 84000], ['Halima Said', '0712 440 361', 'Isyonje', 0], ['Emmanuel Lyimo', '0765 902 114', 'Tukuyu', 0],
  ['Rehema Chuwa', '0688 201 745', 'Rungwe', -5000], ['Peter Ngowi', '0754 330 019', 'Ileje', 96000], ['Zainabu Mtei', '0713 887 520', 'Busokelo', 150000]
];
const NOTES = [
  { id: 1, unread: true, title: 'Credit order approved', body: 'ORD-2610-0166 for Zainabu Mtei (TZS 225,000) was approved by your supervisor. You can now collect stock.', when: '2 h ago' },
  { id: 2, unread: true, title: 'Stock dispatch received', body: 'Dispatch DSP-0412 (14 items) arrived at Mbeya store and is waiting for you to confirm.', when: 'Yesterday' },
  { id: 3, unread: false, title: 'Payment recorded', body: 'TZS 62,500 from Halima Said was recorded against ORD-2610-0186.', when: '14 Oct' },
  { id: 4, unread: false, title: 'New app version', body: 'Version 1.4.2 is ready. Open Profile and tap Check for Updates.', when: '12 Oct' }
];
const ITEMS = [{ n: 'Maize seed SC 403, 2 kg', q: 6, u: 14000 }, { n: 'NPK 17:17:17, 50 kg', q: 2, u: 62000 }, { n: 'Knapsack sprayer 16 L', q: 1, u: 16000 }];

const STATUS_CLS = { pending: 'bg-amber-100 text-amber-700 border-amber-200', paid: 'bg-blue-100 text-blue-700 border-blue-200', collected: 'bg-green-100 text-green-700 border-green-200', cancelled: 'bg-red-100 text-red-700 border-red-200' };
const balCls = (b) => b > 0 ? 'bg-amber-100 text-amber-700 border-amber-200' : b < 0 ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-green-100 text-green-700 border-green-200';

/* ------------------------------------------------------------ store */
const S = reactive({ app: 'jumla', dark: false, route: 'dashboard', stack: [], drawer: false, filter: false, list: 'data', period: 'week', tab: 'all',
  expanded: null, fStatus: 'all', fType: 'all', fQ: '', fRange: 'all', themeMode: 'light', checking: false, upToDate: false, loadingMore: false, shown: 4, order: ORDERS[0] });
const A = computed(() => APPS[S.app]);
function go(r, o) { S.drawer = false; S.filter = false; S.stack.push(S.route); S.route = r; if (o) S.order = o; }
function swap(r) { S.drawer = false; S.filter = false; S.stack = []; S.route = r; S.list = 'data'; }
function back() { if (S.filter) { S.filter = false; return; } if (S.drawer) { S.drawer = false; return; } S.route = S.stack.pop() || 'dashboard'; }
const titleOf = (r) => ({ dashboard: 'Dashboard', customers: 'Customers', orders: A.value.salesLabel, order: S.order.n, notifications: 'Notifications', profile: 'My Profile', theme: 'Theme', device: 'Device Info' }[r] || null);

/* ------------------------------------------------------------ pieces (the apps' own components) */
const Header = { props: { title: String, showBack: Boolean }, components: { Icon },
  setup() { return { S, A, back, go, unread: computed(() => NOTES.filter(n => n.unread).length) }; },
  template: `<header class="flex shrink-0 items-center justify-between border-b border-border bg-background px-4 py-3" style="padding-top:calc(.75rem + var(--sa-top))">
    <button v-if="!showBack" type="button" class="-ml-1 grid h-7 w-7 place-items-center rounded-md hover:bg-accent" aria-label="Open menu" @click="S.drawer = true"><Icon name="PanelLeft" :size="16"/></button>
    <button v-else type="button" class="grid h-8 w-8 place-items-center rounded-full active:bg-muted" aria-label="Back" @click="back"><Icon name="ChevronLeft" :size="20"/></button>
    <span class="truncate px-2 text-base font-semibold">{{ title || A.name }}</span>
    <div class="flex items-center gap-2">
      <button v-if="A.bell" type="button" class="relative grid h-8 w-8 place-items-center rounded-full active:bg-muted" aria-label="Notifications" @click="go('notifications')"><Icon name="Bell" :size="20"/>
        <span v-if="unread" class="absolute -right-0.5 -top-0.5 grid h-4 min-w-4 place-items-center rounded-full bg-destructive px-1 text-[10px] font-bold text-destructive-foreground">{{ unread }}</span></button>
      <button type="button" class="grid h-8 w-8 place-items-center rounded-full bg-primary text-xs font-bold text-primary-foreground active:opacity-80" aria-label="My profile" @click="go('profile')">{{ A.user.initials }}</button>
    </div></header>` };

const Sidebar = { components: { Icon },
  setup() {
    const active = computed(() => { const r = S.route === 'order' ? 'orders' : S.route; return r; });
    const pick = (r) => { if (DRAWN.includes(r)) swap(r); else swap(r); };
    return { S, A, active, pick };
  },
  template: `<div v-if="S.drawer" class="absolute inset-0 z-[60]">
      <transition name="fade" appear><div class="absolute inset-0 bg-black/50" @click="S.drawer = false"></div></transition>
      <transition name="drawer" appear><aside class="absolute inset-y-0 left-0 flex w-[18rem] max-w-[85%] flex-col bg-sidebar text-sidebar-foreground shadow-xl" aria-label="Main menu">
        <div class="shrink-0 bg-primary px-4 py-5 text-primary-foreground" style="padding-top:calc(1.25rem + var(--sa-top))">
          <div class="flex items-center gap-3"><div class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-primary-foreground/20 text-lg font-bold">{{ A.user.initials }}</div>
            <div class="min-w-0"><p class="truncate text-sm font-bold leading-tight">{{ A.user.name }}</p><p class="truncate text-xs text-primary-foreground/70">{{ A.user.username }}</p></div></div>
          <div v-if="S.app === 'jumla'" class="mt-3 flex flex-wrap gap-1.5">
            <span class="rounded-full bg-primary-foreground/15 px-2.5 py-0.5 text-[10px] font-medium capitalize text-primary-foreground/90">{{ A.user.role }} · {{ A.user.ward }}</span>
            <span class="rounded-full bg-primary-foreground/15 px-2.5 py-0.5 text-[10px] font-medium capitalize text-primary-foreground/90">{{ A.user.cluster }}</span></div>
        </div>
        <nav class="scroll min-h-0 flex-1 overflow-y-auto p-2" style="padding-bottom:calc(.5rem + var(--sa-bottom))">
          <div v-for="g in A.menu" :key="g.label" class="p-2">
            <p class="h-8 px-2 text-xs font-medium leading-8 text-sidebar-foreground/70">{{ g.label }}</p>
            <button v-for="it in g.items" :key="it[0]" type="button" @click="pick(it[0])" :aria-current="active === it[0] ? 'page' : undefined"
              :class="['flex h-8 w-full items-center gap-2 rounded-md px-2 text-left text-sm', active === it[0] ? 'bg-sidebar-accent font-medium text-sidebar-accent-foreground' : 'hover:bg-sidebar-accent/60']">
              <Icon :name="it[2]" :size="16"/><span class="truncate">{{ it[1] }}</span></button>
          </div>
        </nav></aside></transition></div>` };

const Empty = { props: { icon: { type: String, default: 'Inbox' }, title: String, description: String }, components: { Icon },
  template: `<div class="flex flex-col items-center justify-center py-16 text-center"><div class="grid h-16 w-16 place-items-center rounded-full bg-muted"><Icon :name="icon" :size="28" class="text-muted-foreground"/></div>
    <p class="mt-4 text-base font-semibold">{{ title }}</p><p v-if="description" class="mt-1 max-w-xs text-sm text-muted-foreground">{{ description }}</p></div>` };

const Loading = { props: { message: String }, template: `<div class="space-y-2" role="status"><div v-for="i in 3" :key="i" class="skel h-28 rounded-xl"></div><p class="py-2 text-center text-xs text-muted-foreground">{{ message }}</p></div>` };

const Segmented = { props: { modelValue: String, tabs: Array },
  template: `<div class="rounded-2xl bg-muted/60 p-1.5"><div class="grid gap-1" :style="{ gridTemplateColumns: 'repeat(' + tabs.length + ', minmax(0, 1fr))' }">
    <button v-for="t in tabs" :key="t.id" type="button" @click="$emit('update:modelValue', t.id)" :class="['inline-flex h-9 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl px-3 text-sm font-semibold transition-all active:scale-[0.97]', modelValue === t.id ? 'bg-background text-foreground shadow-sm' : 'text-muted-foreground']">
      <span class="truncate">{{ t.label }}</span><span v-if="t.count" :class="['grid h-5 min-w-5 place-items-center rounded-full px-1 text-[10px] font-bold', modelValue === t.id ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ t.count }}</span></button></div></div>` };

const DetailCard = { props: { icon: String, title: String, variant: { type: String, default: 'primary' } }, components: { Icon },
  setup(p) { const v = { primary: ['bg-primary/10', 'text-primary'], muted: ['bg-muted', 'text-muted-foreground'], success: ['bg-green-500/10', 'text-green-600'], warning: ['bg-amber-500/10', 'text-amber-600'] }[p.variant]; return { v }; },
  template: `<section class="gap-2 overflow-hidden rounded-xl border border-border bg-card py-3 shadow-sm"><div class="flex items-center gap-2 px-4"><div :class="['rounded-lg p-1', v[0]]"><Icon :name="icon" :size="14" :class="v[1]"/></div><h3 class="text-sm font-semibold">{{ title }}</h3></div><div class="px-4 pt-2"><slot/></div></section>` };

const Field = { props: { label: String, value: String, mono: Boolean, full: Boolean },
  template: `<div :class="full ? 'col-span-2' : ''"><p class="text-[11px] text-muted-foreground">{{ label }}</p><slot><p :class="['text-sm font-medium', mono ? 'font-mono text-xs' : '']">{{ value }}</p></slot></div>` };

const Shell = { components: { Header, Sidebar, Icon }, props: { title: String, showBack: Boolean, fab: String }, setup() { return { S, go }; },
  template: `<div class="relative flex h-full w-full flex-col overflow-hidden bg-background"><Header :title="title" :show-back="showBack"/>
    <main class="scroll min-h-0 flex-1 overflow-y-auto" :style="$slots.footer ? '' : 'padding-bottom:calc(1rem + var(--sa-bottom))'"><slot/></main>
    <div v-if="$slots.footer" class="shrink-0 border-t border-border bg-background px-3 pt-3" style="padding-bottom:calc(.75rem + var(--sa-bottom))"><slot name="footer"/></div>
    <button v-if="fab" type="button" class="absolute right-4 z-30 grid h-14 w-14 place-items-center rounded-full bg-primary text-primary-foreground shadow-lg active:opacity-80" style="bottom:calc(1.5rem + var(--sa-bottom))" :aria-label="fab" @click="go('create')"><Icon name="Plus" :size="24"/></button>
    <Sidebar/></div>` };

/* ------------------------------------------------------------ screens */
const Dashboard = { components: { Shell, Icon, Segmented, Empty },
  setup() {
    const tabs = [{ id: 'today', label: 'Today' }, { id: 'week', label: 'This week' }, { id: 'month', label: 'This month' }];
    const k = { today: [['Sales', 'TZS 418,500', 12, 'ShoppingCart', 'bg-blue-500/10', 'text-blue-600'], ['Collected', 'TZS 296,000', -4, 'Wallet', 'bg-green-500/10', 'text-green-600'], ['Outstanding balance', 'TZS 1,284,500', null, 'CircleAlert', 'bg-amber-500/10', 'text-amber-600']],
      week: [['Sales', 'TZS 2,964,000', 8, 'ShoppingCart', 'bg-blue-500/10', 'text-blue-600'], ['Collected', 'TZS 2,141,000', 5, 'Wallet', 'bg-green-500/10', 'text-green-600'], ['Outstanding balance', 'TZS 1,284,500', null, 'CircleAlert', 'bg-amber-500/10', 'text-amber-600']],
      month: [['Sales', 'TZS 11,870,000', 21, 'ShoppingCart', 'bg-blue-500/10', 'text-blue-600'], ['Collected', 'TZS 9,420,500', 17, 'Wallet', 'bg-green-500/10', 'text-green-600'], ['Outstanding balance', 'TZS 1,284,500', null, 'CircleAlert', 'bg-amber-500/10', 'text-amber-600']] };
    const cards = computed(() => S.app === 'jumla' ? k.week : k[S.period]);
    return { S, A, tabs, cards, ORDERS, STATUS_CLS, go, loading: computed(() => S.list === 'loading'), err: computed(() => S.list === 'error'), TZS };
  },
  template: `<Shell title="Dashboard"><div class="space-y-4 p-4">
    <div v-if="S.app === 'agrovet'" class="flex items-center justify-between gap-2"><h2 class="truncate text-lg font-bold">Welcome back, {{ A.user.first }}</h2>
      <button type="button" class="flex shrink-0 items-center gap-1.5 rounded-xl border border-input bg-muted/40 px-3 py-1.5 text-xs active:bg-muted"><Icon name="RefreshCw" :size="14" class="text-muted-foreground"/>Refresh</button></div>
    <div v-else><h2 class="text-lg font-bold">Hello, {{ A.user.first }}</h2><p class="text-sm text-muted-foreground">{{ A.user.ward }}</p></div>
    <div v-if="err" class="flex items-center justify-between rounded-lg border border-destructive/20 bg-destructive/10 p-3 text-sm text-destructive"><span>Could not load the dashboard.</span><button class="ml-2 flex shrink-0 items-center gap-1 text-xs font-medium underline" @click="S.list = 'data'"><Icon name="RefreshCw" :size="12"/>Retry</button></div>
    <Segmented v-if="A.period" v-model="S.period" :tabs="tabs"/>
    <div class="grid grid-cols-2 gap-3">
      <template v-if="loading"><div class="skel h-24 rounded-xl"></div><div class="skel h-24 rounded-xl"></div><div class="skel col-span-2 h-24 rounded-xl"></div></template>
      <template v-else><div v-for="(c, i) in cards" :key="c[0]" :class="['rounded-xl bg-card p-4 shadow-sm', i === 2 ? 'col-span-2' : '']"><div class="flex items-start justify-between"><div class="min-w-0 flex-1">

const Device = { components: { Shell }, setup() { return { rows: [['Model', 'Infinix X6711'], ['Android', '14 (API 34)'], ['App version', '1.4.2 (42)'], ['Screen', '411 × 891 dp'], ['Network', 'Wi-Fi']] }; },
  template: `<Shell title="Device Info" show-back><div class="p-4"><div class="space-y-2 rounded-xl border border-border bg-card p-4 text-sm"><div v-for="r in rows" :key="r[0]" class="flex justify-between gap-2"><span class="text-muted-foreground">{{ r[0] }}</span><span>{{ r[1] }}</span></div></div></div></Shell>` };
const Placeholder = { components: { Shell, Empty }, props: { name: String }, setup() { return { A }; }, template: `<Shell :title="name"><Empty icon="Construction" title="Not drawn in this prototype" description="This menu entry exists in the app. Dashboard, lists, detail, notifications, profile and theme are drawn here."/></Shell>` };
const Login = { components: { Icon }, setup() { return { A, S, ok() { swap('dashboard'); } }; },
  template: `<div class="flex h-full flex-col justify-center bg-background px-6" style="padding-top:var(--sa-top);padding-bottom:var(--sa-bottom)"><div class="mb-8 text-center"><div class="mx-auto mb-3 grid h-16 w-16 place-items-center rounded-2xl bg-primary text-primary-foreground"><Icon name="Sprout" :size="30"/></div><h1 class="text-xl font-bold">{{ A.name }}</h1><p class="mt-1 text-sm text-muted-foreground">Sign in to continue</p></div>
    <form class="space-y-3" @submit.prevent="ok"><label class="block text-sm font-medium">Username<input class="mt-1 h-10 w-full rounded-xl border border-input bg-transparent px-3 text-base shadow-sm outline-none focus:ring-2 focus:ring-ring" :value="A.user.username" autocomplete="username"></label>
      <label class="block text-sm font-medium">Password<input type="password" class="mt-1 h-10 w-full rounded-xl border border-input bg-transparent px-3 text-base shadow-sm outline-none focus:ring-2 focus:ring-ring" value="password" autocomplete="current-password"></label>
      <button class="mt-2 h-11 w-full rounded-xl bg-primary text-sm font-medium text-primary-foreground shadow active:opacity-90">Sign in</button><button type="button" class="w-full text-center text-sm text-muted-foreground underline">Forgot password?</button></form></div>` };

const View = { components: { Dashboard, Orders, Customers, Notifications, OrderDetail, Profile, ThemePage, Device, Placeholder, Login },
  setup() { const label = computed(() => { if (S.route === 'create') return A.value.fab; for (const g of A.value.menu) for (const i of g.items) if (i[0] === S.route) return i[1]; return S.route; }); return { S, label }; },
  template: `<Login v-if="S.route === 'login'"/><Dashboard v-else-if="S.route === 'dashboard'"/><Orders v-else-if="S.route === 'orders'"/><Customers v-else-if="S.route === 'customers'"/>
    <Notifications v-else-if="S.route === 'notifications'"/><OrderDetail v-else-if="S.route === 'order'"/><Profile v-else-if="S.route === 'profile'"/><ThemePage v-else-if="S.route === 'theme'"/><Device v-else-if="S.route === 'device'"/><Placeholder v-else :name="label"/>` };

/* ------------------------------------------------------------ the phone and the picker (prototype only) */
const Picker = { components: { Icon },
  setup() {
    const screens = [['login', 'Sign in', 'LogIn'], ['dashboard', 'Dashboard', 'LayoutDashboard'], ['orders', 'List: orders / sales', 'ShoppingBasket'], ['customers', 'List: customers', 'Users'], ['order', 'Detail page', 'Receipt'], ['notifications', 'Notifications (Jumla)', 'Bell'], ['profile', 'Profile', 'User'], ['theme', 'Settings: theme (Agrovet)', 'Sun'], ['device', 'Settings: device info', 'Smartphone']];
    const states = [['data', 'Data'], ['loading', 'Loading'], ['empty', 'Empty'], ['error', 'Error']];
    const pick = (r) => { S.stack = []; S.drawer = false; S.filter = false; S.route = r; if (r === 'notifications' && S.app === 'agrovet') S.app = 'jumla'; };
    const sidebar = () => { S.route = S.route === 'login' ? 'dashboard' : S.route; S.drawer = true; };
    const filter = () => { S.route = 'orders'; S.drawer = false; S.filter = true; };
    return { S, screens, states, pick, sidebar, filter, APPS, go };
  },
  template: `<div class="space-y-5 text-sm">
    <div><p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wider opacity-60">App</p><div class="grid grid-cols-2 gap-1 rounded-lg bg-[oklch(var(--canvas))] p-1 ring-1 ring-black/10">
      <button v-for="(a, k) in APPS" :key="k" type="button" @click="S.app = k; if (k === 'agrovet' && S.route === 'notifications') S.route = 'dashboard'" :class="['h-8 rounded-md text-xs font-medium', S.app === k ? 'bg-white text-black shadow dark:bg-neutral-700 dark:text-white' : 'opacity-60']">{{ a.short }}</button></div></div>
    <div><p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wider opacity-60">Theme</p><div class="grid grid-cols-2 gap-1 rounded-lg bg-[oklch(var(--canvas))] p-1 ring-1 ring-black/10">
      <button type="button" @click="S.dark = false; S.themeMode = 'light'" :class="['h-8 rounded-md text-xs font-medium', !S.dark ? 'bg-white text-black shadow' : 'opacity-60']">Light</button><button type="button" @click="S.dark = true; S.themeMode = 'dark'" :class="['h-8 rounded-md text-xs font-medium', S.dark ? 'bg-neutral-700 text-white shadow' : 'opacity-60']">Dark</button></div></div>
    <div><p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wider opacity-60">Screens</p><div class="grid gap-0.5">
      <button v-for="s in screens" :key="s[0]" type="button" @click="pick(s[0])" :class="['flex h-9 items-center gap-2 rounded-md px-2 text-left', S.route === s[0] ? 'bg-black/10 font-medium dark:bg-white/15' : 'hover:bg-black/5 dark:hover:bg-white/10']"><Icon :name="s[2]" :size="15" class="opacity-60"/>{{ s[1] }}</button>
      <button type="button" @click="sidebar" class="flex h-9 items-center gap-2 rounded-md px-2 text-left hover:bg-black/5 dark:hover:bg-white/10"><Icon name="PanelLeft" :size="15" class="opacity-60"/>Sidebar open</button>
      <button type="button" @click="filter" class="flex h-9 items-center gap-2 rounded-md px-2 text-left hover:bg-black/5 dark:hover:bg-white/10"><Icon name="SlidersHorizontal" :size="15" class="opacity-60"/>Filter sheet open</button></div></div>
    <div><p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wider opacity-60">List and dashboard state</p><div class="grid grid-cols-4 gap-1 rounded-lg bg-[oklch(var(--canvas))] p-1 ring-1 ring-black/10">
      <button v-for="s in states" :key="s[0]" type="button" @click="S.list = s[0]; if (S.route !== 'orders' && S.route !== 'dashboard') S.route = 'orders'" :class="['h-8 rounded-md text-[11px] font-medium', S.list === s[0] ? 'bg-white text-black shadow dark:bg-neutral-700 dark:text-white' : 'opacity-60']">{{ s[1] }}</button></div></div></div>` };

const Root = { components: { View, FilterSheet, Picker, Icon },
  setup() {
    const scale = ref(1), narrow = ref(false), menu = ref(false);
    const fit = () => { narrow.value = innerWidth < 900; scale.value = narrow.value ? 1 : Math.min(1, (innerHeight - 32) / 844); };
    onMounted(() => { fit(); addEventListener('resize', fit); });
    onBeforeUnmount(() => removeEventListener('resize', fit));
    const clock = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    watch(() => S.dark, (d) => { document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); }, { immediate: true });
    return { S, scale, narrow, menu, clock };
  },
  template: `<div :class="narrow ? '' : 'flex min-h-screen items-center justify-center gap-10 p-4'" :style="narrow ? 'height:100dvh' : ''">
    <aside v-if="!narrow" class="w-64 shrink-0 rounded-2xl bg-[oklch(var(--canvas))] p-4 text-[oklch(0.3_0.02_264)] ring-1 ring-black/10 dark:text-neutral-200 dark:ring-white/10"><h1 class="mb-1 text-base font-semibold">Agrovet and Jumla</h1><p class="mb-5 text-xs opacity-70">Their phone UI as a clickable prototype: the shell, the lists, the filter sheet, detail pages and the profile.</p><Picker/></aside>
    <div :style="narrow ? '' : { width: (390 * scale) + 'px', height: (844 * scale) + 'px' }" :class="narrow ? 'h-full w-full' : 'shrink-0'">
      <div :class="narrow ? 'h-full w-full' : 'origin-top-left'" :style="narrow ? '' : { transform: 'scale(' + scale + ')', width: '390px', height: '844px' }">
        <div :class="['app relative overflow-hidden', S.dark ? 'dark' : '', narrow ? 'h-full w-full' : 'h-[844px] w-[390px] rounded-[44px] border-[10px] border-[#18181b] shadow-2xl ring-1 ring-black/10']">
          <div v-if="!narrow" class="pointer-events-none absolute inset-x-0 top-0 z-[100] flex h-[30px] items-center justify-between px-7 text-[12px] font-semibold"><span>{{ clock }}</span><span class="absolute left-1/2 top-1.5 h-5 w-20 -translate-x-1/2 rounded-full bg-[#18181b]"></span><span class="flex items-center gap-1"><Icon name="Signal" :size="12"/><Icon name="Wifi" :size="12"/><Icon name="BatteryFull" :size="14"/></span></div>
          <View/><FilterSheet/></div></div></div>
    <template v-if="narrow && !S.filter && !S.drawer"><button type="button" class="fixed bottom-4 left-4 z-[200] flex items-center gap-2 rounded-full border bg-white px-3 py-2 text-xs font-medium text-black shadow-lg" style="margin-bottom:env(safe-area-inset-bottom,0px)" @click="menu = !menu"><Icon name="Map" :size="14"/>Screens</button>
      <div v-if="menu" class="fixed inset-x-3 bottom-16 z-[200] max-h-[70dvh] overflow-y-auto rounded-2xl bg-white p-4 text-black shadow-2xl"><Picker/></div></template></div>`
};

createApp(Root).mount('#root');
</script>
