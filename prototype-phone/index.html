<title>DevBiz Phone</title>
<meta name="description" content="DevBiz drawn for a phone only: its own shell, bottom bar, cards and sheets. Clickable.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* Layout concept: one 390 x 844 phone (the only layout there is) beside a prototype picker on a desktop, the app alone on a phone.
   Tokens are DevBiz's own (blue accent, D13), kept in HSL channels; the sizes are the phone kit's (see the Design system screen). */
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] },
    colors: ['background','foreground','card','muted','muted-foreground','border','input','primary','primary-foreground','destructive','warning','success','canvas','ring']
      .reduce((o, k) => (o[k] = 'hsl(var(--' + k + ') / <alpha-value>)', o), {}),
    borderRadius: { xl: '14px', '2xl': '18px' }
  } }
};
</script>
<style>
:root { --canvas: 220 14% 96%; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --canvas: 240 10% 5%; color-scheme: dark; } }
:root[data-theme="dark"] { --canvas: 240 10% 5%; color-scheme: dark; }
body { margin: 0; background: hsl(var(--canvas)); font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.app { --sa-top: 30px; --sa-bottom: 14px; --kbd: 0px;
  --background: 0 0% 100%; --foreground: 240 10% 3.9%; --card: 0 0% 100%; --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 42%;
  --border: 240 5.9% 90%; --input: 240 5.9% 86%; --primary: 221 83% 45%; --primary-foreground: 0 0% 98%; --ring: 221 83% 45%;
  --destructive: 0 72% 48%; --warning: 32 92% 38%; --success: 152 64% 28%;
  --c1: #14937f; --c2: #d06d0a; --c3: #2f6fe0; --c4: #d6456a; --c5: #7c5ad8; --c-other: #94a3b8;
  background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 15px; line-height: 1.4; }
.app.dark { --background: 240 10% 3.9%; --foreground: 0 0% 96%; --card: 240 6% 8.5%; --muted: 240 3.7% 14%; --muted-foreground: 240 5% 64.9%;
  --border: 240 3.7% 17%; --input: 240 3.7% 20%; --primary: 217 91% 64%; --primary-foreground: 222 47% 8%; --ring: 217 91% 64%;
  --destructive: 0 70% 58%; --warning: 38 92% 56%; --success: 152 52% 52%;
  --c1: #1f9e89; --c2: #c97514; --c3: #4c82e8; --c4: #dc5577; --c5: #8f73e3; --c-other: #64748b; }
.app *, .app *::before, .app *::after { border-color: hsl(var(--border)); box-sizing: border-box; }
.app button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.app input { font: inherit; color: inherit; }
.scroll { scrollbar-width: none; overscroll-behavior: contain; } .scroll::-webkit-scrollbar { display: none; }
.tnum { font-variant-numeric: tabular-nums; }
.press { transition: transform .12s ease, background-color .12s ease; } .press:active { transform: scale(.98); }
.sheet-enter-active, .sheet-leave-active { transition: transform .28s cubic-bezier(.2,.8,.2,1); } .sheet-enter-from, .sheet-leave-to { transform: translateY(100%); }
.fade-enter-active, .fade-leave-active { transition: opacity .2s ease; } .fade-enter-from, .fade-leave-to { opacity: 0; }
.drawer-enter-active, .drawer-leave-active { transition: transform .26s cubic-bezier(.2,.8,.2,1); } .drawer-enter-from, .drawer-leave-to { transform: translateX(-100%); }
.pop-enter-active, .pop-leave-active { transition: opacity .18s ease, transform .18s ease; } .pop-enter-from, .pop-leave-to { opacity: 0; transform: translateY(8px) scale(.98); }
.rise { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; } @keyframes rise { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulse2 { 50% { opacity: .5; } } .skel { animation: pulse2 1.6s ease-in-out infinite; background: hsl(var(--muted)); }
@media (prefers-reduced-motion: reduce) { .rise, .skel { animation: none; } .sheet-enter-active, .sheet-leave-active, .drawer-enter-active, .drawer-leave-active, .pop-enter-active, .pop-leave-active { transition: none; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<div id="root"></div>
<script>
const { createApp, reactive, ref, computed, h, watch, onMounted, onBeforeUnmount, nextTick } = Vue;

/* ============================================================ atoms and the shop's data */
const Icon = { name: 'Icon', props: { name: String, size: { type: [Number, String], default: 18 } },
  setup(p) { return () => { const n = window.lucide && window.lucide.icons && window.lucide.icons[p.name]; const kids = n ? (n[0] === 'svg' ? n[2] : n) : [];
    return h('svg', { xmlns: 'http://www.w3.org/2000/svg', width: p.size, height: p.size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', class: 'shrink-0' }, kids.map(([t, a]) => h(t, a))); }; } };

const money = (n) => 'TZS ' + Math.round(n).toLocaleString('en-US');
const num = (n) => Math.round(n).toLocaleString('en-US');
const tint = (c, a) => ({ background: 'color-mix(in srgb, ' + c + ' ' + (a || 15) + '%, transparent)' });

/* ---- the shop (Office Shop): two people, two real products and a few more so lists have a shape */
const PRODUCTS = [
  { id: 'p1', name: 'Water', ini: 'WA', c: 'var(--c3)', price: 1000, step: 1, unit: 'bottle', units: 'bottles', stock: 91, reorder: 12, pack: 'Pack of 6' },
  { id: 'p2', name: 'Trident', ini: 'TR', c: 'var(--c5)', price: 250, step: 2, unit: 'piece', units: 'pieces', stock: 4, reorder: 20, pack: 'Box of 14' },
  { id: 'p3', name: 'Soda 500 ml', ini: 'SO', c: 'var(--c4)', price: 700, step: 1, unit: 'bottle', units: 'bottles', stock: 48, reorder: 12, pack: 'Crate of 24' },
  { id: 'p4', name: 'Biscuits', ini: 'BI', c: 'var(--c2)', price: 500, step: 1, unit: 'pack', units: 'packs', stock: 30, reorder: 10, pack: 'Carton of 20' },
  { id: 'p5', name: 'Sugar 1 kg', ini: 'SU', c: 'var(--c1)', price: 3200, step: 1, unit: 'bag', units: 'bags', stock: 0, reorder: 6, pack: 'Sack of 20' },
  { id: 'p6', name: 'Matches', ini: 'MA', c: 'var(--c-other)', price: 200, step: 1, unit: 'box', units: 'boxes', stock: 120, reorder: 30, pack: 'Dozen' }
];
const prod = (id) => PRODUCTS.find(p => p.id === id);
const perText = (p) => 'TZS ' + num(p.price * p.step) + (p.step > 1 ? ' per ' + p.step : '');
const level = (p) => p.stock <= 0 ? 'out' : p.stock <= p.reorder ? 'low' : 'ok';
const stockText = (p) => p.stock <= 0 ? 'Out of stock' : p.stock + ' ' + (p.stock === 1 ? p.unit : p.units) + ' left';

const CUSTOMERS = [
  { id: 'c0', no: 'C-0000', name: 'Walk-in customer', ini: '', c: 'var(--c-other)', phone: '', owes: 0, days: 0, limit: 0, bought: 0, walkin: true },
  { id: 'c1', no: 'C-0001', name: 'Neema Kimaro', ini: 'NK', c: 'var(--c1)', phone: '+255 754 112 908', owes: 2000, days: 13, limit: 10000, bought: 6000, paid: 4000, since: '30 Aug 2026', last: '19 Sept 2026' },
  { id: 'c2', no: 'C-0002', name: 'Baraka Mushi', ini: 'BM', c: 'var(--c2)', phone: '+255 713 440 218', owes: 0, days: 0, limit: 20000, bought: 18500, paid: 18500, since: '2 Sept 2026', last: '8 Oct 2026' },
  { id: 'c3', no: 'C-0003', name: 'Joseph Kweka', ini: 'JK', c: 'var(--c3)', phone: '', owes: 4500, days: 21, limit: 5000, bought: 9000, paid: 4500, since: '4 Sept 2026', last: '2 Oct 2026' },
  { id: 'c9', no: 'C-0009', name: 'Peter Ngowi', ini: 'PN', c: 'var(--c4)', phone: '', owes: 8000, days: 42, limit: 8000, bought: 15000, paid: 7000, since: '1 Sept 2026', last: '28 Aug 2026' },
  { id: 'c5', no: 'C-0005', name: 'Pendo Lyimo', ini: 'PL', c: 'var(--c5)', phone: '+255 689 001 244', owes: -5000, days: 0, limit: 0, bought: 3000, paid: 8000, since: '9 Sept 2026', last: '5 Oct 2026' },
  { id: 'c23', no: 'C-0023', name: 'Mary Tarimo', ini: 'MT', c: 'var(--c1)', phone: '+255 754 990 041', owes: 8000, days: 17, limit: 10000, bought: 22000, paid: 14000, since: '12 Sept 2026', last: '6 Oct 2026' },
  { id: 'c21', no: 'C-0021', name: 'Brian Urassa', ini: 'BU', c: 'var(--c2)', phone: '', owes: 5000, days: 11, limit: 6000, bought: 11000, paid: 6000, since: '14 Sept 2026', last: '1 Oct 2026' },
  { id: 'c4', no: 'C-0004', name: 'Hellen Massawe', ini: 'HM', c: 'var(--c3)', phone: '+255 765 230 117', owes: 0, days: 0, limit: 10000, bought: 7500, paid: 7500, since: '6 Sept 2026', last: '9 Oct 2026' }
];
const cust = (id) => CUSTOMERS.find(c => c.id === id);

const SALES = [
  { id: 'S-1304', c: 'c23', day: 'Today', time: '10:37', lines: [['p1', 1]], pay: 'unpaid', method: 'Credit', by: 'Rehema' },
  { id: 'S-1303', c: 'c0', day: 'Today', time: '10:25', lines: [['p2', 2]], pay: 'paid', method: 'Cash', by: 'Rehema' },
  { id: 'S-1302', c: 'c3', day: 'Today', time: '10:11', lines: [['p2', 2]], pay: 'paid', method: 'M-Pesa', by: 'Rehema' },
  { id: 'S-1301', c: 'c21', day: 'Today', time: '09:58', lines: [['p1', 1]], pay: 'unpaid', method: 'Credit', by: 'Rehema' },
  { id: 'S-1299', c: 'c1', day: 'Today', time: '09:23', lines: [['p1', 1]], pay: 'unpaid', method: 'Credit', by: 'Rehema' },
  { id: 'S-1297', c: 'c0', day: 'Today', time: '08:54', lines: [['p1', 1], ['p4', 1]], pay: 'paid', method: 'Cash', by: 'Rehema', undo: true },
  { id: 'S-1290', c: 'c9', day: 'Yesterday', time: '11:09', lines: [['p1', 1]], pay: 'unpaid', method: 'Credit', by: 'Rehema', undoAsked: true },
  { id: 'S-1288', c: 'c23', day: 'Yesterday', time: '10:04', lines: [['p1', 1], ['p3', 2]], pay: 'part', method: 'Credit', by: 'Amina', paid: 1000 },
  { id: 'S-1287', c: 'c2', day: 'Yesterday', time: '08:14', lines: [['p2', 4]], pay: 'paid', method: 'Cash', by: 'Amina' }
];
const saleTotal = (s) => s.lines.reduce((t, l) => t + prod(l[0]).price * l[1], 0);
const saleLine = (l) => (prod(l[0]).name + ' × ' + l[1]);

const NOTIFS = [
  { id: 1, unread: true, icon: 'Undo2', tone: 'warning', title: 'Rehema asks to undo S-1290', body: 'Wrong customer: was Baraka, not Steve. Stock and balances change only after you approve.', when: '10 min ago', open: 'S-1290', chan: ['In app', 'SMS sent'] },
  { id: 2, unread: true, icon: 'PackageMinus', tone: 'warning', title: 'Trident is low', body: '4 pieces left, you want 20. Receive a delivery or change the warning level.', when: '1 h ago', open: 'Product', chan: ['In app'] },
  { id: 3, unread: true, icon: 'ClipboardCheck', tone: 'warning', title: 'Count for 9 Oct has gaps', body: 'Drawer 500 short, one Trident pack missing. Rehema is waiting for you to approve it.', when: 'Yesterday', open: 'Count', chan: ['In app', 'SMS held (quiet hours)'] },
  { id: 4, unread: false, icon: 'Wallet', tone: 'success', title: 'Payment P-0052 received', body: 'TZS 3,000 from Neema Kimaro, paid into the cash drawer.', when: '19 Sept', open: 'P-0052', chan: ['In app'] },
  { id: 5, unread: false, icon: 'Truck', tone: 'muted', title: 'Delivery DEL-0008 is 3 days late', body: 'Kariakoo wholesaler: TZS 4,420 was due 7 Oct 2026.', when: '10 Oct', open: 'DEL-0008', chan: ['In app', 'Email sent'] }
];
const WAITING = [
  { id: 'w1', icon: 'Undo2', title: 'Undo S-1290 · Peter Ngowi', sub: 'Rehema: "Wrong customer: was Baraka, not Steve"', kind: 'Undo a sale' },
  { id: 'w2', icon: 'Undo2', title: 'Undo S-1297 · Nancy Temu', sub: 'Rehema: "Customer changed their mind"', kind: 'Undo a sale' },
  { id: 'w3', icon: 'FilePen', title: 'Change P-0087 · Eliza Mollel', sub: 'Rehema: "Typed 6,000, customer paid 5,000"', kind: 'Change a payment' },
  { id: 'w4', icon: 'Receipt', title: 'EXP-0035 · Transport TZS 5,000', sub: 'Water crates from the depot · Cash drawer', kind: 'Expense' },
  { id: 'w5', icon: 'ClipboardCheck', title: 'Count for 9 Oct has gaps', sub: 'Drawer 500 short, one Trident pack missing', kind: 'Count gap' }
];

/* ---- the one store */
const S = reactive({
  dark: false, themeMode: 'light', role: 'owner', route: 'home', stack: [], drawer: false, sheet: null, dialog: null, toast: '', toastKey: 0,
  cart: [], customer: 'c0', pay: 'cash', part: false, account: 'Cash drawer', cartOpen: false, receipt: null, tillQ: '',
  salesTab: 'all', salesQ: '', salesFilter: { status: 'all', range: 'all', who: 'all' }, shown: 6, list: 'data',
  custQ: '', custTab: 'all', cid: 'c1', custPane: 'overview', saleId: 'S-1304',
  notifTab: 'unread', expanded: null, lock: true, lockAfter: '5 min', checking: false, upToDate: false, search: false, searchQ: '', recent: ['Water', 'Neema', 'S-1290'],
  waitingDone: []
});
const ME = computed(() => S.role === 'owner' ? { name: 'Amina', full: 'Amina Mushi', ini: 'AM', role: 'Owner', email: 'amina@devbiz.app' } : { name: 'Rehema', full: 'Rehema Kileo', ini: 'RK', role: 'Cashier', email: 'rehema@devbiz.app' });
const unread = computed(() => NOTIFS.filter(n => n.unread).length);
const waitingN = computed(() => WAITING.length - S.waitingDone.length);

let toastT;
function toast(msg) { S.toast = msg; S.toastKey++; clearTimeout(toastT); toastT = setTimeout(() => (S.toast = ''), 2400); }
const TABS = ['home', 'sales', 'customers', 'alerts'];
function tab(r) { S.stack = []; S.drawer = false; S.sheet = null; S.search = false; S.route = r; }
function go(r, arg) { S.drawer = false; S.sheet = null; S.search = false; S.stack.push(S.route); if (r === 'sale' && arg) S.saleId = arg; if (r === 'customer' && arg) { S.cid = arg; S.custPane = 'overview'; } S.route = r; }
function back() {
  if (S.dialog) { S.dialog = null; return; } if (S.sheet) { S.sheet = null; return; } if (S.drawer) { S.drawer = false; return; } if (S.search) { S.search = false; return; }
  if (S.cartOpen) { S.cartOpen = false; return; }
  S.route = S.stack.pop() || 'home';
}

/* ============================================================ small pieces */
const TONE = { success: 'bg-success/15 text-success', warning: 'bg-warning/15 text-warning', destructive: 'bg-destructive/10 text-destructive', muted: 'bg-muted text-muted-foreground', primary: 'bg-primary/10 text-primary' };
const Pill = { props: { tone: { type: String, default: 'muted' }, dot: Boolean }, setup() { return { TONE }; },
  template: `<span :class="['inline-flex h-6 shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 text-[12px] font-medium', TONE[tone]]"><span v-if="dot" class="h-1.5 w-1.5 rounded-full bg-current"></span><slot/></span>` };

const Av = { props: { c: Object, size: { type: Number, default: 40 } }, components: { Icon },
  template: `<span class="grid shrink-0 place-items-center rounded-full font-semibold text-white" :style="{ width: size + 'px', height: size + 'px', background: c.c, fontSize: Math.round(size * .36) + 'px' }"><Icon v-if="c.walkin" name="User" :size="Math.round(size * .5)"/><template v-else>{{ c.ini }}</template></span>` };

const Tile = { props: { p: Object, size: { type: Number, default: 40 } },
  template: `<span class="grid shrink-0 place-items-center rounded-xl text-[13px] font-semibold" :style="{ width: size + 'px', height: size + 'px', background: 'color-mix(in srgb, ' + p.c + ' 16%, transparent)', color: p.c }">{{ p.ini }}</span>` };

const AgeChip = { props: { days: Number }, components: { Pill },
  template: `<Pill v-if="days > 0" :tone="days > 30 ? 'destructive' : days > 7 ? 'warning' : 'muted'">{{ days > 7 ? days + ' days' : 'This week' }}</Pill>` };
const SaleStatus = { props: { s: String }, components: { Pill },
  template: `<Pill :tone="s === 'paid' ? 'success' : s === 'part' ? 'warning' : s === 'undone' ? 'muted' : 'destructive'">{{ { paid: 'Paid', part: 'Part paid', unpaid: 'Unpaid', undone: 'Undone' }[s] }}</Pill>` };
const LevelBadge = { props: { p: Object }, components: { Pill },
  setup(pr) { return { lv: computed(() => level(pr.p)) }; },
  template: `<Pill :tone="lv === 'out' ? 'destructive' : lv === 'low' ? 'warning' : 'success'" dot>{{ lv === 'out' ? 'Out' : lv === 'low' ? 'Low' : 'In stock' }}</Pill>` };
const Balance = { props: { b: Number, big: Boolean }, setup() { return { money }; },
  template: `<div class="text-right leading-tight"><p :class="['font-semibold tnum', big ? 'text-[22px]' : 'text-[16px]']">{{ b === 0 ? 'Settled' : money(Math.abs(b)) }}</p>
    <p :class="['text-[12px]', b > 0 ? 'text-warning' : b < 0 ? 'text-success' : 'text-muted-foreground']">{{ b > 0 ? 'Owes you' : b < 0 ? 'Prepaid' : '' }}</p></div>` };

const Seg = { props: { modelValue: String, tabs: Array },
  template: `<div class="grid gap-1 rounded-2xl bg-muted p-1" :style="{ gridTemplateColumns: 'repeat(' + tabs.length + ', minmax(0, 1fr))' }" role="tablist">
    <button v-for="t in tabs" :key="t.id" type="button" role="tab" :aria-selected="modelValue === t.id" @click="$emit('update:modelValue', t.id)" :class="['press flex h-10 items-center justify-center gap-1.5 rounded-xl px-2 text-[14px] font-semibold', modelValue === t.id ? 'bg-background shadow-sm' : 'text-muted-foreground']">
      <span class="truncate">{{ t.label }}</span><span v-if="t.count" :class="['grid h-5 min-w-5 place-items-center rounded-full px-1 text-[11px] font-bold', modelValue === t.id ? 'bg-primary text-primary-foreground' : 'bg-background text-muted-foreground']">{{ t.count }}</span></button></div>` };

const Empty = { props: { icon: { type: String, default: 'Inbox' }, title: String, text: String }, components: { Icon },
  template: `<div class="flex flex-col items-center px-8 py-14 text-center"><span class="grid h-16 w-16 place-items-center rounded-full bg-muted"><Icon :name="icon" :size="28" class="text-muted-foreground"/></span>
    <p class="mt-4 text-[17px] font-semibold">{{ title }}</p><p v-if="text" class="mt-1 text-[14px] text-muted-foreground">{{ text }}</p><slot/></div>` };

const Btn = { props: { v: { type: String, default: 'primary' }, size: { type: String, default: 'lg' }, disabled: Boolean, full: Boolean },
  setup(p) { const cls = computed(() => [{ primary: 'bg-primary text-primary-foreground', outline: 'border border-input bg-background', ghost: '', destructive: 'bg-destructive text-white', 'destructive-outline': 'border border-destructive/40 text-destructive bg-background', soft: 'bg-primary/10 text-primary' }[p.v], p.size === 'lg' ? 'h-12 px-5 text-[15px]' : 'h-11 px-4 text-[14px]', p.full ? 'w-full' : '', p.disabled ? 'opacity-45 pointer-events-none' : '']); return { cls }; },
  template: `<button type="button" :disabled="disabled" :class="['press inline-flex items-center justify-center gap-2 rounded-xl font-semibold', cls]"><slot/></button>` };

/* ============================================================ the shell: header, bottom bar, drawer */
const Header = { props: { title: String, pushed: Boolean, hideSearch: Boolean }, components: { Icon },
  setup() { return { S, back, ME }; },
  template: `<header class="relative z-20 flex shrink-0 items-center gap-1 border-b bg-background px-2" :style="{ paddingTop: 'var(--sa-top)', height: 'calc(56px + var(--sa-top))' }">
    <button v-if="!pushed" type="button" class="press grid h-11 w-11 place-items-center rounded-full" aria-label="Open menu" @click="S.drawer = true"><Icon name="Menu" :size="22"/></button>
    <button v-else type="button" class="press grid h-11 w-11 place-items-center rounded-full" aria-label="Back" @click="back()"><Icon name="ChevronLeft" :size="24"/></button>
    <h1 class="min-w-0 flex-1 truncate px-1 text-[18px] font-semibold tracking-tight">{{ title }}</h1>
    <slot name="right"/>
    <button v-if="!hideSearch" type="button" class="press grid h-11 w-11 place-items-center rounded-full" aria-label="Search" @click="S.search = true"><Icon name="Search" :size="21"/></button>
    <button type="button" class="press ml-0.5 mr-1 grid h-9 w-9 place-items-center rounded-full bg-primary text-[12px] font-bold text-primary-foreground" aria-label="Your profile" @click="go('profile')">{{ ME.ini }}</button></header>` };

const TabBar = { components: { Icon },
  setup() { const items = [['home', 'Home', 'House'], ['sales', 'Sales', 'Receipt'], ['sell', 'Sell', 'ShoppingCart'], ['customers', 'Customers', 'Users'], ['alerts', 'Alerts', 'Bell']];
    return { S, items, unread, tab, go }; },
  template: `<nav class="relative z-20 flex shrink-0 items-end border-t bg-background px-1" :style="{ paddingBottom: 'var(--sa-bottom)', height: 'calc(64px + var(--sa-bottom))' }" aria-label="Main">
    <template v-for="it in items" :key="it[0]">
      <button v-if="it[0] === 'sell'" type="button" class="press relative flex flex-1 flex-col items-center pb-1.5" aria-label="Sell: open the till" @click="go('till')">
        <span class="-mt-5 grid h-14 w-14 place-items-center rounded-full bg-primary text-primary-foreground shadow-lg ring-4 ring-background"><Icon name="ShoppingCart" :size="24"/></span>
        <span class="mt-1 text-[11px] font-semibold text-primary">Sell</span></button>

  template: `<div :class="['items-center rounded-xl border bg-background', full ? 'flex w-full justify-between' : 'inline-flex shrink-0', size === 'sm' ? 'h-11' : 'h-12']"><button type="button" class="press grid h-full w-12 place-items-center" aria-label="One less" @click="$emit('sub')"><Icon name="Minus" :size="17"/></button>

const qtyOf = (id) => (S.cart.find(l => l.id === id) || { q: 0 }).q;
function addP(p) {
  const l = S.cart.find(x => x.id === p.id);
  if (l) { if (l.q + p.step > p.stock) return toast('Only ' + p.stock + ' ' + p.units + ' left'); l.q += p.step; }
  else { if (p.stock < p.step) return toast(p.stock ? 'Sold in steps of ' + p.step : p.name + ' is out of stock'); S.cart.push({ id: p.id, q: p.step }); }
}
function subP(p) { const l = S.cart.find(x => x.id === p.id); if (!l) return; l.q -= p.step; if (l.q <= 0) S.cart.splice(S.cart.indexOf(l), 1); }
const cartTotal = computed(() => S.cart.reduce((t, l) => t + prod(l.id).price * l.q, 0));
const cartUnits = computed(() => S.cart.reduce((t, l) => t + l.q, 0));
const payNow = computed(() => S.pay === 'cash' ? cartTotal.value : (S.part ? Math.min(cartTotal.value, S.partAmt || 0) : 0));

const Row = { props: { k: String, v: String, mono: Boolean }, template: `<div class="flex items-center justify-between gap-4 py-2.5 text-[15px]"><span class="text-muted-foreground">{{ k }}</span><span :class="['text-right font-medium', mono ? 'font-mono text-[14px]' : '']"><slot>{{ v }}</slot></span></div>` };
const Card = { props: { title: String, icon: String }, components: { Icon },
  template: `<section class="rise rounded-2xl border bg-card"><h3 v-if="title" class="flex items-center gap-2 px-4 pt-3.5 text-[15px] font-semibold"><Icon v-if="icon" :name="icon" :size="17" class="text-muted-foreground"/>{{ title }}</h3><div class="px-4 pb-2"><slot/></div></section>` };

const SalePage = { components: { Header, Icon, Av, Pill, Btn, Card, Row, SaleStatus, Sheet, FooterBar },
  setup() {
    const s = computed(() => SALES.find(x => x.id === S.saleId) || SALES[0]);
    const c = computed(() => cust(s.value.c));
    const total = computed(() => saleTotal(s.value));
    const left = computed(() => s.value.pay === 'undone' ? 0 : total.value - paidOf(s.value));
    const owner = computed(() => ME.value.role === 'Owner');
    const amt = ref(0); const method = ref('Cash');
    watch(() => S.sheet, (v) => { if (v === 'takepay') { amt.value = left.value; method.value = 'Cash'; } });
    const askUndo = () => { S.dialog = { title: owner.value ? 'Undo ' + s.value.id + '?' : 'Ask Amina to undo ' + s.value.id + '?', text: owner.value ? 'The stock goes back on the shelf and ' + c.value.name + "'s balance changes." : 'Nothing changes until she approves. She sees your request in Waiting for you.', action: owner.value ? 'Undo the sale' : 'Send the request', tone: owner.value ? 'destructive' : 'primary', cancel: 'Keep the sale',
      ok: () => { if (owner.value) { s.value.pay = 'undone'; s.value.undone = true; if (c.value.owes > 0) c.value.owes = Math.max(0, c.value.owes - left.value); toast(s.value.id + ' undone'); } else { s.value.undoAsked = true; toast('Sent to Amina'); } } }; };
    const record = () => { const a = Math.min(Math.max(+amt.value || 0, 0), left.value); if (!a) return; s.value.paid = paidOf(s.value) + a; s.value.pay = s.value.paid >= total.value ? 'paid' : 'part'; c.value.owes = Math.max(0, c.value.owes - a); S.sheet = null; toast(money(a) + ' recorded, ' + method.value); };
    return { S, s, c, total, left, owner, amt, method, askUndo, record, prod, money, go, paidOf, tint };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header :title="s.id" pushed hide-search/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="space-y-3 p-3 pb-6">
      <section class="rise rounded-2xl border bg-card p-4"><button type="button" class="press -m-1 flex w-[calc(100%+8px)] items-center gap-3 rounded-xl p-1 text-left" @click="!c.walkin && go('customer', c.id)"><Av :c="c" :size="48"/>
          <span class="min-w-0 flex-1"><span class="block truncate text-[17px] font-semibold">{{ c.name }}</span><span class="block text-[13px] text-muted-foreground">{{ s.day }}, {{ s.time }} · sold by {{ s.by }}</span></span><Icon v-if="!c.walkin" name="ChevronRight" :size="18" class="text-muted-foreground"/></button>
        <div class="mt-4 flex items-end justify-between"><div><p class="text-[13px] text-muted-foreground">Sale total</p><p class="text-[30px] font-bold leading-tight tracking-tight tnum">{{ money(total) }}</p></div><SaleStatus :s="s.pay"/></div>
        <div v-if="s.pay === 'unpaid' || s.pay === 'part'" class="mt-3 flex items-center justify-between rounded-xl bg-warning/10 px-3.5 py-2.5 text-[14px]"><span class="text-warning">Left to pay</span><b class="text-warning tnum">{{ money(left) }}</b></div></section>
      <Card title="Items" icon="ShoppingCart"><div v-for="l in s.lines" :key="l[0]" class="flex items-center justify-between border-b py-3 last:border-0"><span class="min-w-0 flex-1"><span class="block truncate text-[15px] font-medium">{{ prod(l[0]).name }}</span><span class="block text-[13px] text-muted-foreground tnum">{{ l[1] }} × {{ money(prod(l[0]).price) }} · oldest batch</span></span><span class="text-[15px] font-semibold tnum">{{ money(prod(l[0]).price * l[1]) }}</span></div></Card>
      <Card title="Payment" icon="Wallet"><Row k="Method" :v="s.method"/><Row k="Paid" :v="money(paidOf(s))"/><Row k="Left to pay" :v="money(left)"/></Card>
      <Card title="What happened" icon="History"><ol class="py-2"><li v-for="(e, i) in [s.undone ? ['Undone', s.day + ', 11:20', 'Amina approved'] : null, s.undoAsked ? ['Undo asked', s.day + ', 11:05', 'Rehema: wrong customer'] : null, s.pay !== 'unpaid' && !s.undone ? ['Payment', s.day + ', ' + s.time, money(paidOf(s)) + ' · ' + s.method] : null, ['Sold', s.day + ', ' + s.time, 'by ' + s.by]].filter(Boolean)" :key="i" class="relative flex gap-3 pb-4 last:pb-0">
          <span class="relative mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full bg-primary"><span class="absolute left-1/2 top-3 h-[calc(100%+22px)] w-px -translate-x-1/2 bg-border"></span></span><span class="min-w-0"><span class="block text-[15px] font-medium">{{ e[0] }}</span><span class="block text-[13px] text-muted-foreground">{{ e[1] }} · {{ e[2] }}</span></span></li></ol></Card></div></div>
    <FooterBar><p v-if="s.undone" class="py-2 text-center text-[14px] text-muted-foreground">This sale was undone.</p>
      <p v-else-if="s.undoAsked && !owner" class="flex h-12 items-center justify-center gap-2 text-[14px] text-warning"><Icon name="Hourglass" :size="17"/>Waiting for Amina to approve the undo</p>

    <Sheet :open="S.sheet === 'takepay'" title="Take payment" :sub="c.name + ' · ' + s.id" @close="S.sheet = null"><div class="px-5 pb-4">

      <p class="mb-2 mt-5 text-[13px] font-semibold uppercase tracking-wider text-muted-foreground">Paid with</p><div class="flex flex-wrap gap-2"><button v-for="m in ['Cash', 'M-Pesa', 'Tigo Pesa', 'Airtel Money', 'Bank']" :key="m" type="button" @click="method = m" :class="['press h-11 rounded-xl px-4 text-[15px] font-medium', method === m ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ m }}</button></div></div>

const Customer = { components: { Header, Icon, Av, Pill, Btn, Seg, Card, Row, AgeChip, SaleStatus, Sheet, FooterBar },

    const c = computed(() => cust(S.cid));

      <div :class="['app relative flex flex-col overflow-hidden', S.dark ? 'dark' : '', narrow ? 'h-full w-full' : 'h-[844px] w-[390px] rounded-[44px] border-[10px] border-[#18181b] shadow-2xl ring-1 ring-black/10']">
        <div v-if="!narrow" class="pointer-events-none absolute inset-x-0 top-0 z-[100] flex h-[30px] items-center justify-between px-7 text-[12px] font-semibold"><span>{{ clock }}</span><span class="absolute left-1/2 top-1.5 h-5 w-20 -translate-x-1/2 rounded-full bg-[#18181b]"></span><span class="flex items-center gap-1"><Icon name="Signal" :size="12"/><Icon name="Wifi" :size="12"/><Icon name="BatteryFull" :size="14"/></span></div>
        <Screen/><TabBar v-if="bar"/><Drawer/><SearchView/><PhoneSheets/><Confirm/><Toast/></div></div></div>
    <template v-if="narrow"><button v-if="!S.sheet && !S.drawer && !S.dialog" type="button" class="fixed left-3 z-[200] flex items-center gap-2 rounded-full border bg-white px-3 py-2 text-xs font-medium text-black shadow-lg" style="bottom: calc(86px + env(safe-area-inset-bottom, 0px))" @click="menu = !menu"><Icon name="Map" :size="14"/>States</button>
      <div v-if="menu" class="fixed inset-x-3 bottom-32 z-[200] max-h-[70dvh] overflow-y-auto rounded-2xl bg-white p-4 text-black shadow-2xl"><Picker/></div></template></div>`
};
