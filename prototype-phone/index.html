  template: `<div class="mb-2 mt-6 flex items-center justify-between px-1"><h2 class="text-base font-semibold">{{ title }}</h2><button v-if="link" type="button" class="press -mr-2 flex h-8 items-center gap-0.5 rounded-lg px-2 text-sm font-medium text-primary" @click="$emit('link')">{{ link }}<Icon name="ChevronRight" :size="16"/></button></div>` };

const Kpi = { props: { label: String, icon: String, tone: { type: String, default: 'primary' }, value: String, hint: String }, components: { Icon },
  template: `<div class="rise rounded-xl border bg-card p-4"><div class="flex items-start justify-between"><p class="text-xs text-muted-foreground">{{ label }}</p>
    <span :class="['grid h-8 w-8 place-items-center rounded-lg', { primary: 'bg-primary/10 text-primary', warning: 'bg-warning/15 text-warning', success: 'bg-success/15 text-success' }[tone]]"><Icon :name="icon" :size="16"/></span></div>
    <p class="mt-2 text-2xl font-bold leading-tight tracking-tight tnum">{{ value }}</p><p class="mt-0.5 truncate text-xs text-muted-foreground">{{ hint }}</p></div>` };

const Home = { components: { Header, Icon, Section, Kpi, Av, Tile, Pill, AgeChip, LevelBadge, Balance },
  setup() {
    const owner = computed(() => S.role === 'owner');
    const hour = 'Good afternoon';
    const owing = computed(() => CUSTOMERS.filter(c => c.owes > 0).sort((a, b) => b.owes - a.owes).slice(0, 3));
    const low = computed(() => PRODUCTS.filter(p => level(p) !== 'ok'));
    const actions = computed(() => owner.value
      ? [['Sell', 'Open the till', 'ShoppingCart', () => go('till')], ['Receive stock', 'A new batch came in', 'PackagePlus', () => go('receive')], ['Take payment', 'Pays the oldest first', 'Wallet', () => tab('customers')], ['Close the day', 'Count stock and cash', 'ClipboardCheck', () => tab('count')]]
      : [['Sell', 'Open the till', 'ShoppingCart', () => go('till')], ['Take payment', 'Pays the oldest first', 'Wallet', () => tab('customers')], ['Add expense', 'Waits for Amina', 'Coins', () => tab('expenses')], ['Count stock', 'End of the day', 'ClipboardCheck', () => tab('count')]]);
    return { S, ME, owner, hour, owing, low, actions, waitingN, WAITING, SALES, cust, saleTotal, saleLine, money, go, tab, tint };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="Home"/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto px-4 pb-6 pt-4">
      <p class="text-xs text-muted-foreground">Office Shop · Tue 13 Oct 2026</p>
      <h2 class="text-xl font-bold leading-tight tracking-tight">{{ hour }}, {{ ME.name }}</h2>

      <button v-if="owner && waitingN" type="button" class="press rise mt-4 flex w-full items-center gap-3 rounded-xl border border-warning/40 bg-warning/10 p-4 text-left" @click="go('waiting')">
        <span class="grid h-9 w-9 shrink-0 place-items-center rounded-md bg-warning/20 text-warning"><Icon name="Hourglass" :size="22"/></span>
        <span class="min-w-0 flex-1"><span class="block text-sm font-semibold">{{ waitingN }} things wait for you</span><span class="block truncate text-xs text-muted-foreground">{{ WAITING[0].title }}</span></span><Icon name="ChevronRight" :size="20" class="text-muted-foreground"/></button>
      <div v-else-if="!owner" class="rise mt-4 flex items-center gap-3 rounded-xl border bg-card p-4"><span class="grid h-9 w-9 shrink-0 place-items-center rounded-md bg-muted"><Icon name="Hourglass" :size="22" class="text-muted-foreground"/></span>
        <span class="min-w-0 flex-1"><span class="block text-sm font-semibold">2 requests wait for Amina</span><span class="block truncate text-xs text-muted-foreground">Undo S-1290 · Expense EXP-0035</span></span></div>

      <div class="mt-4 grid grid-cols-2 gap-3"><button v-for="a in actions" :key="a[0]" type="button" class="press rise flex min-h-[80px] flex-col items-start justify-between rounded-xl border bg-card p-4 text-left" @click="a[3]()">
        <span class="grid h-9 w-9 place-items-center rounded-md bg-primary text-primary-foreground"><Icon :name="a[2]" :size="20"/></span>
        <span><span class="block text-sm font-semibold leading-tight">{{ a[0] }}</span><span class="block text-xs text-muted-foreground">{{ a[1] }}</span></span></button></div>

      <div class="mt-3 grid grid-cols-2 gap-3">
        <Kpi label="Sales today" icon="ShoppingCart" value="TZS 8,500" hint="9 sales · 13 units"/>
        <Kpi label="Owed to you" icon="HandCoins" tone="warning" value="TZS 75,000" hint="by 27 customers"/>
        <Kpi v-if="owner" label="Stock value" icon="Package" value="TZS 80,480" hint="what you paid for it"/>
        <Kpi label="Low or out" icon="TriangleAlert" tone="warning" value="1" hint="Trident"/></div>

      <Section title="Who owes the most" link="All customers" @link="tab('customers')"/>
      <div class="overflow-hidden rounded-xl border bg-card"><button v-for="(c, i) in owing" :key="c.id" type="button" :class="['press flex w-full py-2.5 items-center gap-3 px-4 text-left', i ? 'border-t' : '']" @click="go('customer', c.id)">
        <Av :c="c" :size="36"/><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ c.name }}</span><AgeChip :days="c.days"/></span><Balance :b="c.owes"/></button></div>

      <Section title="Needs restocking" link="Products" @link="tab('products')"/>
      <div v-for="p in low" :key="p.id" class="flex items-center gap-3 rounded-xl border bg-card p-4"><Tile :p="p" :size="36"/>
        <span class="min-w-0 flex-1"><span class="flex items-center gap-2"><span class="truncate text-sm font-medium">{{ p.name }}</span><LevelBadge :p="p"/></span><span class="block truncate text-xs text-muted-foreground">{{ p.stock }} {{ p.units }} left · warn at {{ p.reorder }}</span></span>
        <button type="button" class="press h-9 shrink-0 rounded-md border px-3.5 text-sm font-semibold" @click="go('receive')">Receive</button></div>

      <Section title="Latest sales" link="All sales" @link="tab('sales')"/>
      <div class="overflow-hidden rounded-xl border bg-card"><button v-for="(s, i) in SALES.slice(0, 4)" :key="s.id" type="button" :class="['press flex w-full py-2 items-center gap-3 px-4 text-left', i ? 'border-t' : '']" @click="go('sale', s.id)">
        <span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ cust(s.c).name }}</span><span class="block truncate text-xs text-muted-foreground">{{ s.id }} · {{ s.time }} · {{ saleLine(s.lines[0]) }}</span></span>
        <span class="text-sm font-semibold tnum">{{ money(saleTotal(s)) }}</span></button></div>
    </div></div>` };

/* what waits for the owner: each card is decided on the spot */
const Waiting = { components: { Header, Icon, Pill, Btn, Empty },
  setup() { const items = computed(() => WAITING.filter(w => !S.waitingDone.includes(w.id)));
    const decide = (w, yes) => { S.waitingDone.push(w.id); toast(yes ? 'Approved: ' + w.title.split(' · ')[0] : 'Declined: ' + w.title.split(' · ')[0]); };
    return { items, decide, S }; },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="Waiting for you" pushed hide-search/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto px-4 pb-6 pt-4">
      <Empty v-if="!items.length" icon="CircleCheck" title="Nothing is waiting" text="Rehema's requests show up here the moment she sends them."/>
      <div v-for="w in items" :key="w.id" class="rise mb-3 rounded-xl border bg-card p-4">
        <div class="flex items-start gap-3"><span class="grid h-9 w-9 shrink-0 place-items-center rounded-md bg-warning/15 text-warning"><Icon :name="w.icon" :size="20"/></span>
          <div class="min-w-0 flex-1"><Pill tone="warning">{{ w.kind }}</Pill><p class="mt-1.5 text-sm font-semibold leading-snug">{{ w.title }}</p><p class="mt-0.5 text-sm text-muted-foreground">{{ w.sub }}</p></div></div>
        <div class="mt-4 grid grid-cols-2 gap-2"><Btn v="outline" size="md" @click="decide(w, false)">Decline</Btn><Btn size="md" @click="decide(w, true)">Approve</Btn></div></div></div></div>` };

/* ============================================================ Till (full screen, no tab bar) */
const Stepper = { props: { q: Number, step: { type: Number, default: 1 }, max: Number, size: { type: String, default: 'md' }, full: Boolean }, components: { Icon },
  template: `<div :class="['items-center rounded-md border bg-background', full ? 'flex w-full justify-between' : 'inline-flex shrink-0', size === 'sm' ? 'h-9' : 'h-9']"><button type="button" class="press grid h-full w-12 place-items-center" aria-label="One less" @click="$emit('sub')"><Icon name="Minus" :size="17"/></button>
    <span class="min-w-9 text-center text-sm font-semibold tnum" aria-live="polite">{{ q }}</span><button type="button" :disabled="q + step > max" :class="['press grid h-full w-12 place-items-center', q + step > max ? 'opacity-35' : '']" aria-label="One more" @click="$emit('add')"><Icon name="Plus" :size="17"/></button></div>` };

const qtyOf = (id) => (S.cart.find(l => l.id === id) || { q: 0 }).q;
function addP(p) {
  const l = S.cart.find(x => x.id === p.id);
  if (l) { if (l.q + p.step > p.stock) return toast('Only ' + p.stock + ' ' + p.units + ' left'); l.q += p.step; }
  else { if (p.stock < p.step) return toast(p.stock ? 'Sold in steps of ' + p.step : p.name + ' is out of stock'); S.cart.push({ id: p.id, q: p.step }); }
}
function subP(p) { const l = S.cart.find(x => x.id === p.id); if (!l) return; l.q -= p.step; if (l.q <= 0) S.cart.splice(S.cart.indexOf(l), 1); }
const cartTotal = computed(() => S.cart.reduce((t, l) => t + prod(l.id).price * l.q, 0));
const cartUnits = computed(() => S.cart.reduce((t, l) => t + l.q, 0));
const payNow = computed(() => S.pay === 'cash' ? cartTotal.value : (S.part ? Math.min(cartTotal.value, S.partAmt || 0) : 0));
const owesAfter = computed(() => cust(S.customer).owes + cartTotal.value - payNow.value);
const overLimit = computed(() => S.pay === 'credit' && !cust(S.customer).walkin && cust(S.customer).limit > 0 && owesAfter.value > cust(S.customer).limit);
const canCharge = computed(() => cartTotal.value > 0 && !(S.pay === 'credit' && cust(S.customer).walkin));
S.partAmt = 0;
let nextSale = 1305;
function charge() {
  const lines = S.cart.map(l => [l.id, l.q]);
  const paid = payNow.value, total = cartTotal.value;
  const sale = { id: 'S-' + (nextSale++), c: S.customer, day: 'Today', time: '11:02', lines, pay: paid >= total ? 'paid' : paid > 0 ? 'part' : 'unpaid', method: S.pay === 'cash' ? 'Cash' : 'Credit', by: ME.value.name, paid, fresh: true };
  SALES.unshift(sale); if (sale.pay !== 'paid') cust(S.customer).owes += total - paid;
  S.receipt = sale; S.recSrc = null; S.print = 'idle'; S.cart = []; S.cartOpen = false; S.partAmt = 0; S.part = false; S.pay = 'cash';
  S.route = 'receipt';
}

const Till = { components: { Icon, Tile, Av, Pill, Btn, Stepper, Sheet, FooterBar, Toggle },
  setup() {
    const shown = computed(() => PRODUCTS.filter(p => p.name.toLowerCase().includes(S.tillQ.trim().toLowerCase())));
    const c = computed(() => cust(S.customer));
    const lines = computed(() => S.cart.map(l => ({ p: prod(l.id), q: l.q })));
    const picks = computed(() => CUSTOMERS.filter(x => (x.name + x.phone).toLowerCase().includes(S.custQ.trim().toLowerCase())));
    const pickCustomer = (id) => { S.customer = id; if (cust(id).walkin) { S.pay = 'cash'; S.part = false; } S.sheet = null; S.cartOpen = true; };
    const canPay = computed(() => ME.value.role === 'Owner');
    return { S, ME, shown, c, lines, picks, pickCustomer, canPay, cartTotal, cartUnits, payNow, owesAfter, overLimit, canCharge, charge, qtyOf, addP, subP, level, perText, stockText, money, num, cust, go, back, toast, tint };
  },
  template: `<div class="relative flex min-h-0 flex-1 flex-col">
    <header class="flex shrink-0 items-center gap-2 border-b bg-background px-2" :style="{ paddingTop: 'var(--sa-top)', height: 'calc(56px + var(--sa-top))' }">
      <button type="button" class="press grid h-9 w-9 place-items-center rounded-full" aria-label="Leave the till (the cart is kept)" @click="back()"><Icon name="X" :size="22"/></button>
      <div class="min-w-0 flex-1 px-1"><h1 class="text-base font-semibold leading-tight">Till</h1><p class="truncate text-xs leading-tight text-muted-foreground">Office Shop · {{ ME.name }}</p></div>
      <button type="button" class="press flex h-9 max-w-[170px] items-center gap-2 rounded-full border bg-muted/50 py-1 pl-1.5 pr-3" aria-label="Choose the customer" @click="S.sheet = 'cust'"><Av :c="c" :size="36"/><span class="truncate text-sm font-medium">{{ c.walkin ? 'Walk-in' : c.name.split(' ')[0] }}</span><Icon name="ChevronDown" :size="14" class="shrink-0 text-muted-foreground"/></button></header>

    <div class="flex shrink-0 items-center gap-2 border-b bg-background px-3 py-2.5"><label class="flex h-9 min-w-0 flex-1 items-center gap-2.5 rounded-md border bg-muted/50 px-3.5"><Icon name="Search" :size="18" class="text-muted-foreground"/>
      <input v-model="S.tillQ" type="search" placeholder="Find a product" aria-label="Find a product" class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-muted-foreground"></label>
      <button type="button" class="press grid h-9 w-11 shrink-0 place-items-center rounded-md border bg-muted/50" aria-label="Scan a barcode" @click="toast('Scan opens the camera, and you can type the code')"><Icon name="ScanBarcode" :size="22"/></button></div>

    <div class="scroll min-h-0 flex-1 overflow-y-auto p-3"><div class="grid grid-cols-2 gap-3">
      <div v-for="p in shown" :key="p.id" :class="['relative overflow-hidden rounded-xl border bg-card', p.stock <= 0 ? 'opacity-55' : '', qtyOf(p.id) ? 'ring-2 ring-primary' : '']">
        <div class="h-1" :style="{ background: p.c }"></div>
        <button type="button" class="press block w-full p-3.5 text-left" :disabled="p.stock <= 0" :aria-label="'Add ' + p.name" @click="addP(p)">
          <span class="flex items-start justify-between"><Tile :p="p" :size="36"/><span v-if="qtyOf(p.id)" class="grid h-7 min-w-7 place-items-center rounded-full bg-primary px-1.5 text-xs font-bold text-primary-foreground tnum">{{ qtyOf(p.id) }}</span></span>
          <span class="mt-2.5 block truncate text-sm font-semibold">{{ p.name }}</span>
          <span class="block text-base font-bold tnum">{{ perText(p) }}</span>
          <span :class="['mt-0.5 block text-xs', level(p) === 'ok' ? 'text-muted-foreground' : level(p) === 'low' ? 'font-medium text-warning' : 'font-medium text-destructive']">{{ stockText(p) }}</span></button>
        <div v-if="qtyOf(p.id)" class="border-t p-2"><Stepper full size="sm" :q="qtyOf(p.id)" :step="p.step" :max="p.stock" @sub="subP(p)" @add="addP(p)"/></div></div></div>
      <p v-if="!shown.length" class="py-12 text-center text-sm text-muted-foreground">No product matches "{{ S.tillQ }}"</p></div>

    <FooterBar><button v-if="cartUnits" type="button" class="press flex w-full py-2.5 items-center gap-3 rounded-xl bg-primary px-4 text-primary-foreground" @click="S.cartOpen = true">
        <span class="relative grid h-9 w-9 place-items-center rounded-full bg-white/20"><Icon name="ShoppingCart" :size="19"/><span class="absolute -right-1 -top-1 grid h-5 min-w-5 place-items-center rounded-full bg-white px-1 text-[11px] font-bold text-primary">{{ S.cart.length }}</span></span>
        <span class="min-w-0 flex-1 text-left"><span class="block truncate text-sm font-medium opacity-90">{{ c.walkin ? 'Walk-in customer' : c.name }}</span></span><span class="text-base font-bold tnum">{{ money(cartTotal) }}</span><Icon name="ChevronUp" :size="20"/></button>
      <p v-else class="grid h-9 place-items-center rounded-xl bg-muted text-sm text-muted-foreground">Tap a product to start a sale</p></FooterBar>

    <Sheet :open="S.cartOpen && !S.sheet" tall title="Cart" :sub="(c.walkin ? 'Walk-in customer' : c.name) + ' · ' + cartUnits + ' items'" @close="S.cartOpen = false">
      <div class="px-4 pb-4">
        <button type="button" class="press mb-3 flex w-full py-2.5 items-center gap-3 rounded-xl border bg-muted/40 px-3 text-left" @click="S.sheet = 'cust'"><Av :c="c" :size="36"/>
          <span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ c.walkin ? 'Walk-in customer' : c.name }}</span><span class="block truncate text-xs text-muted-foreground">{{ c.walkin ? 'Pays now, no account' : (c.owes > 0 ? 'Owes ' + money(c.owes) : 'Settled') + ' · limit ' + money(c.limit) }}</span></span><span class="text-sm font-semibold text-primary">Change</span></button>
        <div class="divide-y rounded-xl border bg-card"><div v-for="l in lines" :key="l.p.id" class="flex items-center gap-3 p-3"><Tile :p="l.p" :size="36"/>
          <div class="min-w-0 flex-1"><p class="truncate text-sm font-medium">{{ l.p.name }}</p><p class="text-xs text-muted-foreground tnum">{{ perText(l.p) }} · oldest batch first</p></div>
          <div class="flex flex-col items-end gap-1.5"><span class="text-sm font-semibold tnum">{{ money(l.p.price * l.q) }}</span><Stepper size="sm" :q="l.q" :step="l.p.step" :max="l.p.stock" @sub="subP(l.p)" @add="addP(l.p)"/></div></div></div>

        <p class="mb-2 mt-5 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">How is it paid</p>
        <div class="grid grid-cols-2 gap-1 rounded-xl bg-muted p-1"><button v-for="m in [['cash','Cash now'],['credit','On credit']]" :key="m[0]" type="button" :class="['press h-9 rounded-md text-sm font-semibold', S.pay === m[0] ? 'bg-background shadow-sm' : 'text-muted-foreground']" @click="S.pay = m[0]; if (m[0] === 'cash') S.part = false">{{ m[1] }}</button></div>
        <p v-if="S.pay === 'credit' && c.walkin" class="mt-3 flex items-start gap-2 rounded-md bg-warning/10 p-3 text-sm text-warning"><Icon name="Info" :size="18" class="mt-0.5"/><span>Walk-in customers pay now. Choose a customer to sell on credit.</span></p>
        <template v-if="S.pay === 'credit' && !c.walkin">
          <p v-if="overLimit" class="mt-3 flex items-start gap-2 rounded-md bg-warning/10 p-3 text-sm text-warning"><Icon name="TriangleAlert" :size="18" class="mt-0.5"/><span>{{ c.name.split(' ')[0] }} would owe {{ money(owesAfter) }}, over the limit of {{ money(c.limit) }}. You can still go on.</span></p>
          <div class="mt-3 flex items-center justify-between rounded-xl border px-4 py-3"><span class="text-sm font-medium">Pays part now</span><Toggle :model-value="S.part" label="Pays part now" @update:model-value="S.part = $event"/></div>
          <label v-if="S.part" class="mt-2 flex py-2.5 items-center gap-2 rounded-xl border px-4"><span class="text-sm text-muted-foreground">TZS</span><input v-model.number="S.partAmt" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Amount paid now" placeholder="0" class="min-w-0 flex-1 bg-transparent text-right text-xl font-semibold tnum outline-none"></label></template>

        <div class="mt-4 flex py-2.5 items-center gap-3 rounded-xl border px-4"><Icon name="Landmark" :size="20" class="text-muted-foreground"/><span class="flex-1"><span class="block text-xs text-muted-foreground">Paid into</span><span class="block text-sm font-medium">{{ S.account }}</span></span>
          <Pill v-if="!canPay" tone="muted"><Icon name="Lock" :size="12"/>Drawer</Pill><button v-else type="button" class="press text-sm font-semibold text-primary" @click="S.sheet = 'acct'">Change</button></div>

        <div class="mt-4 space-y-1.5 rounded-xl bg-muted/50 p-4 tnum"><div class="flex justify-between text-sm text-muted-foreground"><span>{{ S.cart.length }} {{ S.cart.length === 1 ? 'line' : 'lines' }} · {{ cartUnits }} {{ cartUnits === 1 ? 'item' : 'items' }}</span><span>{{ money(cartTotal) }}</span></div>
          <div v-if="S.pay === 'credit'" class="flex justify-between text-sm"><span class="text-muted-foreground">Paid now</span><span class="font-medium">{{ money(payNow) }}</span></div>
          <div class="flex items-baseline justify-between pt-1"><span class="text-sm font-semibold">{{ S.pay === 'credit' ? 'Goes on credit' : 'Total' }}</span><span class="text-2xl font-bold">{{ money(cartTotal - payNow || cartTotal) }}</span></div></div></div>
      <template #footer><Btn full :disabled="!canCharge" @click="charge()">{{ S.pay === 'cash' ? 'Charge ' + money(cartTotal) : 'Sell on credit' }}</Btn></template></Sheet>

    <Sheet :open="S.sheet === 'cust'" title="Who is buying?" @close="S.sheet = null">
      <div class="px-4 pb-4"><label class="flex h-9 items-center gap-2.5 rounded-md border bg-muted/50 px-3.5"><Icon name="Search" :size="18" class="text-muted-foreground"/><input v-model="S.custQ" type="search" placeholder="Name or phone" aria-label="Find a customer" class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-muted-foreground"></label>
        <button type="button" class="press mt-2 flex w-full py-2.5 items-center gap-3 text-left text-primary" @click="toast('New customer: name and phone, then back here')"><span class="grid h-9 w-9 place-items-center rounded-full bg-primary/10"><Icon name="UserPlus" :size="19"/></span><span class="text-sm font-semibold">Add a new customer</span></button>
        <button v-for="x in picks" :key="x.id" type="button" :class="['press flex w-full py-2 items-center gap-3 rounded-md px-1 text-left', S.customer === x.id ? 'bg-primary/10' : '']" @click="pickCustomer(x.id)"><Av :c="x" :size="36"/>
          <span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ x.name }}</span><span class="block truncate text-xs text-muted-foreground">{{ x.walkin ? 'Pays now' : (x.phone || 'No phone') }}</span></span>
          <span v-if="S.customer === x.id" class="mr-1 text-primary"><Icon name="Check" :size="20"/></span><span v-else-if="x.owes > 0" class="mr-1 text-xs font-medium text-warning tnum">Owes {{ num(x.owes) }}</span></button></div></Sheet>

    <Sheet :open="S.sheet === 'acct'" title="Paid into" @close="S.sheet = null"><div class="px-4 pb-4"><button v-for="a in [['Cash drawer','Banknote'],['Lipa Namba','Smartphone'],['M-Pesa wallet','Wallet'],['CRDB bank','Landmark']]" :key="a[0]" type="button" class="press flex w-full py-2.5 items-center gap-3 text-left" @click="S.account = a[0]; S.sheet = null">
      <span class="grid h-9 w-9 place-items-center rounded-md bg-muted"><Icon :name="a[1]" :size="19"/></span><span class="flex-1 text-sm font-medium">{{ a[0] }}</span><Icon v-if="S.account === a[0]" name="Check" :size="20" class="text-primary"/></button></div></Sheet>
  </div>` };

/* ============================================================ Sales */
const itemsText = (s) => saleLine(s.lines[0]) + (s.lines.length > 1 ? ' +' + (s.lines.length - 1) + ' more' : '');
const paidOf = (s) => s.pay === 'paid' ? saleTotal(s) : s.pay === 'part' ? (s.paid || 0) : 0;

const FilterSheet = { props: { open: Boolean }, components: { Sheet, Btn },
  setup() {
    const l = reactive({ status: 'all', range: 'all', who: 'all' });
    watch(() => S.sheet, (v) => { if (v === 'filter') Object.assign(l, S.salesFilter); });
    const apply = () => { Object.assign(S.salesFilter, l); S.sheet = null; S.shown = 6; };
    const reset = () => Object.assign(l, { status: 'all', range: 'all', who: 'all' });
    return { S, l, apply, reset, st: [['all', 'All'], ['unpaid', 'Unpaid'], ['part', 'Part paid'], ['paid', 'Paid'], ['undone', 'Undone']], rg: [['all', 'All time'], ['today', 'Today'], ['week', 'This week'], ['month', 'This month']], who: [['all', 'Everyone'], ['Rehema', 'Rehema'], ['Amina', 'Amina']] };
  },
  template: `<Sheet :open="S.sheet === 'filter'" title="Filters" @close="S.sheet = null"><div class="px-5 pb-4">
      <p class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Status</p><div class="flex flex-wrap gap-2"><button v-for="o in st" :key="o[0]" type="button" @click="l.status = o[0]" :class="['press h-9 rounded-md px-4 text-sm font-medium', l.status === o[0] ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ o[1] }}</button></div>
      <p class="mb-2 mt-6 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Sold by</p><div class="flex flex-wrap gap-2"><button v-for="o in who" :key="o[0]" type="button" @click="l.who = o[0]" :class="['press h-9 rounded-md px-4 text-sm font-medium', l.who === o[0] ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ o[1] }}</button></div>
      <p class="mb-2 mt-6 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Date</p><div class="grid grid-cols-2 gap-2"><button v-for="o in rg" :key="o[0]" type="button" @click="l.range = o[0]" :class="['press h-9 rounded-md text-sm font-medium', l.range === o[0] ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ o[1] }}</button></div></div>
    <template #footer><div class="grid grid-cols-[1fr_2fr] gap-2"><Btn v="outline" @click="reset">Reset</Btn><Btn @click="apply">Show sales</Btn></div></template></Sheet>` };

const SalesList = { components: { Header, Icon, Av, Pill, Seg, Empty, FilterBar, SaleStatus, FilterSheet },
  setup() {
    const tabs = computed(() => [{ id: 'all', label: 'All' }, { id: 'unpaid', label: 'Unpaid', count: SALES.filter(s => s.pay === 'unpaid').length }, { id: 'part', label: 'Part paid', count: SALES.filter(s => s.pay === 'part').length }]);
    const rows = computed(() => SALES.filter(s => {
      const f = S.salesFilter; const st = f.status !== 'all' ? f.status : S.salesTab;
      return (st === 'all' || s.pay === st || (st === 'undone' && s.undone)) && (f.who === 'all' || s.by === f.who) && (f.range === 'all' || f.range === 'week' || f.range === 'month' || s.day === 'Today')
        && (!S.salesQ || (s.id + cust(s.c).name).toLowerCase().includes(S.salesQ.toLowerCase()));
    }));
    const groups = computed(() => { const g = []; rows.value.slice(0, S.shown).forEach(s => { let x = g.find(y => y.day === s.day); if (!x) g.push(x = { day: s.day, rows: [] }); x.rows.push(s); }); return g; });
    const dayTotal = (g) => money(g.rows.reduce((t, s) => t + saleTotal(s), 0));
    const active = computed(() => S.salesFilter.status !== 'all' || S.salesFilter.who !== 'all' || S.salesFilter.range !== 'all');
    const summary = computed(() => { const p = []; const f = S.salesFilter; if (f.status !== 'all') p.push({ unpaid: 'Unpaid', part: 'Part paid', paid: 'Paid', undone: 'Undone' }[f.status]); if (f.who !== 'all') p.push(f.who); if (f.range !== 'all') p.push({ today: 'Today', week: 'This week', month: 'This month' }[f.range]); return p.length ? 'Filter · ' + p.join(' · ') : 'All sales · filter'; });
    const refresh = () => { S.list = 'loading'; setTimeout(() => { if (S.list === 'loading') S.list = 'data'; }, 900); };
    return { S, tabs, rows, groups, dayTotal, active, summary, refresh, waitingN, ME, cust, saleTotal, itemsText, money, go, tab };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="Sales"/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto">
      <FilterBar :summary="summary" :active="active" :loading="S.list === 'loading'" @refresh="refresh" @open="S.sheet = 'filter'"/>
      <div class="space-y-3 px-3 pb-6 pt-3">
        <button v-if="ME.role === 'Owner' && waitingN" type="button" class="press flex w-full items-center gap-3 rounded-xl border border-warning/40 bg-warning/10 px-4 py-3 text-left" @click="go('waiting')"><Icon name="Undo2" :size="20" class="text-warning"/><span class="flex-1 text-sm"><b>2 undo requests</b> wait for you. Stock and balances change after you approve.</span><Icon name="ChevronRight" :size="18" class="text-muted-foreground"/></button>
        <Seg v-model="S.salesTab" :tabs="tabs"/>
        <template v-if="S.list === 'loading'"><div v-for="i in 5" :key="i" class="skel h-[60px] rounded-xl"></div></template>
        <div v-else-if="S.list === 'error'" class="flex items-center justify-between rounded-xl border border-destructive/30 bg-destructive/10 p-4 text-sm text-destructive"><span>Could not load sales.</span><button class="press h-8 px-2 font-semibold underline" @click="S.list = 'data'">Retry</button></div>
        <Empty v-else-if="S.list === 'empty' || !rows.length" icon="Receipt" title="No sales found" text="Try another filter, or open the till to make one."/>
        <template v-else><div v-for="g in groups" :key="g.day"><div class="mb-1.5 flex items-baseline justify-between px-1"><h3 class="text-sm font-semibold">{{ g.day }}</h3><span class="text-xs text-muted-foreground tnum">{{ g.rows.length }} sales · {{ dayTotal(g) }}</span></div>
          <div class="overflow-hidden rounded-xl border bg-card"><button v-for="(s, i) in g.rows" :key="s.id" type="button" :class="['press flex w-full items-center gap-3 px-3.5 py-3 text-left', i ? 'border-t' : '']" @click="go('sale', s.id)">
            <Av :c="cust(s.c)" :size="36"/><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ cust(s.c).name }}</span><span class="block truncate text-xs text-muted-foreground tnum">{{ s.id }} · {{ s.time }} · {{ itemsText(s) }}</span>
              <span v-if="s.undoAsked" class="mt-0.5 flex items-center gap-1 text-xs font-medium text-warning"><Icon name="Undo2" :size="12"/>Undo asked</span></span>
            <span class="flex flex-col items-end gap-1"><span class="text-sm font-semibold tnum">{{ money(saleTotal(s)) }}</span><SaleStatus :s="s.pay"/></span></button></div></div>
          <button v-if="rows.length > S.shown" type="button" class="press h-9 w-full rounded-md border bg-card text-sm font-semibold" @click="S.shown += 6">Show more</button></template></div></div>
    <FilterSheet/></div>` };

const Row = { props: { k: String, v: String, mono: Boolean }, template: `<div class="flex items-center justify-between gap-4 py-2.5 text-sm"><span class="text-muted-foreground">{{ k }}</span><span :class="['text-right font-medium', mono ? 'font-mono text-sm' : '']"><slot>{{ v }}</slot></span></div>` };
const Card = { props: { title: String, icon: String }, components: { Icon },
  template: `<section class="rise rounded-xl border bg-card"><h3 v-if="title" class="flex items-center gap-2 px-4 pt-3.5 text-sm font-semibold"><Icon v-if="icon" :name="icon" :size="17" class="text-muted-foreground"/>{{ title }}</h3><div class="px-4 pb-2"><slot/></div></section>` };

const SalePage = { components: { Header, Icon, Av, Pill, Btn, Card, Row, SaleStatus, Sheet, FooterBar },
  setup() {
    const s = computed(() => SALES.find(x => x.id === S.saleId) || SALES[0]);
    const c = computed(() => cust(s.value.c));
    const total = computed(() => saleTotal(s.value));
    const left = computed(() => s.value.pay === 'undone' ? 0 : total.value - paidOf(s.value));
    const owner = computed(() => ME.value.role === 'Owner');
    const amt = ref(0); const method = ref('Cash');
    watch(() => S.sheet, (v) => { if (v === 'takepay') { amt.value = left.value; method.value = 'Cash'; } });
    const askUndo = () => { S.dialog = { title: owner.value ? 'Undo ' + s.value.id + '?' : 'Ask Amina to undo ' + s.value.id + '?', text: owner.value ? 'The stock goes back on the shelf and ' + c.value.name + "'s balance changes." : 'Nothing changes until she approves. She sees your request in Waiting for you.', action: owner.value ? 'Undo the sale' : 'Send the request', tone: owner.value ? 'destructive' : 'primary', cancel: 'Keep the sale',
      ok: () => { if (owner.value) { s.value.pay = 'undone'; s.value.undone = true; if (c.value.owes > 0) c.value.owes = Math.max(0, c.value.owes - left.value); toast(s.value.id + ' undone'); } else { s.value.undoAsked = true; toast('Sent to Amina'); } } }; };
    const record = () => { const a = Math.min(Math.max(+amt.value || 0, 0), left.value); if (!a) return; s.value.paid = paidOf(s.value) + a; s.value.pay = s.value.paid >= total.value ? 'paid' : 'part'; c.value.owes = Math.max(0, c.value.owes - a); S.sheet = null; newPayment(c.value.id, a, method.value, [s.value.id]); };
    const openReceipt = () => { S.recSrc = { kind: 'sale', id: s.value.id, copy: true }; S.print = 'idle'; go('receipt'); };
    return { S, s, c, total, left, owner, amt, method, askUndo, record, openReceipt, prod, money, go, paidOf, tint };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header :title="s.id" pushed hide-search/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="space-y-3 p-3 pb-6">
      <section class="rise rounded-xl border bg-card p-4"><button type="button" class="press -m-1 flex w-[calc(100%+8px)] items-center gap-3 rounded-md p-1 text-left" @click="!c.walkin && go('customer', c.id)"><Av :c="c" :size="36"/>
          <span class="min-w-0 flex-1"><span class="block truncate text-base font-semibold">{{ c.name }}</span><span class="block text-xs text-muted-foreground">{{ s.day }}, {{ s.time }} · sold by {{ s.by }}</span></span><Icon v-if="!c.walkin" name="ChevronRight" :size="18" class="text-muted-foreground"/></button>
        <div class="mt-4 flex items-end justify-between"><div><p class="text-xs text-muted-foreground">Sale total</p><p class="text-2xl font-bold leading-tight tracking-tight tnum">{{ money(total) }}</p></div><SaleStatus :s="s.pay"/></div>
        <div v-if="s.pay === 'unpaid' || s.pay === 'part'" class="mt-3 flex items-center justify-between rounded-md bg-warning/10 px-3.5 py-2.5 text-sm"><span class="text-warning">Left to pay</span><b class="text-warning tnum">{{ money(left) }}</b></div></section>
      <Card title="Items" icon="ShoppingCart"><div v-for="l in s.lines" :key="l[0]" class="flex items-center justify-between border-b py-3 last:border-0"><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ prod(l[0]).name }}</span><span class="block text-xs text-muted-foreground tnum">{{ l[1] }} × {{ money(prod(l[0]).price) }} · oldest batch</span></span><span class="text-sm font-semibold tnum">{{ money(prod(l[0]).price * l[1]) }}</span></div></Card>
      <Card title="Payment" icon="Wallet"><Row k="Method" :v="s.method"/><Row k="Paid" :v="money(paidOf(s))"/><Row k="Left to pay" :v="money(left)"/></Card>
      <button type="button" class="press flex w-full items-center gap-3 rounded-xl border bg-card px-4 py-3 text-left" @click="openReceipt"><span class="grid h-9 w-9 place-items-center rounded-md bg-muted"><Icon name="ReceiptText" :size="19"/></span><span class="min-w-0 flex-1"><span class="block text-sm font-semibold">Receipt</span><span class="block text-xs text-muted-foreground">Print it or share it again</span></span><Icon name="ChevronRight" :size="18" class="text-muted-foreground"/></button>
      <Card title="What happened" icon="History"><ol class="py-2"><li v-for="(e, i) in [s.undone ? ['Undone', s.day + ', 11:20', 'Amina approved'] : null, s.undoAsked ? ['Undo asked', s.day + ', 11:05', 'Rehema: wrong customer'] : null, s.pay !== 'unpaid' && !s.undone ? ['Payment', s.day + ', ' + s.time, money(paidOf(s)) + ' · ' + s.method] : null, ['Sold', s.day + ', ' + s.time, 'by ' + s.by]].filter(Boolean)" :key="i" class="relative flex gap-3 pb-4 last:pb-0">
          <span class="relative mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full bg-primary"><span class="absolute left-1/2 top-3 h-[calc(100%+22px)] w-px -translate-x-1/2 bg-border"></span></span><span class="min-w-0"><span class="block text-sm font-medium">{{ e[0] }}</span><span class="block text-xs text-muted-foreground">{{ e[1] }} · {{ e[2] }}</span></span></li></ol></Card></div></div>
    <FooterBar><p v-if="s.undone" class="py-2 text-center text-sm text-muted-foreground">This sale was undone.</p>
      <p v-else-if="s.undoAsked && !owner" class="flex h-9 items-center justify-center gap-2 text-sm text-warning"><Icon name="Hourglass" :size="17"/>Waiting for Amina to approve the undo</p>
      <div v-else class="grid gap-2" :class="left > 0 ? 'grid-cols-2' : 'grid-cols-1'"><Btn :v="owner ? 'destructive-outline' : 'outline'" @click="askUndo">{{ owner ? 'Undo sale' : 'Ask to undo' }}</Btn><Btn v-if="left > 0" @click="S.sheet = 'takepay'">Take payment</Btn></div></FooterBar>
    <Sheet :open="S.sheet === 'takepay'" title="Take payment" :sub="c.name + ' · ' + s.id" @close="S.sheet = null"><div class="px-5 pb-4">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Amount</p><label class="mt-2 flex h-16 items-center gap-2 rounded-xl border-2 border-primary px-4"><span class="text-sm text-muted-foreground">TZS</span><input v-model.number="amt" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Amount" class="min-w-0 flex-1 bg-transparent text-right text-2xl font-bold tnum outline-none"></label>
      <div class="mt-2 flex gap-2"><button type="button" class="press h-8 rounded-full border px-4 text-sm font-medium" @click="amt = left">All {{ money(left) }}</button><button v-if="left > 1000" type="button" class="press h-8 rounded-full border px-4 text-sm font-medium" @click="amt = Math.round(left / 2)">Half</button></div>
      <p class="mb-2 mt-5 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Paid with</p><div class="flex flex-wrap gap-2"><button v-for="m in ['Cash', 'M-Pesa', 'Tigo Pesa', 'Airtel Money', 'Bank']" :key="m" type="button" @click="method = m" :class="['press h-9 rounded-md px-4 text-sm font-medium', method === m ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ m }}</button></div></div>
      <template #footer><Btn full :disabled="!amt" @click="record">Record {{ money(Math.min(amt || 0, left)) }}</Btn></template></Sheet></div>` };

/* ============================================================ Customers */
const CustomersList = { components: { Header, Icon, Av, Pill, Seg, Empty, AgeChip, Balance },
  setup() {
    const real = CUSTOMERS.filter(c => !c.walkin);
    const tabs = computed(() => [{ id: 'all', label: 'All', count: real.length }, { id: 'owe', label: 'Owing', count: real.filter(c => c.owes > 0).length }, { id: 'ok', label: 'Settled' }]);
    const rows = computed(() => real.filter(c => (S.custTab === 'all' || (S.custTab === 'owe' ? c.owes > 0 : c.owes <= 0)) && (c.name + c.phone + c.no).toLowerCase().includes(S.custQ.trim().toLowerCase())).sort((a, b) => b.owes - a.owes || a.name.localeCompare(b.name)));
    const owedAll = real.reduce((t, c) => t + Math.max(0, c.owes), 0);
    return { S, tabs, rows, owedAll, money, go, toast };
  },
  template: `<div class="relative flex min-h-0 flex-1 flex-col"><Header title="Customers"/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="sticky top-0 z-10 space-y-2.5 border-b bg-background px-3 py-2.5">
        <label class="flex h-9 items-center gap-2.5 rounded-md border bg-muted/50 px-3.5"><Icon name="Search" :size="18" class="text-muted-foreground"/><input v-model="S.custQ" type="search" placeholder="Name, phone or customer no." aria-label="Find a customer" class="min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-muted-foreground"></label>
        <Seg v-model="S.custTab" :tabs="tabs"/></div>
      <div class="px-3 pb-24 pt-3">
        <div class="mb-3 flex items-center justify-between rounded-xl bg-warning/10 px-4 py-3"><span class="text-sm text-muted-foreground">Owed to you</span><b class="text-base text-warning tnum">{{ money(owedAll) }}</b></div>
        <Empty v-if="!rows.length" icon="Users" title="No customers found" text="Try a different name or number."/>
        <div v-else class="overflow-hidden rounded-xl border bg-card"><button v-for="(c, i) in rows" :key="c.id" type="button" :class="['press flex w-full items-center gap-3 px-3.5 py-3 text-left', i ? 'border-t' : '']" @click="go('customer', c.id)">
          <Av :c="c" :size="36"/><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ c.name }}</span><span class="mt-0.5 flex items-center gap-1.5"><AgeChip v-if="c.owes > 0" :days="c.days"/><span v-else class="truncate text-xs text-muted-foreground">{{ c.phone || 'No phone' }}</span></span></span><Balance :b="c.owes"/></button></div></div></div>
    <button type="button" class="press absolute right-4 z-30 grid h-9 w-11 place-items-center rounded-full bg-primary text-primary-foreground shadow-lg" :style="{ bottom: '16px' }" aria-label="New customer" @click="toast('New customer: name and phone')"><Icon name="UserPlus" :size="23"/></button></div>` };

const Customer = { components: { Header, Icon, Av, Pill, Btn, Seg, Card, Row, AgeChip, SaleStatus, Sheet, FooterBar },
  setup() {
    const c = computed(() => cust(S.cid));
    const sales = computed(() => SALES.filter(s => s.c === S.cid));
    const unpaid = computed(() => sales.value.filter(s => s.pay === 'unpaid' || s.pay === 'part'));
    const tabs = [{ id: 'overview', label: 'Overview' }, { id: 'sales', label: 'Sales' }, { id: 'payments', label: 'Payments' }];
    const amt = ref(0); const method = ref('Cash');
    watch(() => S.sheet, (v) => { if (v === 'cpay') { amt.value = Math.max(0, c.value.owes); method.value = 'Cash'; } });
    const record = () => { const a = Math.min(+amt.value || 0, 1e9); if (!a) return; c.value.owes -= a; c.value.paid = (c.value.paid || 0) + a; S.sheet = null; newPayment(c.value.id, a, 'Cash', []); };
    const pays = computed(() => [['P-0052', '19 Sept, 17:22', 3000, 'Cash drawer'], ['P-0030', '11 Sept, 10:59', 1000, 'Cash drawer']]);
    const limitPct = computed(() => c.value.limit ? Math.min(100, Math.max(0, c.value.owes) / c.value.limit * 100) : 0);
    return { S, c, sales, unpaid, tabs, amt, method, record, pays, limitPct, saleTotal, itemsText, paidOf, money, go, toast };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header :title="c.name" pushed hide-search/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="space-y-3 p-3 pb-6">
      <section class="rise rounded-xl border bg-card p-4"><div class="flex items-center gap-3.5"><Av :c="c" :size="44"/><div class="min-w-0"><h2 class="truncate text-xl font-semibold leading-tight tracking-tight">{{ c.name }}</h2><p class="font-mono text-xs text-muted-foreground">{{ c.no }}</p>
          <button v-if="c.phone" type="button" class="press -ml-1 flex h-9 items-center gap-1.5 rounded-lg px-1 text-sm font-medium text-primary" @click="S.callTo = c; S.sheet = 'call'"><Icon name="Phone" :size="15"/>{{ c.phone }}</button><p v-else class="text-sm text-muted-foreground">No phone number</p></div></div>
        <div class="mt-4 grid grid-cols-2 gap-3"><div class="rounded-md bg-muted/60 p-3"><p class="text-xs text-muted-foreground">{{ c.owes < 0 ? 'Prepaid' : 'Owes you' }}</p><p :class="['text-xl font-bold tnum', c.owes > 0 ? 'text-warning' : c.owes < 0 ? 'text-success' : '']">{{ money(Math.abs(c.owes)) }}</p><p class="text-xs text-muted-foreground">{{ c.owes > 0 ? 'oldest unpaid ' + c.days + ' days' : 'nothing to collect' }}</p></div>
          <div class="rounded-md bg-muted/60 p-3"><p class="text-xs text-muted-foreground">Bought</p><p class="text-xl font-bold tnum">{{ money(c.bought) }}</p><p class="text-xs text-muted-foreground">since {{ c.since }}</p></div></div></section>
      <Seg v-model="S.custPane" :tabs="tabs"/>
      <template v-if="S.custPane === 'overview'">
        <Card v-if="unpaid.length" title="Unpaid sales" icon="HandCoins"><p class="pb-1 text-xs text-muted-foreground">Oldest first. The next payment pays the top one first.</p>
          <div v-for="(s, i) in unpaid" :key="s.id" class="mb-2 flex items-center gap-3 rounded-md border p-3"><span class="min-w-0 flex-1"><span class="flex flex-wrap items-center gap-1.5"><span class="font-mono text-xs font-medium">{{ s.id }}</span><Pill v-if="i === 0" tone="primary">Paid next</Pill><SaleStatus :s="s.pay"/></span><span class="mt-1 block text-xs text-muted-foreground">{{ s.day }} · {{ itemsText(s) }}</span></span><span class="text-sm font-semibold tnum">{{ money(saleTotal(s) - paidOf(s)) }}</span></div></Card>
        <Card title="Credit" icon="Gauge"><div class="py-3"><div class="flex items-baseline justify-between"><span class="text-sm text-muted-foreground">Limit {{ money(c.limit) }}</span><b class="text-sm tnum">{{ money(Math.max(0, c.limit - Math.max(0, c.owes))) }} left</b></div>
          <div class="mt-2 h-2.5 overflow-hidden rounded-full bg-muted"><div :class="['h-full rounded-full', limitPct > 85 ? 'bg-destructive' : limitPct > 60 ? 'bg-warning' : 'bg-primary']" :style="{ width: limitPct + '%' }"></div></div></div></Card>
        <Card title="Contact" icon="Contact"><Row k="Phone" :v="c.phone || '—'"/><Row k="Customer no." :v="c.no" mono/><Row k="Customer since" :v="c.since"/><Row k="Last payment" :v="c.last || '—'"/></Card></template>

const SHOP = { name: 'Office Shop', phone: '+255 754 000 111', lipa: '5551234 (Office Shop)' };
const RT = reactive({
  logo: true, address: 'Mwenge, Dar es Salaam', tin: '123-456-789', header: 'Karibu! Open 7:00 to 20:00', footer: 'Asante, karibu tena',
  blocks: { logo: true, shop: true, contact: true, header: true, meta: true, payment: true, how: true, footer: true }
});
const RBLOCKS = [
  ['logo', 'Logo', 'Image'], ['shop', 'Shop name', 'Store'], ['contact', 'Address, phone and TIN', 'MapPin'], ['header', 'Header line', 'Type'],
  ['meta', 'Number, date, cashier and customer', 'Hash'], ['items', 'Items', 'ShoppingCart', true], ['totals', 'Total', 'Sigma', true],
  ['payment', 'Paid, or on credit with the balance', 'Wallet'], ['how', 'How to pay', 'Smartphone'], ['footer', 'Footer line', 'MessageSquareText']
];
const FILLINS = ['{shop}', '{phone}', '{lipa}', '{customer}', '{balance}'];

/* the logo twice: as the owner uploaded it, and as the printer gets it (black and white, 384 dots wide, D206) */
const LOGO = (() => {
  try {
    const c = document.createElement('canvas'); c.width = 384; c.height = 120; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 384, 120);
    x.fillStyle = '#2f6fe0'; x.beginPath(); x.roundRect(8, 8, 104, 104, 22); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 54px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('OS', 60, 62);
    x.fillStyle = '#1d2a44'; x.textAlign = 'left'; x.font = 'bold 40px sans-serif'; x.fillText('Office', 130, 42); x.fillText('Shop', 130, 84);
    x.fillStyle = '#e9a23b'; x.fillRect(130, 106, 150, 6);
    const color = c.toDataURL();
    const d = x.getImageData(0, 0, 384, 120);
    for (let i = 0; i < d.data.length; i += 4) { const v = .299 * d.data[i] + .587 * d.data[i + 1] + .114 * d.data[i + 2] < 140 ? 0 : 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; }
    x.putImageData(d, 0, 0);
    return { color, bw: c.toDataURL() };
  } catch (e) { return { color: '', bw: '' }; }
})();

const WIDTH = 32;
const rdate = (day) => day === 'Today' ? '18 Oct 2026' : day === 'Yesterday' ? '17 Oct 2026' : day;
const wrapText = (t, w = WIDTH) => { const out = []; let cur = ''; String(t).split(/\s+/).filter(Boolean).forEach(word => { if ((cur + ' ' + word).trim().length > w) { if (cur) out.push(cur); cur = word; } else cur = (cur + ' ' + word).trim(); }); if (cur) out.push(cur); return out; };
const centre = (t) => ' '.repeat(Math.max(0, Math.floor((WIDTH - t.length) / 2))) + t;
const leftRight = (l, r) => l + ' '.repeat(Math.max(1, WIDTH - l.length - r.length)) + r;
const fillIn = (t, d) => String(t || '').replace(/\{(\w+)\}/g, (m, k) => ({ shop: SHOP.name, phone: SHOP.phone, lipa: SHOP.lipa, address: RT.address, tin: RT.tin, number: d.number, date: rdate(d.day), cashier: d.by, customer: d.cust || 'Walk-in customer', balance: d.balText })[k] ?? m);

/* what a receipt is made of: one structure from a sale or a payment, drawn three ways (print, PDF, text) */
function recData() {
  const src = S.recSrc;
  let d;
  if (src && src.kind === 'payment') {
    const p = PAYMENTS.find(x => x.id === src.id) || PAYMENTS[0], c = cust(p.c);
    d = { kind: 'payment', number: p.id, day: p.day, time: p.time, by: p.by, cust: c.walkin ? '' : c.name, method: p.method, total: p.amt, paid: p.amt, balance: c.owes, copy: !!src.copy, cancelled: false,
      lines: p.sales.map(id => ({ name: 'Pays ' + id, total: p.amt / p.sales.length })) };
  } else {
    const s = (src && src.kind === 'sale' ? SALES.find(x => x.id === src.id) : null) || S.receipt || SALES[0], c = cust(s.c), total = saleTotal(s);
    const paid = s.pay === 'undone' ? 0 : s.paid != null ? s.paid : (s.pay === 'paid' ? total : 0);
    d = { kind: 'sale', number: s.id, day: s.day, time: s.time, by: s.by, cust: c.walkin ? '' : c.name, method: s.method, total, paid, balance: c.owes, copy: !!(src && src.copy), cancelled: s.pay === 'undone',
      lines: s.lines.map(l => ({ name: prod(l[0]).name, qty: l[1], unit: prod(l[0]).price, total: prod(l[0]).price * l[1] })) };
  }
  d.balText = d.balance > 0 ? money(d.balance) : d.balance < 0 ? money(-d.balance) + ' in credit' : 'TZS 0';
  d.file = 'Receipt-' + d.number + '.pdf';
  return d;
}

/* the 58 mm paper, 32 letters across: exactly what the printer is sent (D207) */
function printLines(d) {
  const B = RT.blocks, o = [], rule = { t: '-'.repeat(WIDTH) }, add = (t, b) => o.push({ t, b });
  if (d.cancelled) o.push({ banner: 'CANCELLED' });
  if (B.logo && RT.logo) o.push({ logo: true });
  if (B.shop) wrapText(SHOP.name.toUpperCase()).forEach(t => add(centre(t), true));
  if (B.contact) { wrapText(RT.address).forEach(t => add(centre(t))); add(centre(SHOP.phone)); if (RT.tin) add(centre('TIN ' + RT.tin)); }
  if (B.header && RT.header) wrapText(fillIn(RT.header, d)).forEach(t => add(centre(t)));
  o.push(rule);
  if (B.meta) { add((d.kind === 'payment' ? 'Payment ' : 'Receipt ') + d.number, true); add(rdate(d.day) + '  ' + d.time); add('Served by ' + d.by); if (d.cust) wrapText('Customer ' + d.cust).forEach(t => add(t)); o.push(rule); }
  if (d.copy) { o.push({ banner: 'COPY' }); add(centre('Printed again 18 Oct 2026 11:05')); o.push(rule); }
  add(leftRight('ITEM', 'TZS'), true);
  d.lines.forEach(l => { if (l.qty) { wrapText(l.name).forEach(t => add(t)); add(leftRight('  ' + l.qty + ' x ' + num(l.unit), num(l.total))); } else add(leftRight(l.name, num(l.total))); });
  o.push(rule);
  add(leftRight(d.kind === 'payment' ? 'RECEIVED' : 'TOTAL', num(d.total)), true);
  if (B.payment && !d.cancelled) {
    if (d.kind === 'payment') add(leftRight('Paid by ' + d.method, num(d.paid)));
    else if (d.paid >= d.total) add(leftRight('Paid (' + d.method + ')', num(d.paid)));
    else { if (d.paid > 0) add(leftRight('Paid', num(d.paid))); add(leftRight('On credit', num(d.total - d.paid)), true); }
    if (d.cust && d.balance !== 0) add(leftRight('Balance owed', num(d.balance)));
  }
  if (B.how && d.balance > 0 && !d.cancelled) { o.push(rule); add(centre('Pay by Lipa Namba')); add(centre(SHOP.lipa.split(' ')[0])); }
  if (B.footer && RT.footer) { o.push(rule); wrapText(fillIn(RT.footer, d)).forEach(t => add(centre(t))); }
  return o;
}

/* a payment taken ends on its receipt as a sale does (D204) */
function newPayment(cid, amt, method, ids) {
  const n = 'P-00' + (91 + PAYMENTS.filter(p => p.fresh).length);
  const sales = ids.length ? ids : SALES.filter(s => s.c === cid && (s.pay === 'unpaid' || s.pay === 'part')).map(s => s.id).slice(0, 1);
  PAYMENTS.unshift({ id: n, c: cid, amt, acct: method === 'Cash' ? 'Cash drawer' : 'Lipa Namba', method, day: 'Today', time: '11:02', by: ME.value.name, sales: sales.length ? sales : ['S-1304'], fresh: true });
  S.recSrc = { kind: 'payment', id: n, copy: false }; S.print = 'idle'; S.stack.push(S.route); S.route = 'receipt';
}

/* the end of the day: stock, then cash, then send */
const Count = { components: { Header, Icon, Tile, Pill, Btn, Seg, Empty, FooterBar, Stepper },
  setup() {
    const steps = ['Stock', 'Cash', 'Send']; const expectedCash = 41500;
    const gaps = computed(() => PRODUCTS.filter(p => S.counted[p.id] !== p.stock));
    const cashGap = computed(() => (+S.cashCounted || 0) - expectedCash);
    const owner = computed(() => S.role === 'owner'); const hasGap = computed(() => gaps.value.length > 0 || cashGap.value !== 0);
    const next = () => { if (S.countStep < 2) S.countStep++; else { toast(owner.value || !hasGap.value ? 'The day is closed' : 'Sent to Amina'); S.countStep = 0; S.countPane = 'history'; } };
    const set = (p, d) => { S.counted[p.id] = Math.max(0, (S.counted[p.id] ?? p.stock) + d); };
    const decide = (c, yes) => { c.st = yes ? 'ok' : 'rejected'; toast(yes ? 'Gaps approved' : 'Sent back to Rehema'); };
    return { S, steps, gaps, cashGap, owner, hasGap, next, set, decide, PRODUCTS, COUNTS, expectedCash, money, money0, tint };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="End of day"/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="sticky top-0 z-10 border-b bg-background px-3 py-2.5"><Seg v-model="S.countPane" :tabs="[{ id: 'count', label: 'Count today' }, { id: 'history', label: 'History' }]"/></div>
      <div v-if="S.countPane === 'count'" class="p-3 pb-6">
        <div class="mb-3"><div class="mb-1.5 flex items-center justify-between text-xs"><span class="font-medium">Step {{ S.countStep + 1 }} of 3 · {{ steps[S.countStep] }}</span><span class="text-muted-foreground">Tue 13 Oct</span></div><div class="flex gap-1"><span v-for="(s, i) in steps" :key="s" :class="['h-1 flex-1 rounded-full', i <= S.countStep ? 'bg-primary' : 'bg-muted']"></span></div></div>
        <template v-if="S.countStep === 0"><p class="mb-2 px-1 text-xs text-muted-foreground">Count what is on the shelf. The books say how many there should be.</p><div class="overflow-hidden rounded-xl border bg-card"><div v-for="(p, i) in PRODUCTS" :key="p.id" :class="['flex items-center gap-3 p-3', i ? 'border-t' : '']"><Tile :p="p" :size="36"/><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ p.name }}</span>
          <span :class="['block text-xs tnum', S.counted[p.id] === p.stock ? 'text-muted-foreground' : 'font-medium text-warning']">{{ S.counted[p.id] === p.stock ? 'Books: ' + p.stock : (S.counted[p.id] < p.stock ? (p.stock - S.counted[p.id]) + ' short' : (S.counted[p.id] - p.stock) + ' more') + ' · books say ' + p.stock }}</span></span>
          <Stepper size="sm" :q="S.counted[p.id]" :step="1" :max="9999" @sub="set(p, -1)" @add="set(p, 1)"/></div></div></template>
        <template v-else-if="S.countStep === 1"><div class="rounded-xl border bg-card p-4"><p class="text-xs text-muted-foreground">The drawer should have</p><p class="text-2xl font-semibold tnum">{{ money(expectedCash) }}</p><p class="mt-0.5 text-xs text-muted-foreground">from the drawer's money ledger</p>
          <p class="mb-1.5 mt-4 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Count the cash</p><label class="flex h-12 items-center gap-2 rounded-md border-2 border-primary px-3"><span class="text-sm text-muted-foreground">TZS</span><input v-model.number="S.cashCounted" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Cash counted" class="min-w-0 flex-1 bg-transparent text-right text-xl font-semibold tnum outline-none"></label>
          <p :class="['mt-3 rounded-md px-3 py-2 text-sm', cashGap === 0 ? 'bg-success/10 text-success' : 'bg-warning/10 text-warning']">{{ cashGap === 0 ? 'The drawer matches.' : 'The drawer is ' + money(Math.abs(cashGap)) + (cashGap < 0 ? ' short.' : ' over.') }}</p></div></template>

          <label class="mt-3 block text-sm font-medium">Note<input v-model="S.countNote" placeholder="Anything Amina should know" class="mt-1.5 flex h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm shadow-sm outline-none focus-visible:ring-1 focus-visible:ring-ring"></label>

    <FooterBar v-if="S.countPane === 'count'"><div class="grid gap-2" :class="S.countStep ? 'grid-cols-[1fr_2fr]' : 'grid-cols-1'"><Btn v-if="S.countStep" v="outline" @click="S.countStep--">Back</Btn><Btn @click="next">{{ S.countStep < 2 ? 'Next: ' + steps[S.countStep + 1] : (owner || !hasGap ? 'Close the day' : 'Send to Amina') }}</Btn></div></FooterBar></div>` };

const Root = { components: { Screen, TabBar, Drawer, SearchView, PhoneSheets, Confirm, Toast, Picker, Icon, NetBar, UpdateBar, UpdateRequired },
  setup() {

    const clock = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    watch(() => S.dark, (d) => document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'), { immediate: true });
    const bar = computed(() => TABS.includes(S.route));
    return { S, scale, narrow, menu, clock, bar, KB };
  },
