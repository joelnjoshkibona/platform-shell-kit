   Tokens are the example's own (blue accent), kept in HSL channels; the sizes are the phone kit's (see the Design system screen). */
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] },
    colors: ['background','foreground','card','muted','muted-foreground','border','input','primary','primary-foreground','destructive','warning','success','canvas','ring']
      .reduce((o, k) => (o[k] = 'hsl(var(--' + k + ') / <alpha-value>)', o), {}),
    borderRadius: { sm: 'calc(var(--radius) - 4px)', md: 'calc(var(--radius) - 2px)', lg: 'var(--radius)' }
  } }
};

.pg-push-enter-from, .pg-step-next-enter-from { transform: translateX(100%); } .pg-push-enter-active, .pg-step-next-enter-active { position: relative; z-index: 2; box-shadow: -12px 0 24px rgb(0 0 0 / .10); }

/* the splash opens (SplashOpen): a circle closes into the mark; an example P114 boot loader builds its mark meanwhile (CSS only) */
.splash { position: absolute; inset: 0; z-index: 120; display: grid; place-items: center; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); clip-path: circle(150% at 50% 42%); }

@keyframes blink { 50% { opacity: 0; } } .caret { animation: blink 1s steps(1) infinite; }

   phone      the phone's own Laravel and SQLite are the backend: no server, no sign-in; backups to a file.
   sync       a working copy on the phone + a queue of changes waiting; each change carries a key the server remembers, so a
              repeat does nothing (P60 amended for this mode only); GET /sync/changes?since= brings the server's changes back;
              a changed-on-both-sides record answers 409 with the server's copy: mine and theirs side by side. */
const SYNCS = reactive({
  mode: 'connected', last: '5 min ago', running: false, first: 0,
  waiting: [
    { id: 'q1', icon: 'Receipt', what: 'Sale S-1305 · TZS 4,000', when: '10:42' },

const Stepper = { props: { q: Number, step: { type: Number, default: 1 }, max: Number, size: { type: String, default: 'md' }, full: Boolean }, components: { Icon },
  template: `<div :class="['items-center rounded-md border bg-background', full ? 'flex w-full justify-between' : 'inline-flex shrink-0', size === 'sm' ? 'h-9' : 'h-9']"><button type="button" class="press grid h-full w-12 place-items-center" aria-label="One less" @click="$emit('sub')"><Icon name="Minus" :size="17"/></button>
    <span class="min-w-9 text-center text-sm font-semibold tnum" aria-live="polite">{{ q }}</span><button type="button" :disabled="q + step > max" :class="['press grid h-full w-12 place-items-center', q + step > max ? 'opacity-35' : '']" aria-label="One more" @click="$emit('add')"><Icon name="Plus" :size="17"/></button></div>` };

const qtyOf = (id) => (S.cart.find(l => l.id === id) || { q: 0 }).q;
function addP(p) {
  const l = S.cart.find(x => x.id === p.id);
  if (l) { if (l.q + p.step > p.stock) return toast('Only ' + p.stock + ' ' + p.units + ' left'); l.q += p.step; }
  else { if (p.stock < p.step) return toast(p.stock ? 'Sold in steps of ' + p.step : p.name + ' is out of stock'); S.cart.push({ id: p.id, q: p.step }); }
}
function subP(p) { const l = S.cart.find(x => x.id === p.id); if (!l) return; l.q -= p.step; if (l.q <= 0) S.cart.splice(S.cart.indexOf(l), 1); }
const cartTotal = computed(() => S.cart.reduce((t, l) => t + prod(l.id).price * l.q, 0));
const cartUnits = computed(() => S.cart.reduce((t, l) => t + l.q, 0));
const payNow = computed(() => S.pay === 'cash' ? cartTotal.value : (S.part ? Math.min(cartTotal.value, S.partAmt || 0) : 0));
const owesAfter = computed(() => cust(S.customer).owes + cartTotal.value - payNow.value);
const overLimit = computed(() => S.pay === 'credit' && !cust(S.customer).walkin && cust(S.customer).limit > 0 && owesAfter.value > cust(S.customer).limit);
const canCharge = computed(() => cartTotal.value > 0 && !(S.pay === 'credit' && cust(S.customer).walkin));
S.partAmt = 0;
let nextSale = 1305;
function charge() {
  const lines = S.cart.map(l => [l.id, l.q]);
  const paid = payNow.value, total = cartTotal.value;
  const sale = { id: 'S-' + (nextSale++), c: S.customer, day: 'Today', time: '11:02', lines, pay: paid >= total ? 'paid' : paid > 0 ? 'part' : 'unpaid', method: S.pay === 'cash' ? 'Cash' : 'Credit', by: ME.value.name, paid, fresh: true };
  SALES.unshift(sale); if (sale.pay !== 'paid') cust(S.customer).owes += total - paid;
  S.receipt = sale; S.recSrc = null; S.print = 'idle'; S.cart = []; S.cartOpen = false; S.partAmt = 0; S.part = false; S.pay = 'cash';
  S.route = 'receipt';
}

      <span class="grid h-9 w-9 place-items-center rounded-md bg-muted"><Icon :name="a[1]" :size="19"/></span><span class="flex-1 text-sm font-medium">{{ a[0] }}</span><Icon v-if="S.account === a[0]" name="Check" :size="20" class="text-primary"/></button></div></Sheet>

/* ============================================================ P115 on a phone: Add a line picks from the catalogue
   ItemCatalogue (the step itself: sticky search, category chips, price, stock, the quantity already in the document) → a tap opens QtySheet
   (large quantity, − / +, +10 … +100, the line total, Add / Update / Remove; limits by stock and by a money ceiling) → CartBar opens the lines.
   The lines, the draft, the save and the server rules are P115's. Drawn here as a customer order (a document with lines), next to the till,
   which keeps its own tap-to-add pattern. */
const CATEGORY = { p1: 'Drinks', p3: 'Drinks', p2: 'Snacks', p4: 'Snacks', p5: 'Groceries', p6: 'Household' };
const DOC = reactive({ c: 'c2', pay: 'cash', lines: [], step: 0, dir: 'step-next', q: '', cat: 'All', qtyId: null, qtyStart: null });
const docQty = (id) => (DOC.lines.find(l => l.id === id) || { q: 0 }).q;
const docTotal = computed(() => DOC.lines.reduce((t, l) => t + prod(l.id).price * l.q, 0));
const docUnits = computed(() => DOC.lines.reduce((t, l) => t + l.q, 0));
function docSet(id, q) { const l = DOC.lines.find(x => x.id === id); if (q <= 0) { if (l) DOC.lines.splice(DOC.lines.indexOf(l), 1); return; } if (l) l.q = q; else DOC.lines.push({ id, q }); }
function docReset(c = 'c2', pay = 'cash') { Object.assign(DOC, { c, pay, lines: [], step: 0, dir: 'step-next', q: '', cat: 'All', qtyId: null, qtyStart: null }); }
/* the money ceiling: on credit, what is left of the customer's limit after what they owe and the other lines */
const docRoom = (exceptId) => { const c = cust(DOC.c); if (DOC.pay !== 'credit' || !c.limit) return null; return c.limit - c.owes - DOC.lines.filter(l => l.id !== exceptId).reduce((t, l) => t + prod(l.id).price * l.q, 0); };

/* QtySheet */
const QtySheet = { components: { Sheet, Icon, Btn, Tile },
  setup() {
    const p = computed(() => prod(DOC.qtyId)); const had = computed(() => docQty(DOC.qtyId));
    const q = ref(0); watch(() => DOC.qtyId, (id) => { if (id) q.value = DOC.qtyStart != null ? DOC.qtyStart : (docQty(id) || prod(id).step); }, { immediate: true });
    const max = computed(() => p.value ? p.value.stock : 0);
    const room = computed(() => DOC.qtyId ? docRoom(DOC.qtyId) : null);
    const total = computed(() => p.value ? p.value.price * q.value : 0);
    const overStock = computed(() => q.value > max.value); const atStock = computed(() => q.value === max.value);
    const overRoom = computed(() => room.value != null && total.value > room.value);
    const set = (v) => { q.value = Math.max(0, Math.min(max.value, Math.round(v))); };
    const ok = computed(() => q.value > 0 && !overStock.value && !overRoom.value);
    const save = () => { docSet(DOC.qtyId, q.value); S.sheet = null; DOC.qtyStart = null; };
    const remove = () => { docSet(DOC.qtyId, 0); S.sheet = null; DOC.qtyStart = null; };
    return { S, DOC, p, had, q, max, room, total, overStock, atStock, overRoom, set, ok, save, remove, money, num };
  },
  template: `<Sheet :open="S.sheet === 'qty' && !!p" :title="p ? p.name : ''" :sub="p ? money(p.price) + ' per ' + p.unit + ' · ' + p.stock + ' ' + p.units + ' in stock' : ''" @close="S.sheet = null">
    <div v-if="p" class="space-y-4 px-5 pb-3">
      <div class="flex items-center gap-3"><button type="button" class="press grid h-14 w-14 shrink-0 place-items-center rounded-xl border text-2xl" aria-label="One less" @click="set(q - p.step)"><Icon name="Minus" :size="22"/></button>
        <input :value="q" inputmode="numeric" aria-label="Quantity" class="h-14 min-w-0 flex-1 rounded-xl border border-input bg-background text-center text-3xl font-bold tnum outline-none focus:border-primary" @input="e => set(+e.target.value.replace(/\\D/g, '') || 0)">
        <button type="button" :disabled="q + p.step > max" class="press grid h-14 w-14 shrink-0 place-items-center rounded-xl border text-2xl disabled:opacity-35" aria-label="One more" @click="set(q + p.step)"><Icon name="Plus" :size="22"/></button></div>
      <div class="grid grid-cols-4 gap-2"><button v-for="n in [10, 20, 50, 100]" :key="n" type="button" :disabled="q >= max" class="press h-10 rounded-lg bg-muted text-sm font-semibold disabled:opacity-40" @click="set(q + n)">+{{ n }}</button></div>
      <p v-if="atStock" class="flex gap-2 rounded-lg bg-warning/10 p-2.5 text-xs text-warning"><Icon name="PackageMinus" :size="15"/>That is all {{ max }} {{ p.units }} in stock.</p>
      <p v-if="overRoom" class="flex gap-2 rounded-lg bg-destructive/10 p-2.5 text-xs text-destructive"><Icon name="CircleAlert" :size="15"/>Only {{ money(Math.max(0, room)) }} of the credit limit is left. Lower the quantity or take cash.</p>
      <div class="flex items-center justify-between rounded-lg bg-muted/60 px-3.5 py-2.5 text-sm"><span class="text-muted-foreground">{{ num(q) }} × {{ money(p.price) }}</span><span class="text-base font-bold tnum">{{ money(total) }}</span></div></div>
    <template #footer><div :class="['grid gap-2', had ? 'grid-cols-[auto_1fr]' : '']"><Btn v-if="had" v="destructive-outline" class="h-12 px-4" aria-label="Remove the line" @click="remove"><Icon name="Trash2" :size="18"/></Btn><Btn full class="h-12" :disabled="!ok" @click="save">{{ had ? 'Update' : 'Add' }} · {{ money(total) }}</Btn></div></template></Sheet>` };

/* LinesSheet: the lines (P115's DocLines in a sheet): change opens the quantity sheet, the bin removes */
const LinesSheet = { props: { title: { type: String, default: 'The order' } }, components: { Sheet, Icon, Tile, Btn },

    <template #footer><div class="flex items-center justify-between pb-1"><span class="text-sm text-muted-foreground">Total</span><span class="text-lg font-bold tnum">{{ money(docTotal) }}</span></div></template></Sheet>` };

/* CartBar: sticky at the bottom of the catalogue */
const CartBar = { components: { Icon }, setup() { return { S, DOC, money, docTotal, docUnits }; },

/* ItemCatalogue: the catalogue is the step itself */
const ItemCatalogue = { components: { Icon, Tile, Pill, CartBar },
  setup() {
    const cats = ['All', ...new Set(Object.values(CATEGORY))];

  template: `<div>

      <span class="text-right"><span class="block text-sm font-semibold tnum">{{ money(p.price) }}</span><span class="block text-[11px] text-muted-foreground">per {{ p.unit }}</span></span></button>
      <p v-if="!list.length" class="py-8 text-center text-sm text-muted-foreground">No item matches “{{ DOC.q }}”</p></div>

/* NewOrder: a document with lines, three steps; the steps slide by direction (PageTransition 'step-next' / 'step-back'); it ends in the done moment */

const NewOrder = { components: { Header, Icon, Av, Btn, FooterBar, ItemCatalogue, Seg, Tile, QtySheet, LinesSheet },
  setup() {
    const steps = ['Customer', 'Lines', 'Check'];
    const people = CUSTOMERS.filter(c => !c.walkin);
    const room = computed(() => docRoom(null));
    const ok = computed(() => [!!DOC.c, DOC.lines.length > 0 && !(room.value != null && room.value < 0), true][DOC.step]);
    const next = () => { if (DOC.step < 2) { DOC.dir = 'step-next'; DOC.step++; return; }
      const c = cust(DOC.c), total = docTotal.value, units = docUnits.value, n = DOC.lines.length; const ref = 'SO-0042';
      S.stack = ['home']; S.nav = 'tab'; S.route = 'home';
      done({ title: 'Order made', ref, text: DOC.pay === 'credit' ? 'On credit: ' + c.name + ' owes ' + money(c.owes + total) + ' now.' : c.name + ' pays when the goods are picked up.',
        facts: [['Customer', c.name], ['Lines', n + ' lines · ' + units + ' units'], ['Total', money(total)]],
        primary: ['Print the order', () => toast('Printing SO-0042'), 'Printer'], secondary: ['Make another order', () => { docReset(); go('neworder'); }, 'Plus'] });
      docReset(); };
    const prev = () => { DOC.dir = 'step-back'; DOC.step--; };
    return { S, DOC, steps, people, room, ok, next, prev, cust, money, num, prod, docTotal, docUnits, pinLeaving };
  },

      <div v-if="DOC.step === 0" class="space-y-3 p-3"><Seg v-model="DOC.pay" :tabs="[{ id: 'cash', label: 'Cash' }, { id: 'credit', label: 'Credit' }]"/>
        <button v-for="c in people" :key="c.id" type="button" :class="['press flex w-full items-center gap-3 rounded-xl border p-3 text-left', DOC.c === c.id ? 'border-primary bg-primary/5' : 'bg-card']" @click="DOC.c = c.id"><Av :c="c" :size="40"/><span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold">{{ c.name }}</span><span class="block text-xs text-muted-foreground">{{ c.limit ? 'Credit limit ' + money(c.limit) + (c.owes > 0 ? ' · owes ' + money(c.owes) : '') : 'No credit' }}</span></span><Icon v-if="DOC.c === c.id" name="CircleCheck" :size="20" class="text-primary"/></button></div>

      <div v-else class="space-y-3 p-3"><div class="rounded-xl border bg-card"><div class="flex justify-between px-4 py-2.5 text-sm"><span class="text-muted-foreground">Customer</span><span class="font-medium">{{ cust(DOC.c).name }}</span></div><div class="flex justify-between border-t px-4 py-2.5 text-sm"><span class="text-muted-foreground">Payment</span><span class="font-medium">{{ DOC.pay === 'credit' ? 'Credit' : 'Cash' }}</span></div></div>

/* ============================================================ Sales */

const paidOf = (s) => s.pay === 'paid' ? saleTotal(s) : s.pay === 'part' ? (s.paid || 0) : 0;

const FilterSheet = { props: { open: Boolean }, components: { Sheet, Btn },

const SalesList = { components: { Header, Icon, Av, Pill, Seg, Empty, FilterBar, SaleStatus, FilterSheet },
  setup() {
    const tabs = computed(() => [{ id: 'all', label: 'All' }, { id: 'unpaid', label: 'Unpaid', count: SALES.filter(s => s.pay === 'unpaid').length }, { id: 'part', label: 'Part paid', count: SALES.filter(s => s.pay === 'part').length }]);

        && (!S.salesQ || (s.id + cust(s.c).name).toLowerCase().includes(S.salesQ.toLowerCase()));
    }));
    const groups = computed(() => { const g = []; rows.value.slice(0, S.shown).forEach(s => { let x = g.find(y => y.day === s.day); if (!x) g.push(x = { day: s.day, rows: [] }); x.rows.push(s); }); return g; });
    const dayTotal = (g) => money(g.rows.reduce((t, s) => t + saleTotal(s), 0));

    const refresh = () => { S.list = 'loading'; setTimeout(() => { if (S.list === 'loading') S.list = 'data'; }, 900); };
    return { S, tabs, rows, groups, dayTotal, active, summary, refresh, waitingN, ME, cust, saleTotal, itemsText, money, go, tab };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="Sales"/>

const Row = { props: { k: String, v: String, mono: Boolean }, template: `<div class="flex items-center justify-between gap-4 py-2.5 text-sm"><span class="text-muted-foreground">{{ k }}</span><span :class="['text-right font-medium', mono ? 'font-mono text-sm' : '']"><slot>{{ v }}</slot></span></div>` };
const Card = { props: { title: String, icon: String }, components: { Icon },
  template: `<section class="rise rounded-xl border bg-card"><h3 v-if="title" class="flex items-center gap-2 px-4 pt-3.5 text-sm font-semibold"><Icon v-if="icon" :name="icon" :size="17" class="text-muted-foreground"/>{{ title }}</h3><div class="px-4 pb-2"><slot/></div></section>` };

const SalePage = { components: { Header, Icon, Av, Pill, Btn, Card, Row, SaleStatus, Sheet, FooterBar },
  setup() {
    const s = computed(() => SALES.find(x => x.id === S.saleId) || SALES[0]);
    const c = computed(() => cust(s.value.c));
    const total = computed(() => saleTotal(s.value));
    const left = computed(() => s.value.pay === 'undone' ? 0 : total.value - paidOf(s.value));
    const owner = computed(() => ME.value.role === 'Owner');
    const amt = ref(0); const method = ref('Cash');
    watch(() => S.sheet, (v) => { if (v === 'takepay') { amt.value = left.value; method.value = 'Cash'; } });
    const askUndo = () => { S.dialog = { title: owner.value ? 'Undo ' + s.value.id + '?' : 'Ask Amina to undo ' + s.value.id + '?', text: owner.value ? 'The stock goes back on the shelf and ' + c.value.name + "'s balance changes." : 'Nothing changes until she approves. She sees your request in Waiting for you.', action: owner.value ? 'Undo the sale' : 'Send the request', tone: owner.value ? 'destructive' : 'primary', cancel: 'Keep the sale',
      ok: () => { if (owner.value) { s.value.pay = 'undone'; s.value.undone = true; if (c.value.owes > 0) c.value.owes = Math.max(0, c.value.owes - left.value); toast(s.value.id + ' undone'); } else { s.value.undoAsked = true; toast('Sent to Amina'); } } }; };
    const record = () => { const a = Math.min(Math.max(+amt.value || 0, 0), left.value); if (!a) return; s.value.paid = paidOf(s.value) + a; s.value.pay = s.value.paid >= total.value ? 'paid' : 'part'; c.value.owes = Math.max(0, c.value.owes - a); S.sheet = null; newPayment(c.value.id, a, method.value, [s.value.id]); };
    const openReceipt = () => { S.recSrc = { kind: 'sale', id: s.value.id, copy: true }; S.print = 'idle'; go('receipt'); };
    return { S, s, c, total, left, owner, amt, method, askUndo, record, openReceipt, prod, money, go, paidOf, tint };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header :title="s.id" pushed hide-search/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="space-y-3 p-3 pb-6">
      <section class="rise rounded-xl border bg-card p-4"><button type="button" class="press -m-1 flex w-[calc(100%+8px)] items-center gap-3 rounded-md p-1 text-left" @click="!c.walkin && go('customer', c.id)"><Av :c="c" :size="36"/>
          <span class="min-w-0 flex-1"><span class="block truncate text-base font-semibold">{{ c.name }}</span><span class="block text-xs text-muted-foreground">{{ s.day }}, {{ s.time }} · sold by {{ s.by }}</span></span><Icon v-if="!c.walkin" name="ChevronRight" :size="18" class="text-muted-foreground"/></button>
        <div class="mt-4 flex items-end justify-between"><div><p class="text-xs text-muted-foreground">Sale total</p><p class="text-2xl font-bold leading-tight tracking-tight tnum">{{ money(total) }}</p></div><SaleStatus :s="s.pay"/></div>
        <div v-if="s.pay === 'unpaid' || s.pay === 'part'" class="mt-3 flex items-center justify-between rounded-md bg-warning/10 px-3.5 py-2.5 text-sm"><span class="text-warning">Left to pay</span><b class="text-warning tnum">{{ money(left) }}</b></div></section>
      <Card title="Items" icon="ShoppingCart"><div v-for="l in s.lines" :key="l[0]" class="flex items-center justify-between border-b py-3 last:border-0"><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ prod(l[0]).name }}</span><span class="block text-xs text-muted-foreground tnum">{{ l[1] }} × {{ money(prod(l[0]).price) }} · oldest batch</span></span><span class="text-sm font-semibold tnum">{{ money(prod(l[0]).price * l[1]) }}</span></div></Card>
      <Card title="Payment" icon="Wallet"><Row k="Method" :v="s.method"/><Row k="Paid" :v="money(paidOf(s))"/><Row k="Left to pay" :v="money(left)"/></Card>
      <button type="button" class="press flex w-full items-center gap-3 rounded-xl border bg-card px-4 py-3 text-left" @click="openReceipt"><span class="grid h-9 w-9 place-items-center rounded-md bg-muted"><Icon name="ReceiptText" :size="19"/></span><span class="min-w-0 flex-1"><span class="block text-sm font-semibold">Receipt</span><span class="block text-xs text-muted-foreground">Print it or share it again</span></span><Icon name="ChevronRight" :size="18" class="text-muted-foreground"/></button>
      <Card title="What happened" icon="History"><ol class="py-2"><li v-for="(e, i) in [s.undone ? ['Undone', s.day + ', 11:20', 'Amina approved'] : null, s.undoAsked ? ['Undo asked', s.day + ', 11:05', 'Rehema: wrong customer'] : null, s.pay !== 'unpaid' && !s.undone ? ['Payment', s.day + ', ' + s.time, money(paidOf(s)) + ' · ' + s.method] : null, ['Sold', s.day + ', ' + s.time, 'by ' + s.by]].filter(Boolean)" :key="i" class="relative flex gap-3 pb-4 last:pb-0">
          <span class="relative mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full bg-primary"><span class="absolute left-1/2 top-3 h-[calc(100%+22px)] w-px -translate-x-1/2 bg-border"></span></span><span class="min-w-0"><span class="block text-sm font-medium">{{ e[0] }}</span><span class="block text-xs text-muted-foreground">{{ e[1] }} · {{ e[2] }}</span></span></li></ol></Card></div></div>
    <FooterBar><p v-if="s.undone" class="py-2 text-center text-sm text-muted-foreground">This sale was undone.</p>
      <p v-else-if="s.undoAsked && !owner" class="flex h-9 items-center justify-center gap-2 text-sm text-warning"><Icon name="Hourglass" :size="17"/>Waiting for Amina to approve the undo</p>

      <p class="text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Amount</p><label class="mt-2 flex h-16 items-center gap-2 rounded-xl border-2 border-primary px-4"><span class="text-sm text-muted-foreground">TZS</span><input v-model.number="amt" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Amount" class="min-w-0 flex-1 bg-transparent text-right text-2xl font-bold tnum outline-none"></label>

      <p class="mb-2 mt-5 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Paid with</p><div class="flex flex-wrap gap-2"><button v-for="m in ['Cash', 'M-Pesa', 'Tigo Pesa', 'Airtel Money', 'Bank']" :key="m" type="button" @click="method = m" :class="['press h-9 rounded-md px-4 text-sm font-medium', method === m ? 'bg-primary text-primary-foreground' : 'bg-muted text-muted-foreground']">{{ m }}</button></div></div>
      <template #footer><Btn full :disabled="!amt" @click="record">Record {{ money(Math.min(amt || 0, left)) }}</Btn></template></Sheet></div>` };

/* ============================================================ Customers */
const CustomersList = { components: { Header, Icon, Av, Pill, Seg, Empty, AgeChip, Balance },

    const owedAll = real.reduce((t, c) => t + Math.max(0, c.owes), 0);
    return { S, tabs, rows, owedAll, money, go, toast };

  template: `<div class="relative flex min-h-0 flex-1 flex-col"><Header title="Customers"/>

const Customer = { components: { Header, Icon, Av, Pill, Btn, Seg, Card, Row, AgeChip, SaleStatus, Sheet, FooterBar },
  setup() {
    const c = computed(() => cust(S.cid));
    const sales = computed(() => SALES.filter(s => s.c === S.cid));
    const unpaid = computed(() => sales.value.filter(s => s.pay === 'unpaid' || s.pay === 'part'));
    const tabs = [{ id: 'overview', label: 'Overview' }, { id: 'sales', label: 'Sales' }, { id: 'payments', label: 'Payments' }];
    const amt = ref(0); const method = ref('Cash');
    watch(() => S.sheet, (v) => { if (v === 'cpay') { amt.value = Math.max(0, c.value.owes); method.value = 'Cash'; } });
    const record = () => { const a = Math.min(+amt.value || 0, 1e9); if (!a) return; c.value.owes -= a; c.value.paid = (c.value.paid || 0) + a; S.sheet = null; newPayment(c.value.id, a, 'Cash', []); };
    const pays = computed(() => [['P-0052', '19 Sept, 17:22', 3000, 'Cash drawer'], ['P-0030', '11 Sept, 10:59', 1000, 'Cash drawer']]);
    const limitPct = computed(() => c.value.limit ? Math.min(100, Math.max(0, c.value.owes) / c.value.limit * 100) : 0);
    return { S, c, sales, unpaid, tabs, amt, method, record, pays, limitPct, saleTotal, itemsText, paidOf, money, go, toast };

  template: `<div class="flex min-h-0 flex-1 flex-col"><Header :title="c.name" pushed hide-search/>

        <div class="mt-4 grid grid-cols-2 gap-3"><div class="rounded-md bg-muted/60 p-3"><p class="text-xs text-muted-foreground">{{ c.owes < 0 ? 'Prepaid' : 'Owes you' }}</p><p :class="['text-xl font-bold tnum', c.owes > 0 ? 'text-warning' : c.owes < 0 ? 'text-success' : '']">{{ money(Math.abs(c.owes)) }}</p><p class="text-xs text-muted-foreground">{{ c.owes > 0 ? 'oldest unpaid ' + c.days + ' days' : 'nothing to collect' }}</p></div>
          <div class="rounded-md bg-muted/60 p-3"><p class="text-xs text-muted-foreground">Bought</p><p class="text-xl font-bold tnum">{{ money(c.bought) }}</p><p class="text-xs text-muted-foreground">since {{ c.since }}</p></div></div></section>
      <Seg v-model="S.custPane" :tabs="tabs"/>
      <template v-if="S.custPane === 'overview'">
        <Card v-if="unpaid.length" title="Unpaid sales" icon="HandCoins"><p class="pb-1 text-xs text-muted-foreground">Oldest first. The next payment pays the top one first.</p>
          <div v-for="(s, i) in unpaid" :key="s.id" class="mb-2 flex items-center gap-3 rounded-md border p-3"><span class="min-w-0 flex-1"><span class="flex flex-wrap items-center gap-1.5"><span class="font-mono text-xs font-medium">{{ s.id }}</span><Pill v-if="i === 0" tone="primary">Paid next</Pill><SaleStatus :s="s.pay"/></span><span class="mt-1 block text-xs text-muted-foreground">{{ s.day }} · {{ itemsText(s) }}</span></span><span class="text-sm font-semibold tnum">{{ money(saleTotal(s) - paidOf(s)) }}</span></div></Card>
        <Card title="Credit" icon="Gauge"><div class="py-3"><div class="flex items-baseline justify-between"><span class="text-sm text-muted-foreground">Limit {{ money(c.limit) }}</span><b class="text-sm tnum">{{ money(Math.max(0, c.limit - Math.max(0, c.owes))) }} left</b></div>
          <div class="mt-2 h-2.5 overflow-hidden rounded-full bg-muted"><div :class="['h-full rounded-full', limitPct > 85 ? 'bg-destructive' : limitPct > 60 ? 'bg-warning' : 'bg-primary']" :style="{ width: limitPct + '%' }"></div></div></div></Card>

/* ============================================================ Alerts (notifications), Profile, and the phone's own sheets */
const Alerts = { components: { Header, Icon, Seg, Empty, Pill, Btn },
  setup() {
    const tabs = computed(() => [{ id: 'unread', label: 'Unread', count: unread.value }, { id: 'all', label: 'All' }]);
    const rows = computed(() => NOTIFS.filter(n => S.notifTab === 'all' || n.unread));
    const tap = (n) => { S.expanded = S.expanded === n.id ? null : n.id; n.unread = false; };
    const open = (n) => { n.unread = false; const o = n.open; if (o.startsWith('S-')) go('sale', o); else if (o === 'Product') { S.pid = 'p2'; go('product'); } else if (o === 'Count') go('count'); else if (o.startsWith('DEL-')) { S.delId = o; go('delivery'); } else if (o.startsWith('P-')) { S.payId = o; go('payment'); } };
    const readAll = () => { NOTIFS.forEach(n => (n.unread = false)); toast('All marked as read'); };
    return { S, tabs, rows, tap, open, readAll, unread };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="Alerts"><template #right><button v-if="unread" type="button" class="press mr-1 h-8 rounded-lg px-3 text-sm font-semibold text-primary" @click="readAll">Read all</button></template></Header>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="sticky top-0 z-10 border-b bg-background px-3 py-2.5"><Seg v-model="S.notifTab" :tabs="tabs"/></div>

/* ============================================================ receipts (D204-D208): the sale-done screen, the paper, the owner's Receipt settings */
const SHOP = { name: 'Office Shop', phone: '+255 754 000 111', lipa: '5551234 (Office Shop)' };
const RT = reactive({
  logo: true, address: 'Mwenge, Dar es Salaam', tin: '123-456-789', header: 'Karibu! Open 7:00 to 20:00', footer: 'Asante, karibu tena',
  blocks: { logo: true, shop: true, contact: true, header: true, meta: true, payment: true, how: true, footer: true }
});
const RBLOCKS = [
  ['logo', 'Logo', 'Image'], ['shop', 'Shop name', 'Store'], ['contact', 'Address, phone and TIN', 'MapPin'], ['header', 'Header line', 'Type'],
  ['meta', 'Number, date, cashier and customer', 'Hash'], ['items', 'Items', 'ShoppingCart', true], ['totals', 'Total', 'Sigma', true],
  ['payment', 'Paid, or on credit with the balance', 'Wallet'], ['how', 'How to pay', 'Smartphone'], ['footer', 'Footer line', 'MessageSquareText']
];
const FILLINS = ['{shop}', '{phone}', '{lipa}', '{customer}', '{balance}'];

/* the logo twice: as the owner uploaded it, and as the printer gets it (black and white, 384 dots wide, D206) */
const LOGO = (() => {
  try {
    const c = document.createElement('canvas'); c.width = 384; c.height = 120; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, 384, 120);
    x.fillStyle = '#2f6fe0'; x.beginPath(); x.roundRect(8, 8, 104, 104, 22); x.fill();
    x.fillStyle = '#fff'; x.font = 'bold 54px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('OS', 60, 62);
    x.fillStyle = '#1d2a44'; x.textAlign = 'left'; x.font = 'bold 40px sans-serif'; x.fillText('Office', 130, 42); x.fillText('Shop', 130, 84);
    x.fillStyle = '#e9a23b'; x.fillRect(130, 106, 150, 6);
    const color = c.toDataURL();
    const d = x.getImageData(0, 0, 384, 120);
    for (let i = 0; i < d.data.length; i += 4) { const v = .299 * d.data[i] + .587 * d.data[i + 1] + .114 * d.data[i + 2] < 140 ? 0 : 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; }
    x.putImageData(d, 0, 0);
    return { color, bw: c.toDataURL() };
  } catch (e) { return { color: '', bw: '' }; }
})();

const WIDTH = 32;
const rdate = (day) => day === 'Today' ? '18 Oct 2026' : day === 'Yesterday' ? '17 Oct 2026' : day;
const wrapText = (t, w = WIDTH) => { const out = []; let cur = ''; String(t).split(/\s+/).filter(Boolean).forEach(word => { if ((cur + ' ' + word).trim().length > w) { if (cur) out.push(cur); cur = word; } else cur = (cur + ' ' + word).trim(); }); if (cur) out.push(cur); return out; };
const centre = (t) => ' '.repeat(Math.max(0, Math.floor((WIDTH - t.length) / 2))) + t;
const leftRight = (l, r) => l + ' '.repeat(Math.max(1, WIDTH - l.length - r.length)) + r;
const fillIn = (t, d) => String(t || '').replace(/\{(\w+)\}/g, (m, k) => ({ shop: SHOP.name, phone: SHOP.phone, lipa: SHOP.lipa, address: RT.address, tin: RT.tin, number: d.number, date: rdate(d.day), cashier: d.by, customer: d.cust || 'Walk-in customer', balance: d.balText })[k] ?? m);

/* what a receipt is made of: one structure from a sale or a payment, drawn three ways (print, PDF, text) */
function recData() {
  const src = S.recSrc;
  let d;
  if (src && src.kind === 'payment') {
    const p = PAYMENTS.find(x => x.id === src.id) || PAYMENTS[0], c = cust(p.c);
    d = { kind: 'payment', number: p.id, day: p.day, time: p.time, by: p.by, cust: c.walkin ? '' : c.name, method: p.method, total: p.amt, paid: p.amt, balance: c.owes, copy: !!src.copy, cancelled: false,
      lines: p.sales.map(id => ({ name: 'Pays ' + id, total: p.amt / p.sales.length })) };
  } else {
    const s = (src && src.kind === 'sale' ? SALES.find(x => x.id === src.id) : null) || S.receipt || SALES[0], c = cust(s.c), total = saleTotal(s);
    const paid = s.pay === 'undone' ? 0 : s.paid != null ? s.paid : (s.pay === 'paid' ? total : 0);
    d = { kind: 'sale', number: s.id, day: s.day, time: s.time, by: s.by, cust: c.walkin ? '' : c.name, method: s.method, total, paid, balance: c.owes, copy: !!(src && src.copy), cancelled: s.pay === 'undone',
      lines: s.lines.map(l => ({ name: prod(l[0]).name, qty: l[1], unit: prod(l[0]).price, total: prod(l[0]).price * l[1] })) };
  }
  d.balText = d.balance > 0 ? money(d.balance) : d.balance < 0 ? money(-d.balance) + ' in credit' : 'TZS 0';
  d.file = 'Receipt-' + d.number + '.pdf';
  return d;
}

/* the 58 mm paper, 32 letters across: exactly what the printer is sent (D207) */
function printLines(d) {
  const B = RT.blocks, o = [], rule = { t: '-'.repeat(WIDTH) }, add = (t, b) => o.push({ t, b });
  if (d.cancelled) o.push({ banner: 'CANCELLED' });
  if (B.logo && RT.logo) o.push({ logo: true });
  if (B.shop) wrapText(SHOP.name.toUpperCase()).forEach(t => add(centre(t), true));
  if (B.contact) { wrapText(RT.address).forEach(t => add(centre(t))); add(centre(SHOP.phone)); if (RT.tin) add(centre('TIN ' + RT.tin)); }
  if (B.header && RT.header) wrapText(fillIn(RT.header, d)).forEach(t => add(centre(t)));
  o.push(rule);
  if (B.meta) { add((d.kind === 'payment' ? 'Payment ' : 'Receipt ') + d.number, true); add(rdate(d.day) + '  ' + d.time); add('Served by ' + d.by); if (d.cust) wrapText('Customer ' + d.cust).forEach(t => add(t)); o.push(rule); }
  if (d.copy) { o.push({ banner: 'COPY' }); add(centre('Printed again 18 Oct 2026 11:05')); o.push(rule); }
  add(leftRight('ITEM', 'TZS'), true);
  d.lines.forEach(l => { if (l.qty) { wrapText(l.name).forEach(t => add(t)); add(leftRight('  ' + l.qty + ' x ' + num(l.unit), num(l.total))); } else add(leftRight(l.name, num(l.total))); });
  o.push(rule);
  add(leftRight(d.kind === 'payment' ? 'RECEIVED' : 'TOTAL', num(d.total)), true);
  if (B.payment && !d.cancelled) {
    if (d.kind === 'payment') add(leftRight('Paid by ' + d.method, num(d.paid)));
    else if (d.paid >= d.total) add(leftRight('Paid (' + d.method + ')', num(d.paid)));
    else { if (d.paid > 0) add(leftRight('Paid', num(d.paid))); add(leftRight('On credit', num(d.total - d.paid)), true); }
    if (d.cust && d.balance !== 0) add(leftRight('Balance owed', num(d.balance)));
  }
  if (B.how && d.balance > 0 && !d.cancelled) { o.push(rule); add(centre('Pay by Lipa Namba')); add(centre(SHOP.lipa.split(' ')[0])); }
  if (B.footer && RT.footer) { o.push(rule); wrapText(fillIn(RT.footer, d)).forEach(t => add(centre(t))); }
  return o;
}

/* the paper, for the receipt screen and the settings preview: 'print' is the thermal roll, 'pdf' is the A6 page */
const Paper = { props: { d: Object, mode: { type: String, default: 'print' } },
  setup(p) { const lines = computed(() => printLines(p.d)); const B = RT.blocks;
    return { lines, RT, B, LOGO, SHOP, rdate, num, money, fillIn }; },
  template: `<div class="mx-auto" :class="mode === 'print' ? 'w-[264px]' : 'w-[300px]'">

      <template v-for="(l, i) in lines" :key="i">

        <p v-if="B.header && RT.header" class="mt-1 italic text-neutral-600">{{ fillIn(RT.header, d) }}</p></div>
      <div v-if="B.meta" class="mt-4 grid grid-cols-2 gap-x-3 gap-y-0.5 border-y border-neutral-200 py-2"><span class="text-neutral-500">{{ d.kind === 'payment' ? 'Payment' : 'Receipt' }}</span><span class="text-right font-semibold">{{ d.number }}</span><span class="text-neutral-500">Date</span><span class="text-right">{{ rdate(d.day) }} {{ d.time }}</span><span class="text-neutral-500">Served by</span><span class="text-right">{{ d.by }}</span><template v-if="d.cust"><span class="text-neutral-500">Customer</span><span class="text-right">{{ d.cust }}</span></template></div>
      <div v-if="d.copy" class="mt-3 rounded border border-neutral-400 py-0.5 text-center text-[11px] font-bold tracking-widest text-neutral-600">COPY · printed again 18 Oct 2026 11:05</div>
      <table class="mt-3 w-full text-[12px]"><thead><tr class="border-b border-neutral-200 text-left text-[11px] uppercase tracking-wide text-neutral-500"><th class="pb-1 font-medium">Item</th><th class="pb-1 text-right font-medium">TZS</th></tr></thead>
        <tbody><tr v-for="(l, i) in d.lines" :key="i" class="align-top"><td class="py-1">{{ l.name }}<span v-if="l.qty" class="block text-[11px] text-neutral-500">{{ l.qty }} × {{ num(l.unit) }}</span></td><td class="py-1 text-right tabular-nums">{{ num(l.total) }}</td></tr></tbody></table>
      <div class="mt-2 flex items-baseline justify-between border-t border-neutral-900 pt-2 text-sm font-bold"><span>{{ d.kind === 'payment' ? 'Received' : 'Total' }}</span><span class="tabular-nums">{{ money(d.total) }}</span></div>
      <template v-if="B.payment"><div v-if="d.paid >= d.total" class="mt-1 flex justify-between text-neutral-600"><span>Paid ({{ d.method }})</span><span class="tabular-nums">{{ num(d.paid) }}</span></div>
        <div v-else class="mt-1 flex justify-between font-semibold"><span>On credit</span><span class="tabular-nums">{{ num(d.total - d.paid) }}</span></div>
        <div v-if="d.cust && d.balance !== 0" class="flex justify-between text-neutral-600"><span>Balance owed</span><span class="tabular-nums">{{ num(d.balance) }}</span></div></template>
      <p v-if="B.how && d.balance > 0" class="mt-3 text-center text-neutral-600">Pay by Lipa Namba {{ SHOP.lipa }}</p>
      <p v-if="B.footer && RT.footer" class="mt-4 text-center font-medium">{{ fillIn(RT.footer, d) }}</p></div>
    <div class="tear"></div></div>` };

/* ---- the sale is done (or a receipt asked for again): print it, share it, or start the next one */
const Receipt = { components: { Header, Icon, Btn, Pill, FooterBar, Paper },
  setup() {
    const d = computed(() => recData());
    const fresh = computed(() => !d.value.copy);
    const reason = computed(() => ({ off: S.printer + ' is off. Switch it on, then try again.', bt: 'Bluetooth is off on this phone. Turn it on, then try again.', none: 'No printer is chosen on this phone yet.' })[S.printFail]);
    const run = () => { S.print = 'printing'; setTimeout(() => { S.print = S.printFail ? 'failed' : 'done'; }, 1100); };
    const text = computed(() => printLines(d.value).filter(l => l.t !== undefined).map(l => l.t.trim()).filter(Boolean).join('\n'));
    watch(() => S.route, () => { S.print = 'idle'; });
    const left = computed(() => d.value.total - d.value.paid);
    return { S, d, fresh, reason, run, back, tab, toast, money, left, text };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header v-if="!fresh" :title="d.kind === 'payment' ? 'Payment receipt' : 'Receipt'" pushed hide-search/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto px-4 pb-6" :style="fresh ? { paddingTop: 'calc(24px + var(--sa-top))' } : { paddingTop: '16px' }">

/* a payment taken ends on its receipt as a sale does (D204) */
function newPayment(cid, amt, method, ids) {
  const n = 'P-00' + (91 + PAYMENTS.filter(p => p.fresh).length);
  const sales = ids.length ? ids : SALES.filter(s => s.c === cid && (s.pay === 'unpaid' || s.pay === 'part')).map(s => s.id).slice(0, 1);
  PAYMENTS.unshift({ id: n, c: cid, amt, acct: method === 'Cash' ? 'Cash drawer' : 'Lipa Namba', method, day: 'Today', time: '11:02', by: ME.value.name, sales: sales.length ? sales : ['S-1304'], fresh: true });
  S.recSrc = { kind: 'payment', id: n, copy: false }; S.print = 'idle'; S.stack.push(S.route); S.route = 'receipt';
}

/* the end of the day: stock, then cash, then send */
const Count = { components: { Header, Icon, Tile, Pill, Btn, Seg, Empty, FooterBar, Stepper },
  setup() {
    const steps = ['Stock', 'Cash', 'Send']; const expectedCash = 41500;
    const gaps = computed(() => PRODUCTS.filter(p => S.counted[p.id] !== p.stock));
    const cashGap = computed(() => (+S.cashCounted || 0) - expectedCash);
    const owner = computed(() => S.role === 'owner'); const hasGap = computed(() => gaps.value.length > 0 || cashGap.value !== 0);
    const next = () => { if (S.countStep < 2) S.countStep++; else { toast(owner.value || !hasGap.value ? 'The day is closed' : 'Sent to Amina'); S.countStep = 0; S.countPane = 'history'; } };
    const set = (p, d) => { S.counted[p.id] = Math.max(0, (S.counted[p.id] ?? p.stock) + d); };
    const decide = (c, yes) => { c.st = yes ? 'ok' : 'rejected'; toast(yes ? 'Gaps approved' : 'Sent back to Rehema'); };
    return { S, steps, gaps, cashGap, owner, hasGap, next, set, decide, PRODUCTS, COUNTS, expectedCash, money, money0, tint };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="End of day"/>
    <div class="scroll min-h-0 flex-1 overflow-y-auto"><div class="sticky top-0 z-10 border-b bg-background px-3 py-2.5"><Seg v-model="S.countPane" :tabs="[{ id: 'count', label: 'Count today' }, { id: 'history', label: 'History' }]"/></div>
      <div v-if="S.countPane === 'count'" class="p-3 pb-6">
        <div class="mb-3"><div class="mb-1.5 flex items-center justify-between text-xs"><span class="font-medium">Step {{ S.countStep + 1 }} of 3 · {{ steps[S.countStep] }}</span><span class="text-muted-foreground">Tue 13 Oct</span></div><div class="flex gap-1"><span v-for="(s, i) in steps" :key="s" :class="['h-1 flex-1 rounded-full', i <= S.countStep ? 'bg-primary' : 'bg-muted']"></span></div></div>
        <template v-if="S.countStep === 0"><p class="mb-2 px-1 text-xs text-muted-foreground">Count what is on the shelf. The books say how many there should be.</p><div class="overflow-hidden rounded-xl border bg-card"><div v-for="(p, i) in PRODUCTS" :key="p.id" :class="['flex items-center gap-3 p-3', i ? 'border-t' : '']"><Tile :p="p" :size="36"/><span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">{{ p.name }}</span>
          <span :class="['block text-xs tnum', S.counted[p.id] === p.stock ? 'text-muted-foreground' : 'font-medium text-warning']">{{ S.counted[p.id] === p.stock ? 'Books: ' + p.stock : (S.counted[p.id] < p.stock ? (p.stock - S.counted[p.id]) + ' short' : (S.counted[p.id] - p.stock) + ' more') + ' · books say ' + p.stock }}</span></span>
          <Stepper size="sm" :q="S.counted[p.id]" :step="1" :max="9999" @sub="set(p, -1)" @add="set(p, 1)"/></div></div></template>
        <template v-else-if="S.countStep === 1"><div class="rounded-xl border bg-card p-4"><p class="text-xs text-muted-foreground">The drawer should have</p><p class="text-2xl font-semibold tnum">{{ money(expectedCash) }}</p><p class="mt-0.5 text-xs text-muted-foreground">from the drawer's money ledger</p>
          <p class="mb-1.5 mt-4 text-[11px] font-semibold uppercase tracking-wider text-muted-foreground">Count the cash</p><label class="flex h-12 items-center gap-2 rounded-md border-2 border-primary px-3"><span class="text-sm text-muted-foreground">TZS</span><input v-model.number="S.cashCounted" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Cash counted" class="min-w-0 flex-1 bg-transparent text-right text-xl font-semibold tnum outline-none"></label>
          <p :class="['mt-3 rounded-md px-3 py-2 text-sm', cashGap === 0 ? 'bg-success/10 text-success' : 'bg-warning/10 text-warning']">{{ cashGap === 0 ? 'The drawer matches.' : 'The drawer is ' + money(Math.abs(cashGap)) + (cashGap < 0 ? ' short.' : ' over.') }}</p></div></template>
        <template v-else><div class="rounded-xl border bg-card p-4"><p class="text-sm font-semibold">{{ hasGap ? 'There are gaps' : 'Everything matches' }}</p>
          <div class="mt-2 space-y-1.5 text-sm"><p v-for="p in gaps" :key="p.id" class="flex justify-between"><span>{{ p.name }}</span><span class="font-medium text-warning tnum">{{ S.counted[p.id] - p.stock > 0 ? '+' : '−' }}{{ Math.abs(S.counted[p.id] - p.stock) }}</span></p><p class="flex justify-between"><span>Cash drawer</span><span :class="['font-medium tnum', cashGap ? 'text-warning' : 'text-success']">{{ cashGap ? money0(cashGap) : 'matches' }}</span></p></div></div>
          <label class="mt-3 block text-sm font-medium">Note<input v-model="S.countNote" placeholder="Anything Amina should know" class="mt-1.5 flex h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm shadow-sm outline-none focus-visible:ring-1 focus-visible:ring-ring"></label>
          <p v-if="!owner && hasGap" class="mt-3 flex items-start gap-2 rounded-md bg-primary/10 p-3 text-sm text-primary"><Icon name="Hourglass" :size="16" class="mt-0.5"/>Gaps wait for Amina. The day closes after she approves.</p></template></div>
      <div v-else class="space-y-2 p-3 pb-6"><div v-for="c in COUNTS" :key="c.id" class="rise rounded-xl border bg-card p-3.5"><div class="flex items-center justify-between"><span class="text-sm font-semibold">{{ c.day }}</span><Pill :tone="c.st === 'waiting' ? 'warning' : c.st === 'ok' ? 'success' : 'muted'">{{ c.st === 'waiting' ? 'Waiting for Amina' : c.st === 'ok' ? 'Closed' : 'Sent back' }}</Pill></div><p class="mt-1 text-xs text-muted-foreground">{{ c.id }} · by {{ c.by }}</p><p class="mt-1 text-sm">{{ c.gaps }}</p>
        <div v-if="c.st === 'waiting' && owner" class="mt-3 grid grid-cols-2 gap-2"><Btn v="outline" size="md" @click="decide(c, false)">Send back</Btn><Btn size="md" @click="decide(c, true)">Approve gaps</Btn></div></div></div></div>
    <FooterBar v-if="S.countPane === 'count'"><div class="grid gap-2" :class="S.countStep ? 'grid-cols-[1fr_2fr]' : 'grid-cols-1'"><Btn v-if="S.countStep" v="outline" @click="S.countStep--">Back</Btn><Btn @click="next">{{ S.countStep < 2 ? 'Next: ' + steps[S.countStep + 1] : (owner || !hasGap ? 'Close the day' : 'Send to Amina') }}</Btn></div></FooterBar></div>` };

const msgParts = (t) => { const u = [...t].some(ch => ch.charCodeAt(0) > 127); const n = t.length; if (!n) return ''; const one = u ? 70 : 160, many = u ? 67 : 153; return `${n} · ${n <= one ? 1 : Math.ceil(n / many)} SMS`; };
const msgUndo = (text, run) => { clearTimeout(msgUndo.t); MSG.undo = { text, run }; msgUndo.t = setTimeout(() => (MSG.undo = null), 5000); };

const SwipeRowP = { props: { label: String, icon: String }, emits: ['swipe', 'open', 'menu'], components: { Icon },
  setup(p, { emit }) {
    const dx = ref(0); let x0 = null, t = null, long = false;
    const down = (e) => { x0 = e.clientX; long = false; t = setTimeout(() => { long = true; emit('menu'); }, 480); };
    const move = (e) => { if (x0 == null) return; const d = e.clientX - x0; if (Math.abs(d) > 8) clearTimeout(t); dx.value = d; };
    const up = () => { clearTimeout(t); if (x0 == null) return; const d = dx.value; x0 = null; if (Math.abs(d) > 96) { dx.value = d > 0 ? 400 : -400; setTimeout(() => { emit('swipe'); dx.value = 0; }, 180); } else { dx.value = 0; if (!long && Math.abs(d) < 8) emit('open'); } };
    return { dx, down, move, up };
  },
  template: `<div class="relative select-none overflow-hidden" style="touch-action: pan-y">
    <div v-if="dx" class="absolute inset-0 flex items-center justify-between bg-primary/15 px-6 text-sm font-semibold text-primary"><span class="flex items-center gap-2" :class="Math.abs(dx) > 96 ? 'scale-110' : ''"><Icon :name="icon" :size="18"/>{{ label }}</span><span class="flex items-center gap-2" :class="Math.abs(dx) > 96 ? 'scale-110' : ''">{{ label }}<Icon :name="icon" :size="18"/></span></div>

/* ============================================================ A hidden space behind search (P121 example)
   A space no menu shows: typing its passphrase into search opens it, and every search tries that first at the same cost,
   so search looks the same with or without one. It locks when you leave its pages or the app goes to the background.
   Setup comes at the first action that needs it (passphrase twice, a recovery key shown once), then that action runs.
   Also drawn: ChoiceSheet (a question with one tick box) and MessageDetails (a message's times). Prototype passphrase:
   "open sesame". */
const SPACE = reactive({
  exists: false, open: false, step: 1, p1: '', p2: '', tried: false, key: 'RTN7-R4EI-XQ3O-ZHOB-RKEQ-L5CO-ZI', q: '', hits: null, tab: 'conv',

    { id: 'h2', name: '+255 689 004 117', c: '#64748b', ini: '', walkin: true, tag: 'Blocked · they get no signal', icon: 'Ban', last: 'Why are you ignoring me', at: 'Mon' }],
  rules: [{ id: 'r1', kind: 'Private number', value: '+255 741 398 494', icon: 'Lock' }, { id: 'r2', kind: 'Number', value: '+255 689 004 117', icon: 'Ban' }, { id: 'r3', kind: 'Prefix', value: '+25568', icon: 'Ban' }],
  kind: 'Number', val: '', choice: false, box: true, details: false, undo: null,
});
const PASS = 'open sesame';

const SpaceSearch = { components: { Header, Icon, Empty },
  setup() {
    const run = () => { const w = SPACE.q.trim(); if (!w) return; setTimeout(() => { if (SPACE.exists && w === PASS) { SPACE.q = ''; SPACE.hits = null; SPACE.open = true; go('space'); } else SPACE.hits = MSG.threads.flatMap(t => t.msgs.filter(m => m.body.toLowerCase().includes(w.toLowerCase())).map(m => ({ ...m, who: t.name }))); }, 420); };
    return { SPACE, run };
  },
  template: `<div class="flex min-h-0 flex-1 flex-col"><Header title="Search" pushed hideSearch/>
    <form class="flex items-center gap-2 border-b px-3 py-2" @submit.prevent="run"><input v-model="SPACE.q" type="search" class="h-10 min-w-0 flex-1 rounded-full bg-muted px-4 text-sm outline-none" placeholder="Search messages"/><button class="press grid h-9 w-9 place-items-center rounded-full" aria-label="Search"><Icon name="Search" :size="20"/></button></form>

   password, a password reset by code, one organisation (no picker or switcher), the menu built from the permissions, and no notifications

  kind: 'kit', user: 'rehema.k', codeErr: false, wait: 0,

function codeCountdown(n) { BACKEND.wait = n; clearInterval(backendTick); backendTick = setInterval(() => { if (BACKEND.wait > 0) BACKEND.wait--; else clearInterval(backendTick); }, 1000); }
