<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bootbox Phone</title>
<meta name="description" content="Bootbox drawn for a phone only: its own shell, bottom bar, cards and sheets. Clickable.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
/* Layout concept: one 390 x 844 phone (the only layout there is) beside a prototype picker on a desktop, the app alone on a phone.
   Tokens are the example's own (blue accent), kept in HSL channels; the sizes are the phone kit's (see the Design system screen). */
tailwind.config = {
  theme: { extend: {
    fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] },
    colors: ['background','foreground','card','muted','muted-foreground','border','input','primary','primary-foreground','destructive','warning','success','canvas','ring']
      .reduce((o, k) => (o[k] = 'hsl(var(--' + k + ') / <alpha-value>)', o), {}),
    borderRadius: { sm: 'calc(var(--radius) - 4px)', md: 'calc(var(--radius) - 2px)', lg: 'var(--radius)' }
  } }
};
</script>
<style>
:root { --canvas: 220 14% 96%; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --canvas: 240 10% 5%; color-scheme: dark; } }
:root[data-theme="dark"] { --canvas: 240 10% 5%; color-scheme: dark; }
body { margin: 0; background: hsl(var(--canvas)); font-family: Geist, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.app { --sa-real: 30px; --sa-top: 30px; --sa-bottom: 14px; --kbd: 0px;
  --background: 0 0% 100%; --foreground: 240 10% 3.9%; --card: 0 0% 100%; --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 42%;
  --border: 240 5.9% 90%; --input: 240 5.9% 86%; --primary: 221 83% 45%; --primary-foreground: 0 0% 98%; --ring: 221 83% 45%; --radius: 0.6rem;
  --destructive: 0 72% 48%; --warning: 32 92% 38%; --success: 152 64% 28%;
  --c1: #14937f; --c2: #d06d0a; --c3: #2f6fe0; --c4: #d6456a; --c5: #7c5ad8; --c-other: #94a3b8;
  background: hsl(var(--background)); color: hsl(var(--foreground)); font-size: 15px; line-height: 1.4; }
.app.topbar { --sa-top: 0px; }
.app.dark { --background: 240 10% 3.9%; --foreground: 0 0% 96%; --card: 240 6% 8.5%; --muted: 240 3.7% 14%; --muted-foreground: 240 5% 64.9%;
  --border: 240 3.7% 17%; --input: 240 3.7% 20%; --primary: 217 91% 64%; --primary-foreground: 222 47% 8%; --ring: 217 91% 64%;
  --destructive: 0 70% 58%; --warning: 38 92% 56%; --success: 152 52% 52%;
  --c1: #1f9e89; --c2: #c97514; --c3: #4c82e8; --c4: #dc5577; --c5: #8f73e3; --c-other: #64748b; }
.app *, .app *::before, .app *::after { border-color: hsl(var(--border)); box-sizing: border-box; }
:where(.app) button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }   /* :where keeps it below Tailwind text colours (a red Delete stayed the body colour) */
:where(.app) input { font: inherit; color: inherit; }
.scroll { scrollbar-width: none; overscroll-behavior: contain; } .scroll::-webkit-scrollbar { display: none; }
.tnum { font-variant-numeric: tabular-nums; }
.press { transition: transform .12s ease, background-color .12s ease; } .press:active { transform: scale(.98); }
.sheet-enter-active, .sheet-leave-active { transition: transform .28s cubic-bezier(.2,.8,.2,1); } .sheet-enter-from, .sheet-leave-to { transform: translateY(100%); }
.fade-enter-active, .fade-leave-active { transition: opacity .2s ease; } .fade-enter-from, .fade-leave-to { opacity: 0; }
.drawer-enter-active, .drawer-leave-active { transition: transform .26s cubic-bezier(.2,.8,.2,1); } .drawer-enter-from, .drawer-leave-to { transform: translateX(-100%); }
.pop-enter-active, .pop-leave-active { transition: opacity .18s ease, transform .18s ease; } .pop-enter-from, .pop-leave-to { opacity: 0; transform: translateY(8px) scale(.98); }
.paper { background: #fff; color: #171717; box-shadow: 0 1px 2px rgb(0 0 0 / .12), 0 8px 24px rgb(0 0 0 / .10); } .tear { height: 7px; background: linear-gradient(-45deg, transparent 5px, #fff 0) 0 0 / 10px 10px repeat-x, linear-gradient(45deg, transparent 5px, #fff 0) 0 0 / 10px 10px repeat-x; filter: drop-shadow(0 2px 2px rgb(0 0 0 / .08)); transform: rotate(180deg); margin-top: -1px; }
.rise { animation: rise .4s cubic-bezier(.2,.8,.2,1) both; } @keyframes rise { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulse2 { 50% { opacity: .5; } } .skel { animation: pulse2 1.6s ease-in-out infinite; background: hsl(var(--muted)); }
/* ---- P118 phone motion: P116's tokens, defined once. `.slowmo` (prototype only) stretches them so a shot catches a page mid-slide. */
.app { --dur-fast: 120ms; --dur-base: 180ms; --dur-slow: 280ms; --ease-standard: cubic-bezier(.2,.8,.2,1); --ease-exit: cubic-bezier(.4,0,1,1); }
.app.slowmo { --dur-base: 1400ms; --dur-slow: 1800ms; }
/* pages: push from the right, pop back to the right; tabs fade; wizard steps slide by direction (PageTransition) */
.pg-push-enter-active, .pg-push-leave-active, .pg-step-next-enter-active, .pg-step-next-leave-active { transition: transform var(--dur-slow) var(--ease-standard), opacity var(--dur-slow) var(--ease-standard); }
.pg-push-enter-from, .pg-step-next-enter-from { transform: translateX(100%); } .pg-push-enter-active, .pg-step-next-enter-active { position: relative; z-index: 2; box-shadow: -12px 0 24px rgb(0 0 0 / .10); }
.pg-push-leave-to, .pg-step-next-leave-to { transform: translateX(-24%); opacity: .5; }
.pg-pop-enter-active, .pg-pop-leave-active, .pg-step-back-enter-active, .pg-step-back-leave-active { transition: transform calc(var(--dur-slow) * .85) var(--ease-exit), opacity calc(var(--dur-slow) * .85) var(--ease-exit); }
.pg-pop-leave-active, .pg-step-back-leave-active { z-index: 2; box-shadow: -12px 0 24px rgb(0 0 0 / .10); } .pg-pop-leave-to, .pg-step-back-leave-to { transform: translateX(100%); }
.pg-pop-enter-from, .pg-step-back-enter-from { transform: translateX(-24%); opacity: .5; }
.pg-step-next-leave-active, .pg-step-back-leave-active { pointer-events: none; } /* pinned at its own box by pinLeaving (P118), never inset: 0 */
.pg-tab-enter-active, .pg-tab-leave-active { transition: opacity var(--dur-base) ease; } .pg-tab-enter-from, .pg-tab-leave-to { opacity: 0; }
/* the splash opens (SplashOpen): a circle closes into the mark; an example P114 boot loader builds its mark meanwhile (CSS only) */
.splash { position: absolute; inset: 0; z-index: 120; display: grid; place-items: center; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); clip-path: circle(150% at 50% 42%); }
.splash.opening { animation: splash-open 520ms var(--ease-exit) forwards; }
@keyframes splash-open { to { clip-path: circle(0% at 50% 42%); } }
.boot-mark .b1 { transform-origin: 50% 100%; animation: boot-grow 420ms var(--ease-standard) 120ms both; }
.boot-mark .b2 { transform-origin: 50% 100%; animation: boot-grow 420ms var(--ease-standard) 240ms both; }
.boot-mark .b3 { transform-origin: 50% 100%; animation: boot-grow 420ms var(--ease-standard) 360ms both; }
.boot-mark .roof { animation: boot-drop 480ms var(--ease-standard) 520ms both; }
@keyframes boot-grow { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes boot-drop { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
/* the done moment (DoneMoment): the ring draws, then the tick, a soft burst */
@keyframes draw { to { stroke-dashoffset: 0; } } @keyframes burst { from { transform: scale(.4); opacity: .55; } to { transform: scale(1.7); opacity: 0; } }
.ok-ring { stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw 420ms var(--ease-standard) forwards; }
.ok-tick { stroke-dasharray: 48; stroke-dashoffset: 48; animation: draw 280ms var(--ease-standard) 300ms forwards; }
.ok-burst { animation: burst 600ms var(--ease-standard) 260ms both; }
.rise-late { animation: rise .4s var(--ease-standard) both; animation-delay: calc(400ms + var(--i, 0) * 60ms); }
/* the code step (P117): a wrong code shakes once; the caret blinks in the next box */
@keyframes shake { 0%, 100% { transform: none; } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } } .shake { animation: shake 300ms var(--ease-standard) 1; }
@keyframes blink { 50% { opacity: 0; } } .caret { animation: blink 1s steps(1) infinite; }
/* reduced motion: the system setting, or the app's own (`.reduce`); everything appears at once, the check is already drawn */
.app.reduce *, .app.reduce *::before, .app.reduce *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
.app.reduce .splash.opening { animation: splash-fade 120ms linear forwards !important; } @keyframes splash-fade { to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .app *, .app *::before, .app *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } .app .splash.opening { animation: splash-fade 120ms linear forwards !important; } }
@media (prefers-reduced-motion: reduce) { .rise, .skel { animation: none; } .sheet-enter-active, .sheet-leave-active, .drawer-enter-active, .drawer-leave-active, .pop-enter-active, .pop-leave-active { transition: none; } }
@keyframes msg-drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
